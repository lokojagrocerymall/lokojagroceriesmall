<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse - LGM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-gray-50">
<header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-10"><a href="index.html" class="font-black text-green-700 text-sm">← Back to Home</a><a href="cart.html" class="text-xl relative">🛒<span id="cartCount" class="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] rounded-full px-1.5 py-0.5">0</span></a></header>
<div class="p-3"><div class="flex gap-2 mb-3"><input id="searchInput" placeholder="🔍 Search..." class="flex-1 border-2 p-3 rounded-xl text-sm"><select id="sortSelect" onchange="sortProducts()" class="border-2 p-2 rounded-xl text-xs"><option value="newest">Newest</option><option value="price-low">Price Low-High</option><option value="price-high">Price High-Low</option></select></div><div class="flex gap-2 overflow-x-auto pb-2 mb-3"><button onclick="filterCat('All')" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">All</button><button onclick="filterCat('Fruits & Vegetables')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Fruits & Veg</button><button onclick="filterCat('Meat & Fish')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Meat & Fish</button><button onclick="filterCat('Foodstuff')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Foodstuff</button></div><p id="count" class="text-xs text-gray-500 mb-2">0 products</p><div id="grid" class="grid grid-cols-2 gap-3"><p class="text-xs text-gray-400">Loading...</p></div>

<!-- PAGINATION - NEW -->
<div id="pagination" class="flex justify-center items-center gap-1 mt-6 mb-6 flex-wrap"></div>

</div>
<div id="cartModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center"><div class="bg-white w-full md:max-w-sm rounded-t-[24px] md:rounded-2xl p-5 max-h-[90vh] overflow-y-auto"><div class="flex gap-3 mb-4"><img id="mImage" class="w-20 h-20 object-cover rounded-xl bg-gray-100"><div><p id="mName" class="font-black text-sm"></p><p id="mCategory" class="text-xs text-gray-400"></p><p id="mPrice" class="font-black text-green-700 mt-1"></p></div></div>

<!-- VARIATIONS SELECTOR - NEW -->
<div id="variationSection" class="hidden mb-4">
  <p class="text-sm font-bold mb-2">Size <span class="text-xs text-gray-400 font-normal">Please select variations</span></p>
  <div id="variationList" class="flex gap-2 flex-wrap"></div>
</div>

<div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center mb-4"><span class="text-sm font-bold">Quantity</span><div class="flex items-center gap-3"><button onclick="changeQty(-1)" class="w-9 h-9 bg-white border-2 rounded-full font-black">-</button><span id="mQty" class="font-black w-6 text-center">1</span><button onclick="changeQty(1)" class="w-9 h-9 bg-green-600 text-white rounded-full font-black">+</button></div></div><div class="flex justify-between mb-4"><span class="text-sm text-gray-500">Total</span><span id="mTotal" class="font-black text-green-700">₦0</span></div><button id="addBtn" onclick="confirmAddToCart()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black mb-2">Add • <span id="mTotalBtn">₦0</span></button><div class="grid grid-cols-2 gap-2"><button onclick="closeModal()" class="bg-gray-100 py-3 rounded-xl font-bold text-sm">Continue Shopping</button><button onclick="goToCart()" class="bg-yellow-500 text-white py-3 rounded-xl font-bold text-sm">View Cart →</button></div></div></div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let all=[];let filtered=[];let selectedProduct=null;let selectedVariation=null;let currentQty=1;
let currentPage=1;const perPage=12;

async function load(){
  try{
    const {data, error} = await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    // Load variations
    const {data: vars} = await supabaseClient.from('product_variations').select('*');
    all = (data||[]).map(p => ({...p, variations: (vars||[]).filter(v => v.product_id === p.id)}));
    filtered = all;
    document.getElementById('count').innerText=all.length+' products found';
    currentPage=1; render();
  }catch(e){
    document.getElementById('grid').innerHTML='<p class="text-xs text-red-500">Error: '+e.message+'<br>Run SQL to create products table</p>';
  }
}

function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  const start=(currentPage-1)*perPage; const list=filtered.slice(start, start+perPage);
  if(list.length===0){g.innerHTML='<p class="col-span-2 text-center text-xs text-gray-400 py-10">No products yet<br>Vendor needs to add in Vendor Dashboard</p>'; document.getElementById('pagination').innerHTML=''; return;}
  list.forEach(p=>{
    const imgUrl = p.image || p.image_url || 'https://via.placeholder.com/200?text=No+Image';
    const hasVar = p.variations && p.variations.length>0;
    let priceHtml='';
    if(hasVar){
      const prices=p.variations.map(v=>Number(v.price)); const min=Math.min(...prices), max=Math.max(...prices);
      priceHtml = min===max? `₦${min.toLocaleString()}` : `₦${min.toLocaleString()} - ₦${max.toLocaleString()}`;
    } else { priceHtml = `₦${Number(p.price).toLocaleString()}`; }
    const stock = hasVar? p.variations.reduce((a,v)=>a+(v.stock||0),0) : (p.stock||0);
    const outOfStock = stock===0;
    const d=document.createElement('div');d.className='bg-white rounded-2xl shadow p-2';
    d.innerHTML=`<img src="${imgUrl}" class="w-full h-28 object-cover rounded-xl mb-2 bg-gray-100" onerror="this.src='https://via.placeholder.com/200'"><p class="font-bold text-xs truncate">${p.name}</p><p class="text-[10px] text-gray-400">${p.category||''} • ${stock} left</p><p class="font-black text-green-700">${priceHtml}</p><button ${outOfStock?'disabled':''} onclick="openModal('${p.id}')" class="w-full ${outOfStock?'bg-gray-200 text-gray-400':'bg-green-600 text-white'} text-xs py-2 rounded-xl mt-1 font-bold">${outOfStock?'Out of Stock':(hasVar?'Select options':'Add to Cart')}</button>`;
    g.appendChild(d);
  });
  renderPagination();
}

function renderPagination(){
  const totalPages=Math.ceil(filtered.length/perPage);
  const pag=document.getElementById('pagination'); pag.innerHTML='';
  if(totalPages<=1) return;
  let html=`<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} class="w-8 h-8 rounded-full bg-white border flex items-center justify-center text-sm ${currentPage===1?'opacity-40':''}">←</button>`;
  for(let i=1;i<=totalPages;i++){
    if(i===1 || i===totalPages || (i>=currentPage-1 && i<=currentPage+1)){
      html+=`<button onclick="goPage(${i})" class="w-8 h-8 rounded-full text-xs font-bold ${i===currentPage?'bg-green-600 text-white':'bg-white border'}">${i}</button>`;
    } else if(i===currentPage-2 || i===currentPage+2){
      html+=`<span class="px-1 text-gray-400">...</span>`;
    }
  }
  html+=`<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="w-8 h-8 rounded-full bg-white border flex items-center justify-center text-sm ${currentPage===totalPages?'opacity-40':''}">→</button>`;
  pag.innerHTML=html;
}
function goPage(p){ const total=Math.ceil(filtered.length/perPage); if(p<1||p>total) return; currentPage=p; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function openModal(id){
  selectedProduct=all.find(p=>String(p.id)===String(id)); selectedVariation=null; currentQty=1;
  const imgUrl = selectedProduct.image || selectedProduct.image_url || 'https://via.placeholder.com/200';
  document.getElementById('mImage').src=imgUrl;
  document.getElementById('mName').innerText=selectedProduct.name;
  document.getElementById('mCategory').innerText=(selectedProduct.category||'')+' • '+(selectedProduct.stock||0)+' left';
  const hasVar = selectedProduct.variations && selectedProduct.variations.length>0;
  const varSec=document.getElementById('variationSection');
  if(hasVar){
    varSec.classList.remove('hidden');
    document.getElementById('variationList').innerHTML = selectedProduct.variations.map(v=>`
      <button id="var-${v.id}" onclick="selectVariation('${v.id}')" ${v.stock===0?'disabled':''} class="px-3 py-1.5 rounded-full border text-xs ${v.stock===0?'line-through opacity-50 bg-gray-100':'bg-white'}">${v.size}</button>
    `).join('');
    document.getElementById('mPrice').innerText='Please select variations';
    document.getElementById('addBtn').classList.add('opacity-50'); document.getElementById('addBtn').disabled=true;
  } else {
    varSec.classList.add('hidden');
    document.getElementById('mPrice').innerText='₦'+Number(selectedProduct.price).toLocaleString();
    document.getElementById('addBtn').classList.remove('opacity-50'); document.getElementById('addBtn').disabled=false;
  }
  updateTotal();
  document.getElementById('cartModal').classList.remove('hidden');
}
function selectVariation(vid){
  selectedVariation = selectedProduct.variations.find(v=>String(v.id)===String(vid));
  selectedProduct.variations.forEach(v=>{
    const btn=document.getElementById('var-'+v.id);
    if(btn) btn.className='px-3 py-1.5 rounded-full border text-xs '+(String(v.id)===String(vid)?'bg-green-600 text-white border-green-600':'bg-white');
  });
  document.getElementById('mPrice').innerText='₦'+Number(selectedVariation.price).toLocaleString();
  document.getElementById('addBtn').classList.remove('opacity-50'); document.getElementById('addBtn').disabled=false;
  updateTotal();
}
function getPrice(){ return selectedVariation? Number(selectedVariation.price) : Number(selectedProduct.price); }
function changeQty(d){ const max = selectedVariation? (selectedVariation.stock||99) : (selectedProduct.stock||99); currentQty=Math.max(1,Math.min(max,currentQty+d));document.getElementById('mQty').innerText=currentQty;updateTotal();}
function updateTotal(){ if(!selectedProduct) return; const t=getPrice()*currentQty; document.getElementById('mTotal').innerText='₦'+t.toLocaleString(); document.getElementById('mTotalBtn').innerText='₦'+t.toLocaleString(); }
function closeModal(){document.getElementById('cartModal').classList.add('hidden');}
function confirmAddToCart(){
  if(selectedProduct.variations && selectedProduct.variations.length>0 &&!selectedVariation){ alert('Please select a variation (Size) first'); return; }
  let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');
  const price=getPrice(); const name = selectedVariation? `${selectedProduct.name} - ${selectedVariation.size}` : selectedProduct.name;
  const cartId = selectedVariation? `${selectedProduct.id}_${selectedVariation.id}` : `${selectedProduct.id}`;
  const ex=cart.find(c=>c.id===cartId);
  const imgUrl = selectedProduct.image || selectedProduct.image_url || '';
  if(ex){ ex.qty+=currentQty; ex.image=imgUrl||ex.image; }
  else cart.push({id:cartId, name:name, price:price, image:imgUrl, qty:currentQty});
  localStorage.setItem('lgm_cart',JSON.stringify(cart));
  loadCart();closeModal();
}
function goToCart(){confirmAddToCart();location.href='cart.html';}
function filterCat(c){ if(c==='All') filtered=all; else filtered=all.filter(p=>(p.category||'').toLowerCase().includes(c.split(' ')[0].toLowerCase())); currentPage=1; render(); }
function sortProducts(){ const s=document.getElementById('sortSelect').value; let l=[...filtered]; if(s==='price-low')l.sort((a,b)=> (a.variations?.length? Math.min(...a.variations.map(v=>v.price)) : a.price) - (b.variations?.length? Math.min(...b.variations.map(v=>v.price)) : b.price)); if(s==='price-high')l.sort((a,b)=> (b.variations?.length? Math.max(...b.variations.map(v=>v.price)) : b.price) - (a.variations?.length? Math.max(...a.variations.map(v=>v.price)) : a.price)); filtered=l; currentPage=1; render(); }
document.getElementById('searchInput').addEventListener('input',e=>{ filtered=all.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase())); currentPage=1; render(); });
function loadCart(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}loadCart();load();
</script></body></html>
