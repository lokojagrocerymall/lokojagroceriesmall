<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse Products - LGM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-50">
<header class="bg-white shadow p-3 flex justify-between items-center"><a href="index.html" class="font-black text-green-700">← Lokoja Grocery Mall</a><a href="cart.html">🛒<span id="cartCount" class="bg-green-600 text-white text-xs rounded-full px-1">0</span></a></header>
<div class="p-3"><div class="flex gap-2 mb-3"><input id="searchInput" placeholder="🔍 Search products..." class="flex-1 border-2 p-3 rounded-xl"><select id="sortSelect" class="border-2 p-2 rounded-xl"><option value="newest">Newest</option><option value="price-low">Price Low</option><option value="price-high">Price High</option></select></div><div class="flex gap-2 overflow-x-auto pb-2 mb-3"><button onclick="filterCat('All')" id="cat-All" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">All</button><button onclick="filterCat('Fruits & Vegetables')" class="bg-white px-4 py-2 rounded-full text-xs border">Fruits & Vegetables</button><button onclick="filterCat('Meat & Fish')" class="bg-white px-4 py-2 rounded-full text-xs border">Meat & Fish</button><button onclick="filterCat('Foodstuff')" class="bg-white px-4 py-2 rounded-full text-xs border">Foodstuff</button><button onclick="filterCat('Garri')" class="bg-white px-4 py-2 rounded-full text-xs border">Garri</button></div><p id="count" class="text-xs text-gray-500 mb-2">0 products found</p><div id="grid" class="grid grid-cols-2 gap-3"></div><div id="empty" class="hidden text-center py-20 text-gray-400">🏪<br>No products yet. Add products from vendor dashboard</div><p id="status" class="text-center text-xs mt-4 text-gray-400"></p></div>
<script>
const SUPABASE_URL="https://fkpvzlifmsykztndlcyh.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrcHZ6bGlmbXN5a3p0bmRsY3loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjc0MjcsImV4cCI6MjEwNDYwMzQyN30.guANuUKctqrI4PZC_mFzZ0wHhlOyVdgGCx6wo2ZnFrs";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let all=[];
async function load(){document.getElementById('status').innerText='Loading from cloud...';const{data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error){document.getElementById('status').innerText='❌ '+error.message;return;}all=data||[];document.getElementById('status').innerText='✅ '+all.length+' products loaded';render(all);}
function render(list){const g=document.getElementById('grid');const e=document.getElementById('empty');const c=document.getElementById('count');g.innerHTML='';c.innerText=list.length+' products found';if(list.length===0){e.classList.remove('hidden');g.classList.add('hidden');return;}e.classList.add('hidden');g.classList.remove('hidden');list.forEach(p=>{const d=document.createElement('div');d.className='bg-white rounded-2xl shadow p-2';d.innerHTML=`<img src="${p.image||'https://via.placeholder.com/200'}" class="w-full h-28 object-cover rounded-xl mb-2"><p class="font-bold text-xs truncate">${p.name}</p><p class="text-[10px] text-gray-400">${p.category||'Others'} • ${p.stock||0} left</p><p class="font-black text-green-700">₦${p.price}</p><button onclick="addToCart(${p.id})" class="w-full bg-green-600 text-white text-xs py-2 rounded-xl mt-1 font-bold">Add to Cart</button>`;g.appendChild(d);});}
function filterCat(cat){if(cat==='All'){render(all);return;}const f=all.filter(p=>(p.category||'').toLowerCase().includes(cat.toLowerCase().split(' ')[0])||p.category===cat);render(f);}
function addToCart(id){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');const prod=all.find(p=>p.id===id);const ex=cart.find(c=>c.id===id);if(ex)ex.qty++;else cart.push({id:prod.id,name:prod.name,price:prod.price,image:prod.image,qty:1});localStorage.setItem('lgm_cart',JSON.stringify(cart));document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);alert(prod.name+' added!');}
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(all.filter(p=>p.name.toLowerCase().includes(q)));});
function loadCart(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}
loadCart();load();
</script></body></html>
