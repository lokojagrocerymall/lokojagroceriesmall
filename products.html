<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse - LGM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-gray-50">
<header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-10"><a href="index.html" class="font-black text-green-700 text-sm">← Back to Home</a><a href="cart.html" class="text-xl relative">🛒<span id="cartCount" class="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] rounded-full px-1.5 py-0.5">0</span></a></header>
<div class="p-3"><div class="flex gap-2 mb-3"><input id="searchInput" placeholder="🔍 Search..." class="flex-1 border-2 p-3 rounded-xl text-sm"><select id="sortSelect" onchange="sortProducts()" class="border-2 p-2 rounded-xl text-xs"><option value="newest">Newest</option><option value="price-low">Price Low-High</option><option value="price-high">Price High-Low</option></select></div><div class="flex gap-2 overflow-x-auto pb-2 mb-3"><button onclick="filterCat('All')" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">All</button><button onclick="filterCat('Fruits & Vegetables')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Fruits & Veg</button><button onclick="filterCat('Meat & Fish')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Meat & Fish</button><button onclick="filterCat('Foodstuff')" class="bg-white px-4 py-2 rounded-full text-xs border whitespace-nowrap">Foodstuff</button></div><p id="count" class="text-xs text-gray-500 mb-2">0 products</p><div id="grid" class="grid grid-cols-2 gap-3"><p class="text-xs text-gray-400">Loading...</p></div></div>
<div id="cartModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end md:items-center justify-center"><div class="bg-white w-full md:max-w-sm rounded-t-[24px] md:rounded-2xl p-5"><div class="flex gap-3 mb-4"><img id="mImage" class="w-20 h-20 object-cover rounded-xl"><div><p id="mName" class="font-black text-sm"></p><p id="mCategory" class="text-xs text-gray-400"></p><p id="mPrice" class="font-black text-green-700 mt-1"></p></div></div><div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center mb-4"><span class="text-sm font-bold">Quantity</span><div class="flex items-center gap-3"><button onclick="changeQty(-1)" class="w-9 h-9 bg-white border-2 rounded-full font-black">-</button><span id="mQty" class="font-black w-6 text-center">1</span><button onclick="changeQty(1)" class="w-9 h-9 bg-green-600 text-white rounded-full font-black">+</button></div></div><div class="flex justify-between mb-4"><span class="text-sm text-gray-500">Total</span><span id="mTotal" class="font-black text-green-700">₦0</span></div><button onclick="confirmAddToCart()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black mb-2">Add • <span id="mTotalBtn">₦0</span></button><div class="grid grid-cols-2 gap-2"><button onclick="closeModal()" class="bg-gray-100 py-3 rounded-xl font-bold text-sm">Continue Shopping</button><button onclick="goToCart()" class="bg-yellow-500 text-white py-3 rounded-xl font-bold text-sm">View Cart →</button></div></div></div>
<script>
// ✅ NEW PROJECT KEYS - FIXED
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let all=[];let selectedProduct=null;let currentQty=1;
async function load(){try{const{data, error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error) throw error;all=data||[];document.getElementById('count').innerText=all.length+' products found';render(all);}catch(e){document.getElementById('grid').innerHTML='<p class="text-xs text-red-500">Error: '+e.message+'<br>Run SQL to create products table</p>';}}
function render(list){const g=document.getElementById('grid');g.innerHTML='';if(list.length===0){g.innerHTML='<p class="col-span-2 text-center text-xs text-gray-400 py-10">No products yet<br>Vendor needs to add in Vendor Dashboard</p>'; return;} list.forEach(p=>{const d=document.createElement('div');d.className='bg-white rounded-2xl shadow p-2';d.innerHTML=`<img src="${p.image||'https://via.placeholder.com/200'}" class="w-full h-28 object-cover rounded-xl mb-2"><p class="font-bold text-xs truncate">${p.name}</p><p class="text-[10px] text-gray-400">${p.category} • ${p.stock} left</p><p class="font-black text-green-700">₦${Number(p.price).toLocaleString()}</p><button onclick="openModal(${p.id})" class="w-full bg-green-600 text-white text-xs py-2 rounded-xl mt-1 font-bold">Add to Cart</button>`;g.appendChild(d);});}
function openModal(id){selectedProduct=all.find(p=>p.id===id);currentQty=1;document.getElementById('mImage').src=selectedProduct.image||'';document.getElementById('mName').innerText=selectedProduct.name;document.getElementById('mCategory').innerText=selectedProduct.category+' • '+selectedProduct.stock+' left';document.getElementById('mPrice').innerText='₦'+Number(selectedProduct.price).toLocaleString();updateTotal();document.getElementById('cartModal').classList.remove('hidden');}
function changeQty(d){currentQty=Math.max(1,Math.min(selectedProduct.stock||99,currentQty+d));document.getElementById('mQty').innerText=currentQty;updateTotal();}
function updateTotal(){const t=selectedProduct.price*currentQty;document.getElementById('mTotal').innerText='₦'+t.toLocaleString();document.getElementById('mTotalBtn').innerText='₦'+t.toLocaleString();}
function closeModal(){document.getElementById('cartModal').classList.add('hidden');}
function confirmAddToCart(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');const ex=cart.find(c=>c.id===selectedProduct.id);if(ex)ex.qty+=currentQty;else cart.push({id:selectedProduct.id,name:selectedProduct.name,price:selectedProduct.price,image:selectedProduct.image,qty:currentQty});localStorage.setItem('lgm_cart',JSON.stringify(cart));loadCart();closeModal();}
function goToCart(){confirmAddToCart();location.href='cart.html';}
function filterCat(c){if(c==='All')render(all);else render(all.filter(p=>(p.category||'').toLowerCase().includes(c.split(' ')[0].toLowerCase())));}
function sortProducts(){const s=document.getElementById('sortSelect').value;let l=[...all];if(s==='price-low')l.sort((a,b)=>a.price-b.price);if(s==='price-high')l.sort((a,b)=>b.price-a.price);render(l);}
document.getElementById('searchInput').addEventListener('input',e=>{render(all.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase())));});
function loadCart(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}loadCart();load();
</script></body></html>
