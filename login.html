<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">
<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm">
  <h1 class="text-2xl font-bold text-center text-green-700 mb-4">Rider Login</h1>
  
  <input id="email" type="email" placeholder="Email" class="w-full border p-3 rounded-lg mb-3">
  <input id="password" type="password" placeholder="Password" class="w-full border p-3 rounded-lg mb-4">
  
  <button onclick="login()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-full font-bold">Login</button>
  <p id="error" class="text-red-500 text-sm mt-3 text-center"></p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  document.getElementById('error').innerText = 'Logging in...';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({email, password});
  if(authError){ 
    document.getElementById('error').innerText = 'Invalid email or password'; 
    return; 
  }
  
  const { data: user } = await supabaseClient.from('users').select('*').eq('id', authData.user.id).single();
  
  if(!user || (user.role !== 'delivery' && user.role !== 'agent')){
    document.getElementById('error').innerText = 'This account is not a Rider';
    await supabaseClient.auth.signOut();
    return;
  }
  
  localStorage.setItem('delivery_user', JSON.stringify(user));
  window.location.href = 'delivery-dashboard.html';
}
</script>
</body></html>
