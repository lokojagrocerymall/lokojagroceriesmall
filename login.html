<script>
console.log("JS Loaded");
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  document.getElementById('error').innerText = "Checking...";
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  try {
    // STEP 1: Check users table directly
    const { data: profile, error } = await supabase
      .from('users')
      .select('*')
      .eq('email', email)
      .eq('password', password)
      .eq('is_approved', true)
      .single();
      
    if(error || !profile) throw new Error("Invalid email or password");
    
    document.getElementById('error').innerText = "Login OK. Role: " + profile.role + ". Redirecting...";
    localStorage.setItem('lgm_user', JSON.stringify(profile));
    
    setTimeout(() => {
      if(profile.role === 'admin') window.location = 'admin-dashboard.html';
      else if(profile.role === 'vendor') window.location = 'vendor-dashboard.html';
      else if(profile.role === 'delivery' || profile.role === 'agent') window.location = 'delivery-dashboard.html';
      else window.location = 'customer-dashboard.html';
    }, 1000);

  } catch(err) {
    document.getElementById('error').innerText = "FAILED: " + err.message;
  }
}
</script>
