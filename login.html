<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LGM Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
  <h1 class="text-2xl font-bold text-center text-green-600 mb-2">🔒 LGM Login</h1>
  <p class="text-center text-gray-500 text-sm mb-4">Welcome back to Lokoja Grocery Mall</p>
  
  <form id="loginForm" onsubmit="login(event)" class="space-y-3">
    <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg text-base">
    
    <div class="relative">
      <input id="password" type="password" placeholder="Password" required class="w-full p-3 border rounded-lg text-base pr-10">
      <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-500"><span id="eye">👁️</span></button>
    </div>

    <button id="loginBtn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold text-base">Login</button>
    <p id="msg" class="text-center text-sm mt-2"></p>
  </form>
  
  <p class="text-center text-sm mt-3">
    Don't have an account? <a href="signup.html" class="text-purple-600 font-bold">Sign Up</a>
  </p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePassword() {
  const input = document.getElementById('password');
  const eye = document.getElementById('eye');
  input.type = input.type === "password"? "text" : "password";
  eye.textContent = input.type === "password"? "👁️" : "🙈";
}

async function login(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.innerText = "Logging in..."; msg.innerText = "";

  try{
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) throw error;

    // CHECK APPROVAL STATUS FROM DB
    const { data: userData, error: userError } = await supabaseClient
      .from('users')
      .select('role, is_approved, full_name')
      .eq('user_id', data.user.id)
      .single();
    
    if(userError) throw userError;

    // BLOCK VENDOR/DELIVERY IF NOT APPROVED
    if(userData.role !== 'customer' && userData.role !== 'admin' && userData.is_approved === false){
      await supabaseClient.auth.signOut(); // Log them out immediately
      msg.className = "text-center text-sm mt-2 text-yellow-600 font-bold p-3 bg-yellow-50 rounded-lg";
      msg.innerText = `⏳ Pending Approval\nHi ${userData.full_name}, your account is awaiting admin approval. You will be notified once approved.`;
      btn.disabled = false; btn.innerText = "Login";
      return;
    }

    // APPROVED: REDIRECT TO DASHBOARD
    if(userData.role === 'admin') window.location.href = 'admin.html';
    else if(userData.role === 'vendor') window.location.href = 'vendor.html';
    else if(userData.role === 'delivery_agent') window.location.href = 'delivery.html';
    else window.location.href = 'index.html';

  } catch(err){
    msg.className = "text-center text-sm mt-2 text-red-500";
    msg.innerText = "Error: " + err.message;
    btn.disabled = false; btn.innerText = "Login";
  }
}
</script>
</body></html>
