<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lokoja Grocery Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-full max-w-sm">
  <h1 class="text-2xl font-bold text-center text-green-700 mb-4">Login to Lokoja Grocery Mall</h1>
  
  <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded mb-3">
  
  <div class="relative mb-2">
    <input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded pr-10">
    <button type="button" onclick="togglePassword()" class="absolute right-3 top-2.5 text-gray-500">👁️</button>
  </div>

  <button onclick="forgotPassword()" class="text-sm text-green-600 mb-3 w-full text-right">Forgot Password?</button>

  <button onclick="login()" class="w-full bg-green-600 text-white py-2 rounded-full font-bold">Login</button>
  <p class="text-center text-sm mt-3">No account? <a href="signup.html" class="text-green-600 font-bold">Sign Up</a></p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// EYE ICON: Show/Hide Password
function togglePassword(){
  const pass = document.getElementById('password');
  pass.type = pass.type === 'password' ? 'text' : 'password';
}

// FORGOT PASSWORD - Sends reset link to email
async function forgotPassword(){
  const email = document.getElementById('email').value;
  if(!email) return alert('Enter your email first');
  
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://y-mall.vercel.app/reset-password.html'
  });
  
  if(error) alert(error.message);
  else alert('Password reset link sent to ' + email + '. Check your inbox/spam');
}

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  const { data: user, error } = await supabaseClient.from('users').select('*').eq('email', email).eq('password', password).single();
  if(error || !user){ alert('Invalid email or password'); return; }
  
  localStorage.setItem('lgm_user', JSON.stringify(user));
  alert('Login Successful! Role: ' + user.role);
  
  // CORRECT REDIRECT FOR ALL 4 ROLES
  if(user.role==='admin') location.href = 'admin.html';
  else if(user.role==='vendor') location.href = 'vendor.html';
  else if(user.role==='agent' || user.role==='delivery') location.href = 'agent.html';
  else location.href = 'customer.html';
}
</script>
</body></html>
