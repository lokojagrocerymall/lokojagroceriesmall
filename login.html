<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { background:#f5f5f5; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-box { background:#fff; padding:30px; border-radius:12px; width:100%; max-width:400px; }
h2 { text-align:center; margin-bottom:20px; color:#16a34a; }
input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; }
.btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; }
.pass-wrap { position:relative; }
.eye { position:absolute; right:12px; top:12px; cursor:pointer; user-select:none; }
</style>
</head>
<body>
<div class="login-box">
<h2>Login to Lokoja Grocery Mall</h2>
<label>Email</label><input type="email" id="email">
<label>Password</label>
<div class="pass-wrap">
<input type="password" id="password">
<span class="eye" onclick="togglePass('password', this)">👁️</span>
</div>
<button class="btn" onclick="login()">Login</button>
<p style="text-align:center; margin-top:15px;">Don't have account? <a href="signup.html" style="color:#16a34a; font-weight:700;">Sign Up</a></p>
</div>
<script>
function togglePass(id, el){ let i=document.getElementById(id); if(i.type==='password'){ i.type='text'; el.innerText='🙈'; } else { i.type='password'; el.innerText='👁️'; } }
function login(){ const email=document.getElementById('email').value.trim().toLowerCase(); const pass=document.getElementById('password').value; let users=JSON.parse(localStorage.getItem('allUsers'))||[]; let u=users.find(x=>x.email.toLowerCase()===email && x.password===pass); if(u){ localStorage.setItem('currentUser', JSON.stringify(u)); if(u.role==='vendor') window.location.href='vendor.html'; else window.location.href='index.html'; } else { alert('Invalid email or password'); } }
</script>
</body>
</html>
