<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LGM Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0}
    form{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1)}
    input{width:300px;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:5px;display:block}
    button{width:324px;padding:12px;background:#16a34a;color:white;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>🔒 LGM Login</h2>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

<script>
  const SUPABASE_URL = 'https://yhfxmrpqaccbllszoxyf.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  document.getElementById('loginForm').addEventListener('submit', handleLogin);

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // 1. LOGIN WITH SUPABASE AUTH
    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (authError) {
      alert('Login Error: ' + authError.message);
      return;
    }

    // 2. GET PROFILE FROM users TABLE
    const { data: profile, error: profileError } = await supabase
      .from('users')
      .select('*')
      .eq('id', authData.user.id)
      .single();

    if (profileError) {
      alert('Profile not found. Please contact admin.');
      return;
    }

    // 3. CHECK ROLE AND REDIRECT
    if (profile.role === 'admin') {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/index.html'; // change to your customer dashboard
    }
  }
</script>
</body>
</html>
