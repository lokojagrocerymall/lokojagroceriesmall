<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGM Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-full max-w-sm">
  <h1 class="text-2xl font-bold text-center text-green-700 mb-4">Login to Lokoja Grocery Mall</h1>
  <input id="email" type="email" placeholder="Email" class="w-full border p-3 rounded-lg mb-3">
  <input id="password" type="password" placeholder="Password" class="w-full border p-3 rounded-lg mb-4">
  <button onclick="login()" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Login</button>
  <p id="error" class="text-red-500 text-sm mt-3 text-center"></p>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  document.getElementById('error').innerText = "Checking...";

  // 1. ONLY use Supabase Auth to check password
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  if(error){ 
    document.getElementById('error').innerText = error.message; 
    return; 
  }
  
  // 2. FIXED: Get user role using auth_user_id instead of id
  const { data: profile, error: profileError } = await supabase
    .from('users')
    .select('*')
    .eq('auth_user_id', data.user.id) // <-- THIS WAS THE BUG
    .single();
  
  if(profileError){
    document.getElementById('error').innerText = "Profile not found. Contact admin.";
    return;
  }
  
  localStorage.setItem('lgm_user', JSON.stringify(profile));
  
  // 3. Go to correct dashboard
  if(profile.role === 'admin') window.location = 'admin-dashboard.html';
  else if(profile.role === 'vendor') window.location = 'vendor-dashboard.html';
  else if(profile.role === 'delivery' || profile.role === 'agent') window.location = 'delivery-dashboard.html';
  else window.location = 'customer-dashboard.html';
}
</script>
</body></html>
