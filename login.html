<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lokoja Grocery Mall</title>
<style>
  body { background:#f5f5f5; padding:20px; font-family:sans-serif; }
  .container { max-width:400px; margin:50px auto; background:#fff; padding:30px; border-radius:12px; }
  input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; }
  .btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <h2>Vendor Login</h2>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="loginEmail" required>
    
    <label>Password</label>
    <input type="password" id="loginPassword" required>
    
    <button type="submit" class="btn">Login</button>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  
  const user = allUsers.find(u => u.email === email && u.password === password);
  
  if(!user) {
    alert('Wrong email or password');
    return;
  }
  
  if(user.status !== 'approved') {
    alert('Your account is still pending approval');
    return;
  }
  
  if(user.role !== 'Vendor') {
    alert('This is vendor login');
    return;
  }
  
  localStorage.setItem('currentUser', JSON.stringify(user));
  window.location.href = 'vendor.html';
});
</script>
</body>
</html>
