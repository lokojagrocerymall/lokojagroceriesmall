<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lokoja Grocery Mall</title>
<style>
  body { background:#f5f5f5; padding:20px; font-family:sans-serif; }
 .container { max-width:400px; margin:50px auto; background:#fff; padding:25px; border-radius:12px; }
  label { font-weight:600; font-size:14px; margin-bottom:5px; display:block; }
  input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:10px; }
 .password-box { position:relative; }
 .toggle-pass { position:absolute; right:12px; top:38px; cursor:pointer; font-size:12px; color:#16a34a; font-weight:700; }
 .btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; }
 .link { text-align:center; margin-top:15px; font-size:14px; }
 .link a { color:#16a34a; font-weight:700; text-decoration:none; }
 .error { color:#ef4444; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>

<div class="container">
  <h2 style="margin-bottom:20px; text-align:center;">Login to Lokoja Grocery Mall</h2>
  <p id="errorMsg" class="error"></p>
  
  <label>Email</label>
  <input type="email" id="email" placeholder="your@email.com">
  
  <label>Password</label>
  <div class="password-box">
    <input type="password" id="password" placeholder="Enter password">
    <span class="toggle-pass" onclick="togglePassword()">Show</span>
  </div>
  
  <button class="btn" onclick="loginUser()">Login</button>
  
  <div class="link">
    <a href="#" onclick="forgotPassword()">Forgot Password?</a>
  </div>
  <div class="link">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>
</div>

<script>
function togglePassword() {
  const passInput = document.getElementById('password');
  const toggleBtn = document.querySelector('.toggle-pass');
  
  if(passInput.type === 'password') {
    passInput.type = 'text';
    toggleBtn.innerText = 'Hide';
  } else {
    passInput.type = 'password';
    toggleBtn.innerText = 'Show';
  }
}

function loginUser() {
  const email = document.getElementById("email").value.toLowerCase();
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("errorMsg");
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  let user = allUsers.find(u => u.email === email && u.password === password);
  
  if(!user) {
    errorMsg.innerText = "Invalid email or password";
    return;
  }
  
  if(user.role === 'Vendor' && user.status!== 'approved') {
    errorMsg.innerText = "Your vendor account is still pending approval";
    return;
  }
  
  localStorage.setItem('currentUser', JSON.stringify(user));
  
  if(user.role === 'Admin') window.location.href = "admin.html";
  if(user.role === 'Vendor') window.location.href = "vendor.html";
  if(user.role === 'Customer') window.location.href = "index.html";
  if(user.role === 'Delivery Agent') window.location.href = "delivery.html";
}

function forgotPassword() {
  const email = prompt("Enter your registered email address:");
  if(!email) return;
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  let userIndex = allUsers.findIndex(u => u.email === email.toLowerCase());
  
  if(userIndex === -1) {
    alert("No account found with this email");
    return;
  }
  
  const newPassword = prompt("Enter your new password:");
  if(!newPassword || newPassword.length < 4) {
    alert("Password must be at least 4 characters");
    return;
  }
  
  allUsers[userIndex].password = newPassword;
  localStorage.setItem('allUsers', JSON.stringify(allUsers));
  
  alert("Password reset successful! You can now login with your new password.");
}
</script>
</body>
</html>
