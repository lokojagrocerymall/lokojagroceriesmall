<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lokoja Grocery Mall</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background:#f5f5f5; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-box { background:#fff; padding:30px; border-radius:16px; width:100%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
h2 { text-align:center; margin-bottom:20px; color:#16a34a; font-size:22px; }
label { font-weight:600; margin-bottom:6px; display:block; font-size:14px; }
input { width:100%; padding:13px; border:1px solid #ddd; border-radius:10px; margin-bottom:15px; outline:none; }
input:focus { border-color:#16a34a; }
.btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:10px; font-weight:700; width:100%; cursor:pointer; }
.pass-wrap { position:relative; }
.eye { position:absolute; right:12px; top:12px; cursor:pointer; user-select:none; font-size:18px; }
.link { text-align:center; margin-top:15px; font-size:14px; }
.link a { color:#16a34a; text-decoration:none; font-weight:700; }
.forgot { text-align:right; margin-top:-10px; margin-bottom:15px; }
.forgot a { color:#6b7280; font-size:13px; text-decoration:none; }
.forgot a:hover { color:#16a34a; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:99; }
.modal-content { background:#fff; padding:25px; border-radius:12px; width:90%; max-width:380px; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="login-box">
<h2>Login to Lokoja Grocery Mall</h2>

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Password</label>
<div class="pass-wrap">
<input type="password" id="password" placeholder="Enter password">
<span class="eye" onclick="togglePass('password', this)">👁️</span>
</div>

<div class="forgot"><a href="#" onclick="openForgot()">Forgot password?</a></div>

<button class="btn" onclick="login()">Login</button>
<p class="link">Don't have account? <a href="signup.html">Sign Up</a></p>
</div>

<!-- FORGOT MODAL -->
<div id="forgotModal" class="modal hidden">
<div class="modal-content">
<h3>Reset Password</h3>
<p style="font-size:13px; color:#6b7280; margin:10px 0;">Enter your registered email. We will send OTP.</p>
<label>Email</label>
<input type="email" id="resetEmail">
<button class="btn" onclick="sendResetOTP()">Send OTP</button>
<button class="btn" style="background:#6b7280; margin-top:10px;" onclick="closeForgot()">Cancel</button>

<div id="resetSection" class="hidden">
<hr style="margin:15px 0;">
<p style="font-size:13px;">OTP sent: <b id="showOTP"></b> (Demo)</p>
<label>Enter OTP</label><input type="text" id="resetOTP">
<label>New Password</label>
<div class="pass-wrap">
<input type="password" id="newPass">
<span class="eye" onclick="togglePass('newPass', this)">👁️</span>
</div>
<button class="btn" onclick="resetPassword()">Update Password</button>
</div>

</div>
</div>

<script>
function togglePass(id, el){
  let i=document.getElementById(id);
  if(i.type==='password'){ i.type='text'; el.innerText='🙈'; }
  else { i.type='password'; el.innerText='👁️'; }
}

function login(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('password').value;
  let users=JSON.parse(localStorage.getItem('allUsers'))||[];
  let u=users.find(x=>x.email.toLowerCase()===email && x.password===pass);
  if(u){
    localStorage.setItem('currentUser', JSON.stringify(u));
    if(u.role==='vendor') window.location.href='vendor.html';
    else window.location.href='index.html';
  } else {
    alert('Invalid email or password\n\nIf you are on Vercel first time, please Sign Up first.');
  }
}

let generatedResetOTP = '';
let resetUserIndex = -1;

function openForgot(){ document.getElementById('forgotModal').classList.remove('hidden'); }
function closeForgot(){ document.getElementById('forgotModal').classList.add('hidden'); document.getElementById('resetSection').classList.add('hidden'); }

function sendResetOTP(){
  const email=document.getElementById('resetEmail').value.trim().toLowerCase();
  let users=JSON.parse(localStorage.getItem('allUsers'))||[];
  let idx=users.findIndex(x=>x.email.toLowerCase()===email);
  if(idx===-1){ alert('Email not found. Please Sign Up first.'); return; }
  resetUserIndex=idx;
  generatedResetOTP=Math.floor(100000+Math.random()*900000).toString();
  document.getElementById('showOTP').innerText=generatedResetOTP;
  document.getElementById('resetSection').classList.remove('hidden');
  alert(`DEMO OTP: ${generatedResetOTP}\n\nIn real app this goes to email/SMS`);
}

function resetPassword(){
  let entered=document.getElementById('resetOTP').value.trim();
  let newPass=document.getElementById('newPass').value.trim();
  if(entered!==generatedResetOTP){ alert('Invalid OTP'); return; }
  if(newPass.length<4){ alert('Password too short'); return; }
  let users=JSON.parse(localStorage.getItem('allUsers'))||[];
  users[resetUserIndex].password=newPass;
  localStorage.setItem('allUsers', JSON.stringify(users));
  alert('✅ Password updated! Now login with new password.');
  closeForgot();
}
</script>
</body>
</html>
