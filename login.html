<script>
console.log("JS Loaded");
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  const errorEl = document.getElementById('error');
  errorEl.innerText = "Checking...";
  
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();

  if(!email || !password){
    errorEl.innerText = "Please enter email and password";
    return;
  }

  try {
    // STEP 1: Check users table directly - use .maybeSingle() so it doesn't throw
    const { data: profile, error } = await supabase
      .from('users')
      .select('*')
      .eq('email', email)
      .eq('password', password)
      .eq('is_approved', true)
      .maybeSingle();
      
    if(error){
      console.error(error);
      throw new Error("Database error: " + error.message);
    }
    if(!profile) throw new Error("Invalid email, password, or account not approved");
    
    errorEl.className = "text-green-600 text-sm mt-3 text-center";
    errorEl.innerText = "Login OK. Role: " + profile.role + ". Redirecting...";
    localStorage.setItem('lgm_user', JSON.stringify(profile));
    
    setTimeout(() => {
      if(profile.role === 'admin') window.location.href = 'admin-dashboard.html';
      else if(profile.role === 'vendor') window.location.href = 'vendor-dashboard.html';
      else if(profile.role === 'delivery' || profile.role === 'agent') window.location.href = 'delivery-dashboard.html';
      else window.location.href = 'customer-dashboard.html';
    }, 800);

  } catch(err) {
    errorEl.className = "text-red-500 text-sm mt-3 text-center";
    errorEl.innerText = "FAILED: " + err.message;
    console.error(err);
  }
}
</script>
