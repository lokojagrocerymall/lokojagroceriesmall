<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:400px;margin:auto}
h1{color:#16a34a;text-align:center}
label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px}
.password-wrap{position:relative;margin-bottom:12px}
.password-wrap input{padding-right:40px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h1>Login to Lokoja Grocery Mall</h1>

<label>Email</label><input id="email" type="email">
<label>Password</label>
<div class="password-wrap">
  <input id="password" type="password">
  <span class="eye" onclick="togglePass()">👁️</span>
</div>

<button class="btn" onclick="login()">Login</button>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePass(){
  const p = document.getElementById('password');
  p.type = p.type === 'password'? 'text' : 'password';
}

async function login(){
  console.log("Trying to login:", email.value);
  alert("Trying to login: " + email.value); // debug

  const { data, error } = await supabaseClient.from('users')
   .select('*').eq('email', email.value).eq('password', password.value);
  
  console.log("Supabase response:", data, error);
  
  if(error) return alert('DB Error: ' + error.message);
  if(!data || data.length === 0) return alert('Invalid email or password. Check Supabase users table');
  
  const user = data[0];
  localStorage.setItem('lgm_user', JSON.stringify(user));
  alert('Login Successful! Role: ' + user.role);
  
  // FORCE REDIRECT WITH FULL URL
  if(user.role === 'customer'){
    window.location.replace('https://y-mall.vercel.app/customer.html');
  } else if(user.role === 'vendor'){
    window.location.replace('https://y-mall.vercel.app/vendor.html');
  } else if(user.role === 'agent'){
    window.location.replace('https://y-mall.vercel.app/agent.html');
  } else {
    window.location.replace('https://y-mall.vercel.app/admin.html');
  }
}
</script>
</body>
</html>
