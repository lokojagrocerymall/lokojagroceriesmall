<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse - LGM</title><script src="https://cdn.tailwindcss.com"></script><style>.tab.active{background:#16a34a;color:#fff}.stock-ok{color:#16a34a;font-weight:800;font-size:10px;background:#f0fdf4;padding:2px 6px;border-radius:999px;border:1px solid #bbf7d0}.stock-low{color:#d97706;font-weight:900;font-size:10px;background:#fffbeb;padding:2px 6px;border-radius:999px;border:1px solid #fde68a}.page-btn{min-width:36px;height:36px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1px solid #e5e7eb}.page-btn.active{background:#3b2f2f;color:#fff}</style></head><body class="bg-gray-50"><header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-20"><span class="font-black text-green-700">Lokoja Grocery Mall</span><a href="customer.html">🛒<span id="cartCount" class="bg-green-600 text-white text-[10px] rounded-full px-1.5">0</span></a></header>
<div class="p-3"><div class="flex gap-2 overflow-x-auto pb-2 mb-3 text-xs font-bold whitespace-nowrap"><button onclick="filterCat('All')" class="tab active px-4 py-2 rounded-full border bg-white" id="cAll">All</button><button onclick="filterCat('Foodstuff')" class="tab px-4 py-2 rounded-full border bg-white">Foodstuff</button><button onclick="filterCat('Drinks & Beverages')" class="tab px-4 py-2 rounded-full border bg-white">Drinks</button><button onclick="filterCat('Household')" class="tab px-4 py-2 rounded-full border bg-white">Household</button><button onclick="filterCat('Meat & Fish')" class="tab px-4 py-2 rounded-full border bg-white">Meat & Fish</button><button onclick="filterCat('Grains')" class="tab px-4 py-2 rounded-full border bg-white">Grains</button><button onclick="filterCat('Spices & Seasoning')" class="tab px-4 py-2 rounded-full border bg-white">Spices</button><button onclick="filterCat('Oil & Condiments')" class="tab px-4 py-2 rounded-full border bg-white">Oil</button><button onclick="filterCat('Fruits & Vegetables')" class="tab px-4 py-2 rounded-full border bg-white">Fruits</button></div><div id="grid" class="grid grid-cols-2 gap-3"><p class="col-span-2 text-center text-xs py-10">Loading products...</p></div></div>

<script>
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";const URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
let all=[],filtered=[];
function getStock(p){if(p.variations&&p.variations.length)return p.variations.reduce((s,v)=>s+Number(v.stock||0),0);return Number(p.stock||0);}
function getPrice(p){if(p.variations&&p.variations.length)return Math.min(...p.variations.map(v=>Number(v.price)));return Number(p.price||0);}
async function load(){
 try{
  const headers={apikey:KEY,Authorization:"Bearer "+KEY};
  const r=await fetch(URL+"/rest/v1/products?select=*&limit=100",{headers});
  const txt=await r.text();
  if(!r.ok){document.getElementById('grid').innerHTML="<p class='col-span-2 text-center text-xs text-red-500 py-10'>Error "+r.status+": "+txt.substring(0,200)+"</p>";return;}
  const data=JSON.parse(txt);
  let vars=[];
  try{const vr=await fetch(URL+"/rest/v1/product_variations?select=*",{headers});if(vr.ok)vars=await vr.json();}catch(e){}
  all=data.map(p=>({...p,variations:vars.filter(v=>String(v.product_id)===String(p.id))})).filter(p=>getStock(p)>0);
  filtered=[...all];
  render(filtered);
 }catch(e){
  document.getElementById('grid').innerHTML="<p class='col-span-2 text-center text-xs text-red-500 py-10'>JS Error: "+e.message+"</p>";
 }
}
function render(list){
 const g=document.getElementById('grid');g.innerHTML='';
 if(list.length===0){g.innerHTML="<p class='col-span-2 text-center py-10'>No products</p>";return;}
 list.forEach(p=>{
  const img=p.image||p.image_url||'';const imgTag=img?`<img src="${img}" class="w-full h-28 object-cover rounded-xl">`:'🛒';
  const stock=getStock(p);const price=p.variations&&p.variations.length?`₦${Math.min(...p.variations.map(v=>Number(v.price))).toLocaleString()} - ₦${Math.max(...p.variations.map(v=>Number(v.price))).toLocaleString()}`:`₦${Number(p.price).toLocaleString()}`;
  const d=document.createElement('div');d.className='bg-white rounded-2xl p-2 shadow';
  d.innerHTML=`<div class="bg-gray-100 rounded-xl h-28 flex items-center justify-center overflow-hidden">${imgTag}</div><p class="font-bold text-xs truncate mt-1">${p.name}</p><p class="text-[10px] text-gray-400">${p.category||''}</p><p class="text-[10px] mt-1">${stock<=10?`⚠️ ${stock} left`:`✅ ${stock} in stock`}</p><p class="font-black text-red-600 text-sm">${price}</p>`;
  g.appendChild(d);
 });
}
function filterCat(c){
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 if(c==='All')filtered=[...all];else filtered=all.filter(p=>(p.category||'').toLowerCase().includes(c.toLowerCase())|| (c==='Drinks & Beverages'&& (p.category||'').toLowerCase().includes('drink')));
 render(filtered);
}
load();
</script></body></html>
