<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse - LGM</title><script src="https://cdn.tailwindcss.com"></script><style>.tab.active{background:#16a34a;color:#fff;border-color:#16a34a}.filter-panel{display:none}.filter-panel.active{display:block}.stock-ok{color:#16a34a;font-weight:800;font-size:10px;background:#f0fdf4;padding:2px 6px;border-radius:999px;border:1px solid #bbf7d0}.stock-low{color:#d97706;font-weight:900;font-size:10px;background:#fffbeb;padding:2px 6px;border-radius:999px;border:1px solid #fde68a}.page-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1px solid #e5e7eb}.page-btn.active{background:#3b2f2f;color:#fff}</style></head><body class="bg-gray-50 min-h-screen">
<header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-20"><div class="flex items-center gap-2"><img src="logo.png" onerror="this.src='https://via.placeholder.com/40?text=LGM'" class="w-8 h-8 rounded"><span class="font-black text-green-700 text-sm">Lokoja Grocery Mall</span></div><div class="flex gap-3 text-xl"><a href="customer.html" class="relative">🛒<span id="cartCount" class="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] rounded-full px-1.5">0</span></a><span onclick="document.getElementById('sideMenu').classList.toggle('hidden')" class="cursor-pointer">☰</span></div></header>
<div id="sideMenu" class="hidden bg-white shadow p-4 absolute right-0 top-[52px] w-56 z-10 rounded-bl-2xl"><a href="index.html" class="block py-2 font-bold text-sm">🏠 Home</a><a href="browse.html" class="block py-2 text-sm bg-green-50 rounded px-2">🛍️ Browse</a></div>
<div class="p-3 max-w-6xl mx-auto">
<div class="flex gap-2 mb-3"><div class="flex-1 relative"><input id="searchInput" placeholder="Search rice, yam, oil..." class="w-full p-3 pl-10 border-2 rounded-xl text-sm"><span class="absolute left-3 top-3.5 text-sm">🔍</span></div><button onclick="toggleFilters()" class="px-4 bg-green-50 border border-green-600 text-green-700 rounded-xl font-bold text-xs">⚙️ Filters</button></div>
<div class="flex gap-2 overflow-x-auto pb-2 mb-3 text-xs font-bold whitespace-nowrap" id="catTabs"><button onclick="filterCat('All',this)" id="catAll" class="tab active px-4 py-2 rounded-full border bg-white">All</button><button onclick="filterCat('Foodstuff',this)" class="tab px-4 py-2 rounded-full border bg-white">Foodstuff</button><button onclick="filterCat('Drinks & Beverages',this)" class="tab px-4 py-2 rounded-full border bg-white">Drinks & Beverages</button><button onclick="filterCat('Household',this)" class="tab px-4 py-2 rounded-full border bg-white">Household</button><button onclick="filterCat('Meat & Fish',this)" class="tab px-4 py-2 rounded-full border bg-white">Meat & Fish</button><button onclick="filterCat('Grains',this)" class="tab px-4 py-2 rounded-full border bg-white">Grains</button><button onclick="filterCat('Spices & Seasoning',this)" class="tab px-4 py-2 rounded-full border bg-white">Spices & Seasoning</button><button onclick="filterCat('Oil & Condiments',this)" class="tab px-4 py-2 rounded-full border bg-white">Oil & Condiments</button><button onclick="filterCat('Fruits & Vegetables',this)" class="tab px-4 py-2 rounded-full border bg-white">Fruits & Vegetables</button><button onclick="filterCat('Baby & Personal Care',this)" class="tab px-4 py-2 rounded-full border bg-white">Baby & Personal Care</button></div>
<div class="flex justify-between items-center mb-3"><span id="count" class="text-xs text-gray-500">Loading...</span><select id="sortSelect" onchange="sortProducts()" class="border p-2 rounded-xl text-xs"><option value="newest">Newest</option><option value="low">Price Low-High</option><option value="high">Price High-Low</option></select></div>
<div id="filterPanel" class="filter-panel bg-white rounded-2xl shadow p-4 mb-4"><div class="flex justify-between mb-3"><h4 class="font-black text-sm">Filters</h4><span onclick="clearFilters()" class="text-green-600 text-xs cursor-pointer font-bold">Clear all</span></div><h5 class="text-[11px] font-black mb-2">PRICE RANGE</h5><div class="flex gap-2 mb-4"><input id="minPrice" type="number" placeholder="Min ₦" class="flex-1 p-2.5 border-2 rounded-xl text-xs"><span class="py-2">—</span><input id="maxPrice" type="number" placeholder="Max ₦" class="flex-1 p-2.5 border-2 rounded-xl text-xs"><button onclick="applyPrice()" class="bg-green-600 text-white px-4 rounded-xl text-xs font-bold">Go</button></div></div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"><p class="col-span-full text-center text-xs text-gray-400 py-10">Loading products...</p></div>
<div id="pagination" class="flex items-center justify-center gap-2 mt-6 mb-10 flex-wrap"></div>
</div>
<div id="detailModal" class="hidden fixed inset-0 bg-black/70 z-[70] flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target==this) closeDetail()"><div class="bg-white w-full md:max-w-md rounded-t-[28px] md:rounded-[24px] p-5 max-h-[92vh] overflow-y-auto"><img id="dImage" class="w-full max-h-[340px] object-contain rounded-2xl bg-white border p-2 mb-3"><p id="dName" class="font-black text-[18px]"></p><p id="dCategory" class="text-xs text-gray-400 mt-1"></p><div id="dStock" class="mt-2"></div><p id="dDesc" class="text-[13px] text-gray-600 mt-3 bg-gray-50 p-3 rounded-xl"></p><div id="dVarSection" class="hidden mt-3"><p class="text-sm font-bold mb-2">Size <span class="text-xs text-gray-400">tap to see photo</span></p><div id="dVarList" class="flex gap-2 flex-wrap"></div></div><div class="flex justify-between items-center mt-4"><p id="dPrice" class="font-black text-green-700 text-[22px]"></p><p class="text-[10px] text-gray-400">+5% delivery</p></div><button id="dAddBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-black mt-4">Add to Cart 🛒</button><button onclick="closeDetail()" class="w-full bg-gray-100 py-3 rounded-xl font-bold text-sm mt-2">Close</button></div></div>
<div id="cartModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center"><div class="bg-white w-full md:max-w-sm rounded-t-[24px] p-5"><div class="flex gap-3 mb-4"><img id="mImage" class="w-20 h-20 object-contain rounded-xl bg-white border p-1"><div><p id="mName" class="font-black text-sm"></p><p id="mCategory" class="text-xs text-gray-400"></p><p id="mPrice" class="font-black text-red-600 mt-1"></p></div></div><div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center mb-3"><span class="text-sm font-bold">Qty</span><div class="flex items-center gap-3"><button onclick="changeQty(-1)" class="w-9 h-9 bg-white border-2 rounded-full font-black">-</button><span id="mQty" class="font-black w-6 text-center">1</span><button onclick="changeQty(1)" class="w-9 h-9 bg-green-600 text-white rounded-full font-black">+</button></div></div><button onclick="confirmAddToCart()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black">Add • <span id="mTotalBtn">₦0</span></button><button onclick="closeModal()" class="w-full bg-gray-100 py-3 rounded-xl font-bold text-sm mt-2">Continue</button></div></div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
let all=[],filtered=[],selectedProduct=null,currentQty=1,detailProduct=null,detailVariation=null;
const PAGE_SIZE=20;let currentPage=1;
function getStock(p){return p.variations&&p.variations.length?p.variations.reduce((s,v)=>s+Number(v.stock||0),0):Number(p.stock||0);}
function getMinPrice(p){return p.variations&&p.variations.length?Math.min(...p.variations.map(v=>Number(v.price))):Number(p.price||0);}
function getMaxPrice(p){return p.variations&&p.variations.length?Math.max(...p.variations.map(v=>Number(v.price))):Number(p.price||0);}
async function load(){
 try{
  const headers={apikey:KEY,Authorization:"Bearer "+KEY};
  const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&limit=200",{headers});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const data=await r.json();
  let vars=[];try{const vr=await fetch(SUPABASE_URL+"/rest/v1/product_variations?select=*",{headers});if(vr.ok)vars=await vr.json();}catch(e){}
  all=data.map(p=>({...p,variations:vars.filter(v=>String(v.product_id)===String(p.id))})).filter(p=>getStock(p)>0);
  filtered=[...all];document.getElementById('count').innerText=all.length+' products';currentPage=1;render(filtered);
 }catch(e){document.getElementById('grid').innerHTML=`<p class="col-span-full text-center text-xs text-red-500 py-10">Error: ${e.message}</p>`;}
}
function render(list){
 const g=document.getElementById('grid');g.innerHTML='';
 if(list.length===0){g.innerHTML='<div class="col-span-full text-center py-20 text-gray-400"><p class="text-sm font-bold">No products in this category</p></div>';document.getElementById('pagination').innerHTML='';return;}
 const start=(currentPage-1)*PAGE_SIZE;const items=list.slice(start,start+PAGE_SIZE);
 items.forEach(p=>{
  const img=p.image||p.image_url||'';const imgSrc=img?`<img src="${img}" class="w-full h-32 object-contain bg-white p-1 rounded-xl">`:'<div class="text-3xl">🛒</div>';
  const stock=getStock(p);const badge=stock<=10?`<span class="stock-low">⚠️ Only ${stock} left!</span>`:`<span class="stock-ok">✅ ${stock} in stock</span>`;
  const price=p.variations&&p.variations.length?(getMinPrice(p)===getMaxPrice(p)?`₦${getMinPrice(p).toLocaleString()}`:`₦${getMinPrice(p).toLocaleString()} - ₦${getMaxPrice(p).toLocaleString()}`):`₦${Number(p.price).toLocaleString()}`;
  const d=document.createElement('div');d.className='bg-white rounded-2xl shadow p-2';
  d.innerHTML=`<div onclick="openDetail(${p.id})" class="cursor-pointer"><div class="bg-white rounded-xl h-32 flex items-center justify-center overflow-hidden mb-2 border">${imgSrc}</div><p class="font-bold text-xs truncate">${p.name}</p><p class="text-[10px] text-gray-400 truncate">${p.category||'Others'}</p><div class="mt-1">${badge}</div><p class="font-black text-red-600 text-[13px] mt-1">${price}</p></div><button onclick="openDetail(${p.id})" class="w-full ${stock<=10?'bg-orange-500':'bg-green-600'} text-white text-xs py-2.5 rounded-xl mt-2 font-bold">${p.variations&&p.variations.length?'Select options':'Add to Cart 🛒'}</button>`;
  g.appendChild(d);
 });
 const total=Math.ceil(list.length/PAGE_SIZE);const pg=document.getElementById('pagination');if(total<=1){pg.innerHTML='';return;}let html='';for(let i=1;i<=total;i++)html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;pg.innerHTML=html;
}
function goPage(n){currentPage=n;render(filtered);window.scrollTo({top:0,behavior:'smooth'});}
function openDetail(id){const p=all.find(x=>String(x.id)===String(id));if(!p)return;detailProduct=p;detailVariation=null;const vars=p.variations||[];const img=p.image||p.image_url||'https://via.placeholder.com/400';p._origImage=img;document.getElementById('dImage').src=img;document.getElementById('dName').innerText=p.name;document.getElementById('dCategory').innerText=p.category||'';document.getElementById('dDesc').innerText=p.description||p.name;document.getElementById('dStock').innerHTML=getStock(p)<=10?`<span class="stock-low">⚠️ Only ${getStock(p)} left!</span>`:`<span class="stock-ok">✅ ${getStock(p)} in stock</span>`;const vs=document.getElementById('dVarSection');if(vars.length){vs.classList.remove('hidden');document.getElementById('dVarList').innerHTML=vars.map(v=>`<button id="dvar-${v.id}" onclick="selectVar('${v.id}')" class="px-3 py-1.5 rounded-full border text-xs bg-white ${Number(v.stock)===0?'opacity-50 line-through':''}">${v.size}${v.image_url?' 📷':''}</button>`).join('');document.getElementById('dPrice').innerText='Please select variation';}else{vs.classList.add('hidden');document.getElementById('dPrice').innerText='₦'+Number(p.price).toLocaleString();}document.getElementById('dAddBtn').onclick=()=>{if(vars.length&&!detailVariation){alert('Select size first');return;}if(vars.length){const prod={id:`${p.id}_${detailVariation.id}`,name:`${p.name} - ${detailVariation.size}`,price:Number(detailVariation.price),image:detailVariation.image_url||p.image||p.image_url,stock:Number(detailVariation.stock),vendor_id:p.vendor_id,vendor_email:p.vendor_email,category:p.category};closeDetail();openModalProd(prod);}else{closeDetail();openModalProd({id:p.id,name:p.name,price:Number(p.price),image:p.image||p.image_url,stock:Number(p.stock),vendor_id:p.vendor_id,vendor_email:p.vendor_email,category:p.category});}};document.getElementById('detailModal').classList.remove('hidden');}
function selectVar(vid){const vars=detailProduct.variations;detailVariation=vars.find(v=>String(v.id)===String(vid));vars.forEach(v=>{const b=document.getElementById('dvar-'+v.id);if(b)b.className=`px-3 py-1.5 rounded-full border text-xs ${String(v.id)===String(vid)?'bg-green-600 text-white border-green-600':'bg-white'}`});document.getElementById('dPrice').innerText='₦'+Number(detailVariation.price).toLocaleString();if(detailVariation.image_url)document.getElementById('dImage').src=detailVariation.image_url;else document.getElementById('dImage').src=detailProduct._origImage;}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden');}
function openModalProd(prod){selectedProduct=prod;currentQty=1;document.getElementById('mImage').src=prod.image||'';document.getElementById('mName').innerText=prod.name;document.getElementById('mCategory').innerText=prod.category||'';document.getElementById('mPrice').innerText='₦'+Number(prod.price).toLocaleString();updateTotal();document.getElementById('cartModal').classList.remove('hidden');}
function changeQty(d){currentQty=Math.max(1,Math.min(Number(selectedProduct.stock||99),currentQty+d));document.getElementById('mQty').innerText=currentQty;updateTotal();}
function updateTotal(){const t=selectedProduct.price*currentQty;document.getElementById('mTotalBtn').innerText='₦'+(t+Math.round(t*0.05)).toLocaleString();}
function closeModal(){document.getElementById('cartModal').classList.add('hidden');}
function confirmAddToCart(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');const ex=cart.find(c=>String(c.id)===String(selectedProduct.id));if(ex)ex.qty+=currentQty;else cart.push({id:selectedProduct.id,name:selectedProduct.name,price:selectedProduct.price,image:selectedProduct.image,qty:currentQty,vendor_id:selectedProduct.vendor_id,vendor_email:selectedProduct.vendor_email});localStorage.setItem('lgm_cart',JSON.stringify(cart));loadCount();closeModal();alert('Added to cart!');}
function toggleFilters(){document.getElementById('filterPanel').classList.toggle('active')}
function clearFilters(){document.getElementById('minPrice').value='';document.getElementById('maxPrice').value='';filtered=[...all];render(filtered);}
function filterCat(c,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(c==='All')filtered=[...all];else if(c==='Drinks & Beverages')filtered=all.filter(p=>(p.category||'').toLowerCase().includes('drink')||(p.category||'').toLowerCase().includes('beverage'));else filtered=all.filter(p=>(p.category||'').toLowerCase().includes(c.toLowerCase()));document.getElementById('count').innerText=filtered.length+' products';currentPage=1;render(filtered);}
function sortProducts(){const s=document.getElementById('sortSelect').value;let l=[...filtered];if(s==='low')l.sort((a,b)=>getMinPrice(a)-getMinPrice(b));if(s==='high')l.sort((a,b)=>getMaxPrice(b)-getMaxPrice(a));filtered=l;render(filtered);}
function applyPrice(){const min=Number(document.getElementById('minPrice').value)||0;const max=Number(document.getElementById('maxPrice').value)||Infinity;filtered=all.filter(p=>{const pr=getMinPrice(p);return pr>=min&&pr<=max;});render(filtered);}
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();filtered=all.filter(p=>p.name.toLowerCase().includes(q));render(filtered);});
function loadCount(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}loadCount();load();
</script></body></html>
