<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse - LGM</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.tab.active{background:#16a34a;color:#fff;border-color:#16a34a}.filter-panel{display:none}.filter-panel.active{display:block}.location-list{max-height:200px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.stock-ok{color:#16a34a;font-weight:800;font-size:10px;background:#f0fdf4;padding:2px 6px;border-radius:999px;border:1px solid #bbf7d0}.stock-low{color:#d97706;font-weight:900;font-size:10px;background:#fffbeb;padding:2px 6px;border-radius:999px;border:1px solid #fde68a}.page-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:800;color:#374151;background:#fff;border:1px solid #e5e7eb;cursor:pointer}.page-btn:hover{border-color:#16a34a;color:#16a34a}.page-btn.active{background:#3b2f2f;color:#fff;border-color:#3b2f2f}.page-btn:disabled{opacity:0.4;cursor:not-allowed}</style></head><body class="bg-gray-50 min-h-screen"><header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-20"><div class="flex items-center gap-2"><img src="logo.png" onerror="this.src='https://via.placeholder.com/40?text=LGM'" class="w-8 h-8 rounded"><span class="font-black text-green-700 text-sm">Lokoja Grocery Mall</span></div><div class="flex gap-3 text-xl"><a href="customer.html" class="relative">🛒<span id="cartCount" class="absolute -top-2 -right-2 bg-green-600 text-white text-[10px] rounded-full px-1.5">0</span></a><span onclick="document.getElementById('sideMenu').classList.toggle('hidden')" class="cursor-pointer">☰</span></div></header><div id="sideMenu" class="hidden bg-white shadow p-4 absolute right-0 top-[52px] w-56 z-10 rounded-bl-2xl"><a href="index.html" class="block py-2 font-bold text-sm">🏠 Home</a><a href="browse.html" class="block py-2 text-sm bg-green-50 rounded px-2">🛍️ Browse</a></div><div class="p-3 max-w-6xl mx-auto"><div class="flex gap-2 mb-3"><div class="flex-1 relative"><input id="searchInput" placeholder="Search rice, yam, oil..." class="w-full p-3 pl-10 border-2 rounded-xl text-sm"><span class="absolute left-3 top-3.5 text-sm">🔍</span></div><button onclick="toggleFilters()" class="px-4 bg-green-50 border border-green-600 text-green-700 rounded-xl font-bold text-xs">⚙️ Filters</button></div><div class="flex gap-2 overflow-x-auto pb-2 mb-3 text-xs font-bold whitespace-nowrap" id="catTabs"><button onclick="filterCat('All', this)" id="catAll" class="tab active px-4 py-2 rounded-full border bg-white">All</button><button onclick="filterCat('Foodstuff', this)" class="tab px-4 py-2 rounded-full border bg-white">Foodstuff</button><button onclick="filterCat('Drinks & Beverages', this)" class="tab px-4 py-2 rounded-full border bg-white">Drinks & Beverages</button><button onclick="filterCat('Household', this)" class="tab px-4 py-2 rounded-full border bg-white">Household</button><button onclick="filterCat('Meat & Fish', this)" class="tab px-4 py-2 rounded-full border bg-white">Meat & Fish</button><button onclick="filterCat('Grains', this)" class="tab px-4 py-2 rounded-full border bg-white">Grains</button><button onclick="filterCat('Spices & Seasoning', this)" class="tab px-4 py-2 rounded-full border bg-white">Spices & Seasoning</button><button onclick="filterCat('Oil & Condiments', this)" class="tab px-4 py-2 rounded-full border bg-white">Oil & Condiments</button><button onclick="filterCat('Fruits & Vegetables', this)" class="tab px-4 py-2 rounded-full border bg-white">Fruits & Vegetables</button><button onclick="filterCat('Baby & Personal Care', this)" class="tab px-4 py-2 rounded-full border bg-white">Baby & Personal Care</button></div><div class="flex justify-between items-center mb-3"><span id="count" class="text-xs text-gray-500">0 products</span><select id="sortSelect" onchange="sortProducts()" class="border p-2 rounded-xl text-xs"><option value="newest">Newest</option><option value="low">Price Low-High</option><option value="high">Price High-Low</option></select></div><div id="filterPanel" class="filter-panel bg-white rounded-2xl shadow p-4 mb-4"><div class="flex justify-between mb-3"><h4 class="font-black text-sm">Filters</h4><span onclick="clearFilters()" class="text-green-600 text-xs cursor-pointer font-bold">Clear all</span></div><h5 class="text-[11px] font-black mb-2">PRICE RANGE</h5><div class="flex gap-2 mb-4"><input id="minPrice" type="number" placeholder="Min ₦" class="flex-1 p-2.5 border-2 rounded-xl text-xs"><span class="py-2">—</span><input id="maxPrice" type="number" placeholder="Max ₦" class="flex-1 p-2.5 border-2 rounded-xl text-xs"><button onclick="applyPrice()" class="bg-green-600 text-white px-4 rounded-xl text-xs font-bold">Go</button></div><h5 class="text-[11px] font-black mb-2">LOCATION IN LOKOJA</h5><div class="location-list" id="locList"><label><input type="checkbox" value="Ganaja"> Ganaja</label><label><input type="checkbox" value="Adankolo"> Adankolo</label><label><input type="checkbox" value="Felele"> Felele</label><label><input type="checkbox" value="Phase 2"> Phase 2</label><label><input type="checkbox" value="Phase 1"> Phase 1</label><label><input type="checkbox" value="Old Market"> Old Market</label><label><input type="checkbox" value="Kpata"> Kpata Market</label><label><input type="checkbox" value="FUL"> FUL</label><label><input type="checkbox" value="Zone 8"> Zone 8</label><label><input type="checkbox" value="Nataco"> Nataco</label></div></div><div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"><p class="col-span-full text-center text-xs text-gray-400 py-10">Loading products...</p></div><div id="pagination" class="flex items-center justify-center gap-2 mt-6 mb-10 flex-wrap"></div></div><div id="cartModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center"><div class="bg-white w-full md:max-w-sm rounded-t-[24px] p-5"><div class="flex gap-3 mb-4"><img id="mImage" class="w-20 h-20 object-cover rounded-xl bg-gray-100"><div><p id="mName" class="font-black text-sm"></p><p id="mCategory" class="text-xs text-gray-400"></p><p id="mPrice" class="font-black text-red-600 mt-1"></p><p class="text-[9px] text-gray-400">+5% delivery at checkout</p></div></div><div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center mb-2"><span class="text-sm font-bold">Qty</span><div class="flex items-center gap-3"><button onclick="changeQty(-1)" class="w-9 h-9 bg-white border-2 rounded-full font-black">-</button><span id="mQty" class="font-black w-6 text-center">1</span><button onclick="changeQty(1)" class="w-9 h-9 bg-green-600 text-white rounded-full font-black">+</button></div></div><div id="minAlertModal" class="hidden mb-2 p-2 rounded-xl text-[11px] font-black text-center"></div><div class="bg-green-50 p-3 rounded-xl text-xs mb-4"><div class="flex justify-between"><span>Total</span><span id="mTotal" class="font-bold"></span></div><div class="flex justify-between"><span>Delivery 5%</span><span id="mDel"></span></div><div class="flex justify-between font-black border-t mt-1 pt-1"><span>You Pay</span><span id="mGrand" class="text-green-700"></span></div></div><button onclick="confirmAddToCart()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-black mb-2">Add • <span id="mTotalBtn">₦0</span></button><button onclick="closeModal()" class="w-full bg-gray-100 py-3 rounded-xl font-bold text-sm">Continue</button></div></div><div id="detailModal" class="hidden fixed inset-0 bg-black/70 z-[70] flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target==this) closeDetail()"><div class="bg-white w-full md:max-w-md rounded-t-[28px] md:rounded-[24px] p-5 max-h-[92vh] overflow-y-auto"><div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-4 md:hidden"></div><img id="dImage" class="w-full h-56 object-cover rounded-2xl bg-gray-100 mb-3"><p id="dName" class="font-black text-[18px] leading-tight"></p><p id="dCategory" class="text-xs text-gray-400 mt-1"></p><div id="dStock" class="mt-2"></div><p id="dDesc" class="text-[13px] text-gray-600 mt-3 leading-relaxed bg-gray-50 p-3 rounded-xl"></p><div id="dVarSection" class="hidden mt-3"><p class="text-sm font-bold mb-2">Size <span class="text-xs text-gray-400 font-normal">Please select variation</span></p><div id="dVarList" class="flex gap-2 flex-wrap"></div></div><div class="flex justify-between items-center mt-4"><p id="dPrice" class="font-black text-green-700 text-[22px]"></p><p class="text-[10px] text-gray-400">+5% delivery</p></div><button id="dAddBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-black mt-4 text-[15px]">Add to Cart 🛒</button><button onclick="closeDetail()" class="w-full bg-gray-100 py-3 rounded-xl font-bold text-sm mt-2">Close</button><p class="text-center text-[10px] text-gray-400 mt-3">Tap outside to close</p></div></div><script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let all=[],filtered=[],selectedProduct=null,currentQty=1,detailVariation=null,detailProduct=null;const MIN_ORDER=20000;
const PAGE_SIZE=12;let currentPage=1;
function goPage(n){const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));currentPage=Math.max(1,Math.min(n,total));render(filtered);window.scrollTo({top:0,behavior:'smooth'});}
function renderPagination(){const total=Math.ceil(filtered.length/PAGE_SIZE);const el=document.getElementById('pagination');if(!el)return;if(total<=1){el.innerHTML='';return;}let html=`<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">←</button>`;let pages=[];for(let i=1;i<=total;i++){if(i===1||i===total||(i>=currentPage-2&&i<=currentPage+2))pages.push(i);else if(pages[pages.length-1]!=='...')pages.push('...');}pages.forEach(p=>{if(p==='...')html+=`<span class="px-1 text-gray-400 text-sm">...</span>`;else html+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;});html+=`<button class="page-btn" ${currentPage===total?'disabled':''} onclick="goPage(${currentPage+1})">→</button>`;el.innerHTML=html;}
function toggleFilters(){document.getElementById('filterPanel').classList.toggle('active')}
function clearFilters(){document.querySelectorAll('#locList input').forEach(i=>i.checked=false);document.getElementById('minPrice').value='';document.getElementById('maxPrice').value='';filtered=[...all];currentPage=1;render(filtered);}
function getEffectivePrice(p){if(p.variations&&p.variations.length)return Math.min(...p.variations.map(v=>Number(v.price)));return Number(p.price||0);}
function getEffectiveStock(p){if(p.variations&&p.variations.length)return p.variations.reduce((s,v)=>s+Number(v.stock||0),0);return Number(p.stock||0);}
async function load(){
 try{
  const{data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  if(error)throw error;
  let vars=[];
  try{const vr=await supabaseClient.from('product_variations').select('*');vars=vr.data||[];}catch(e){vars=[];}
  all=(data||[]).map(p=>({...p,variations:vars.filter(v=>String(v.product_id)===String(p.id))})).filter(p=>getEffectiveStock(p)>0);
  filtered=[...all];
  document.getElementById('count').innerText=all.length+' products in stock';
  currentPage=1;render(filtered);
 }catch(e){
  document.getElementById('grid').innerHTML='<p class="text-xs text-red-500 col-span-full text-center py-10">Error: '+e.message+'<br><button onclick="load()" class="mt-2 bg-green-600 text-white px-3 py-1 rounded">Retry</button></p>';
 }}
function render(list){
 const g=document.getElementById('grid');g.innerHTML='';
 if(list.length===0){g.innerHTML='<div class="col-span-full text-center py-20 text-gray-400"><div class="text-5xl mb-2">😕</div><p class="text-sm font-bold">No products in this category</p></div>';document.getElementById('pagination').innerHTML='';return;}
 const start=(currentPage-1)*PAGE_SIZE;const pageItems=list.slice(start,start+PAGE_SIZE);
 pageItems.forEach(p=>{
  const imgUrl=p.image||p.image_url||'';const imgSrc=imgUrl||'https://via.placeholder.com/200?text=No+Image';
  const stockNum=getEffectiveStock(p);
  let stockBadge=stockNum<=10?`<span class="stock-low">⚠️ Only ${stockNum} left!</span>`:`<span class="stock-ok">✅ ${stockNum} in stock</span>`;
  let priceHtml=p.variations&&p.variations.length?(Math.min(...p.variations.map(v=>Number(v.price)))===Math.max(...p.variations.map(v=>Number(v.price)))?`₦${Math.min(...p.variations.map(v=>Number(v.price))).toLocaleString()}`:`₦${Math.min(...p.variations.map(v=>Number(v.price))).toLocaleString()} - ₦${Math.max(...p.variations.map(v=>Number(v.price))).toLocaleString()}`:`₦${Number(p.price).toLocaleString()}`;
  const d=document.createElement('div');d.className='bg-white rounded-2xl shadow p-2';
  d.innerHTML=`<div onclick="openDetail(${p.id})" class="cursor-pointer"><img src="${imgSrc}" class="w-full h-28 object-cover rounded-xl mb-2 bg-gray-100"><p class="font-bold text-xs truncate">${p.name}</p><p class="text-[10px] text-gray-400">${p.category||'Others'} • Tap to view</p><div class="mt-1">${stockBadge}</div><p class="font-black text-red-600 text-[14px] mt-1">${priceHtml}</p></div><button onclick="openDetail(${p.id})" class="w-full ${stockNum<=10?'bg-orange-500':'bg-green-600'} text-white text-xs py-2.5 rounded-xl mt-1 font-bold">${p.variations&&p.variations.length?'Select options':'Add to Cart 🛒'}</button>`;
  g.appendChild(d);
 });renderPagination();
}
function openDetail(id){const p=all.find(x=>x.id===id);if(!p)return;detailProduct=p;detailVariation=null;const vars=p.variations||[];const imgUrl=p.image||p.image_url||'https://via.placeholder.com/400';p._origImage=imgUrl;document.getElementById('dImage').src=imgUrl;document.getElementById('dName').innerText=p.name;document.getElementById('dCategory').innerText=(p.category||'Others')+' • '+(p.location||'Lokoja');document.getElementById('dDesc').innerText=p.description||p.name+' - Fresh from Lokoja market.';const stockNum=getEffectiveStock(p);document.getElementById('dStock').innerHTML=stockNum<=10?`<span class="stock-low">⚠️ Only ${stockNum} left!</span>`:`<span class="stock-ok">✅ ${stockNum} in stock</span>`;const vs=document.getElementById('dVarSection');if(vars.length){vs.classList.remove('hidden');document.getElementById('dVarList').innerHTML=vars.map(v=>`<button id="dvar-${v.id}" onclick="selectDetailVar('${v.id}')" ${Number(v.stock)===0?'disabled':''} class="px-3 py-1.5 rounded-full border text-xs ${Number(v.stock)===0?'line-through opacity-50 bg-gray-100':'bg-white'}">${v.size}</button>`).join('');document.getElementById('dPrice').innerText='Please select variation';}else{vs.classList.add('hidden');document.getElementById('dPrice').innerText='₦'+Number(p.price).toLocaleString();}document.getElementById('dAddBtn').onclick=()=>{if(vars.length&&!detailVariation){alert('Please select a variation first');return;}if(vars.length){const prod={...detailProduct,id:`${detailProduct.id}_${detailVariation.id}`,name:`${detailProduct.name} - ${detailVariation.size}`,price:Number(detailVariation.price),image:detailVariation.image_url||detailProduct.image||detailProduct.image_url,stock:Number(detailVariation.stock),vendor_id:detailProduct.vendor_id,vendor_email:detailProduct.vendor_email,category:detailProduct.category};closeDetail();openModalForProduct(prod);}else{closeDetail();openModal(id);}};document.getElementById('detailModal').classList.remove('hidden');}
function selectDetailVar(vid){const vars=detailProduct.variations||[];detailVariation=vars.find(v=>String(v.id)===String(vid));vars.forEach(v=>{const b=document.getElementById('dvar-'+v.id);if(b)b.className='px-3 py-1.5 rounded-full border text-xs '+(String(v.id)===String(vid)?'bg-green-600 text-white border-green-600':'bg-white')});document.getElementById('dPrice').innerText='₦'+Number(detailVariation.price).toLocaleString();if(detailVariation.image_url)document.getElementById('dImage').src=detailVariation.image_url;else if(detailProduct._origImage)document.getElementById('dImage').src=detailProduct._origImage;}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden');}
function openModalForProduct(prod){selectedProduct=prod;if(Number(selectedProduct.stock||0)<=0){alert('❌ Out of stock');return;}currentQty=1;const imgUrl=selectedProduct.image||selectedProduct.image_url||'https://via.placeholder.com/200';document.getElementById('mImage').src=imgUrl;document.getElementById('mName').innerText=selectedProduct.name;document.getElementById('mCategory').innerText=(selectedProduct.category||'')+' • '+(Number(selectedProduct.stock||0)<=10?'⚠️ Only '+selectedProduct.stock+' left!':'✅ '+selectedProduct.stock+' in stock');document.getElementById('mPrice').innerText='₦'+Number(selectedProduct.price).toLocaleString();updateTotal();document.getElementById('cartModal').classList.remove('hidden');}
function openModal(id){const prod=all.find(p=>p.id===id);if(!prod)return;openModalForProduct(prod);}
function changeQty(d){const maxStock=Number(selectedProduct.stock||99);currentQty=Math.max(1,Math.min(maxStock,currentQty+d));document.getElementById('mQty').innerText=currentQty;updateTotal();}
function updateTotal(){const t=selectedProduct.price*currentQty;const del=Math.round(t*0.05);document.getElementById('mTotal').innerText='₦'+t.toLocaleString();document.getElementById('mDel').innerText='₦'+del.toLocaleString();document.getElementById('mGrand').innerText='₦'+(t+del).toLocaleString();document.getElementById('mTotalBtn').innerText='₦'+(t+del).toLocaleString();let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');let cartSub=cart.reduce((s,i)=>s+i.price*i.qty,0);let newTotal=cartSub+t;let alertBox=document.getElementById('minAlertModal');if(newTotal<MIN_ORDER){let need=MIN_ORDER-newTotal;alertBox.classList.remove('hidden');alertBox.className="mb-2 p-2 rounded-xl text-[11px] font-black text-center bg-red-100 text-red-700 border border-red-200";alertBox.innerHTML=`Cart will be ₦${newTotal.toLocaleString()} - Add ₦${need.toLocaleString()} more`;}else{alertBox.classList.remove('hidden');alertBox.className="mb-2 p-2 rounded-xl text-[11px] font-black text-center bg-green-100 text-green-700 border border-green-200";alertBox.innerHTML=`✅ Good! ₦${newTotal.toLocaleString()} - Eligible`;}}
function closeModal(){document.getElementById('cartModal').classList.add('hidden');}
async function confirmAddToCart(){if(Number(selectedProduct.stock||0)<currentQty){alert('⚠️ Only '+selectedProduct.stock+' left!');return;}let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');const ex=cart.find(c=>String(c.id)===String(selectedProduct.id));const imgUrl=selectedProduct.image||selectedProduct.image_url||'';if(ex){if(ex.qty+currentQty>Number(selectedProduct.stock||0)){alert('⚠️ Only '+selectedProduct.stock+' in stock! You have '+ex.qty+' in cart');return;}ex.qty+=currentQty;ex.image=imgUrl||ex.image;}else cart.push({id:selectedProduct.id,name:selectedProduct.name,price:selectedProduct.price,image:imgUrl,qty:currentQty,vendor_id:selectedProduct.vendor_id||null,vendor_email:selectedProduct.vendor_email||null,image_url:imgUrl});localStorage.setItem('lgm_cart',JSON.stringify(cart));loadCartCount();closeModal();let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);if(sub<MIN_ORDER){let need=MIN_ORDER-sub;if(confirm(`Added! Cart is ₦${sub.toLocaleString()}\nYou need ₦${need.toLocaleString()} more to reach ₦20k min.\nContinue shopping?`)){return;}else{location.href='browse.html';return;}}if(confirm(`Added! Cart ₦${sub.toLocaleString()} ✅ Eligible\nGo to cart?`))location.href='customer.html#cart';}
function filterCat(c, btn){
 document.querySelectorAll('#catTabs.tab').forEach(b=>b.classList.remove('active'));
 if(btn)btn.classList.add('active'); else document.getElementById('catAll').classList.add('active');
 if(c==='All'){filtered=[...all];}
 else if(c==='Drinks & Beverages'){filtered=all.filter(p=>{const cat=(p.category||'').toLowerCase();return cat.includes('drink')||cat.includes('beverage');});}
 else {filtered=all.filter(p=>(p.category||'').toLowerCase()===c.toLowerCase()||(p.category||'').toLowerCase().includes(c.toLowerCase()));}
 document.getElementById('count').innerText=filtered.length+' products in stock';
 currentPage=1;render(filtered);
}
function sortProducts(){const s=document.getElementById('sortSelect').value;let l=[...filtered];if(s==='low')l.sort((a,b)=>getEffectivePrice(a)-getEffectivePrice(b));if(s==='high')l.sort((a,b)=>getEffectivePrice(b)-getEffectivePrice(a));if(s==='newest')l.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));filtered=l;currentPage=1;render(filtered);}
function applyPrice(){const min=Number(document.getElementById('minPrice').value)||0;const max=Number(document.getElementById('maxPrice').value)||Infinity;let l=all.filter(p=>{const pr=getEffectivePrice(p);return pr>=min&&pr<=max;});filtered=l;currentPage=1;render(l);document.getElementById('count').innerText=l.length+' products in stock';}
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();filtered=all.filter(p=>p.name.toLowerCase().includes(q));currentPage=1;render(filtered);});
function loadCartCount(){let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}
loadCartCount();load();
</script></body></html>
