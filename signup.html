<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Lokoja Grocery Mall</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background:#f5f5f5; padding:20px; }
  .container { max-width:500px; margin:0 auto; background:#fff; padding:25px; border-radius:12px; }
  .role-select { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .role-btn { padding:12px 5px; border:2px solid #e5e7eb; border-radius:10px; background:#fff; cursor:pointer; text-align:center; font-size:13px; font-weight:600; }
  .role-btn.active { border-color:#16a34a; background:#f0fdf4; }
  label { font-weight:600; font-size:14px; margin-bottom:5px; display:block; }
  input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; background:#fff; }
  .btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; font-size:16px; }
  .hidden { display:none; }
  .sub-text { color:#6b7280; font-size:12px; margin-top:-10px; margin-bottom:15px; }
  .login-link { text-align:center; margin-top:15px; font-size:14px; }
  .login-link a { color:#16a34a; font-weight:700; text-decoration:none; }
  .error { color:#ef4444; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>

<div class="container">
  <h2 style="margin-bottom:8px;">Join Lokoja Grocery Mall</h2>
  
  <p style="margin-bottom:10px; font-weight:600;">I want to join as</p>
  <div class="role-select">
    <div class="role-btn" onclick="selectRole(this, 'Customer')"><div>🛒</div><div>Customer</div></div>
    <div class="role-btn active" onclick="selectRole(this, 'Vendor')"><div>🏪</div><div>Vendor</div></div>
    <div class="role-btn" onclick="selectRole(this, 'Delivery Agent')"><div>🚚</div><div>Delivery<br>Agent</div></div>
  </div>
  <p class="sub-text" id="roleDesc">Sell your products on the platform</p>
  
  <form id="signupForm">
    <p id="errorMsg" class="error hidden"></p>
    <label>Full Name</label>
    <input type="text" id="fullName" required>
    
    <div id="vendorFields">
      <label>Location in Lokoja</label>
      <select id="location" required>
        <option value="">Select Area</option>
        <option>Ganaja</option><option>Felele</option><option>Adankolo</option><option>Nataco</option><option>Zango</option><option>Other</option>
      </select>
      
      <label>Shop Address</label>
      <input type="text" id="shopAddress" placeholder="e.g No 5, Ganaja Junction" required>
      
      <label>WhatsApp Number</label>
      <input type="tel" id="whatsapp" placeholder="08031234567" required>
    </div>
    
    <div id="simpleFields" class="hidden">
      <label>Phone Number</label>
      <input type="tel" id="phone">
    </div>
    
    <label>Email</label>
    <input type="email" id="email" required>
    
    <label>Password</label>
    <input type="password" id="password" placeholder="Create password" required>
    
    <button type="button" class="btn" onclick="submitForm()">Continue</button>
    
    <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
  </form>
</div>

<script>
let selectedRole = 'Vendor';

function selectRole(element, role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  element.classList.add('active');
  
  if(role === 'Vendor') {
    document.getElementById('vendorFields').classList.remove('hidden');
    document.getElementById('simpleFields').classList.add('hidden');
    document.getElementById('roleDesc').innerText = 'Sell your products on the platform';
  } else {
    document.getElementById('vendorFields').classList.add('hidden');
    document.getElementById('simpleFields').classList.remove('hidden');
    document.getElementById('roleDesc').innerText = role === 'Customer' ? 'Shop for groceries' : 'Deliver orders';
  }
}

function submitForm() {
  const email = document.getElementById("email").value.toLowerCase();
  const errorMsg = document.getElementById("errorMsg");
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  
  // CHECK IF EMAIL ALREADY EXISTS
  const existingUser = allUsers.find(u => u.email.toLowerCase() === email);
  if(existingUser) {
    errorMsg.innerText = 'This email is already registered. Please login instead.';
    errorMsg.classList.remove('hidden');
    return;
  }
  errorMsg.classList.add('hidden');
  
  const newUser = {
    id: Date.now(),
    name: document.getElementById("fullName").value,
    email: email,
    password: document.getElementById("password").value,
    role: selectedRole,
    status: 'pending'
  };
  
  if(selectedRole === 'Vendor') {
    newUser.location = document.getElementById("location").value;
    newUser.shop_address = document.getElementById("shopAddress").value;
    newUser.phone = document.getElementById("whatsapp").value;
  } else {
    newUser.phone = document.getElementById("phone").value;
  }
  
  allUsers.push(newUser);
  localStorage.setItem('allUsers', JSON.stringify(allUsers));
  
  alert("Application submitted successfully! Awaiting admin approval.");
  window.location.href = "login.html";
}
</script>
</body>
</html>
