<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background:#f5f5f5; padding:20px; }
.box { background:#fff; max-width:450px; margin:0 auto; padding:25px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
h2 { color:#16a34a; text-align:center; margin-bottom:15px; }
.role { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px; }
.role button { padding:12px; border:2px solid #ddd; border-radius:10px; background:#fff; font-weight:600; cursor:pointer; }
.role button.active { border-color:#16a34a; background:#f0fdf4; color:#16a34a; }
label { font-weight:600; font-size:14px; margin-bottom:5px; display:block; margin-top:12px; }
input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; outline:none; }
.btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:10px; font-weight:700; width:100%; cursor:pointer; margin-top:20px; }
.btn:disabled { opacity:0.6; }
.pass-wrap { position:relative; }
.eye { position:absolute; right:12px; top:11px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
<h2>Join Lokoja Grocery Mall</h2>
<p style="text-align:center; font-size:13px; color:#6b7280; margin-bottom:15px;">I want to join as</p>
<div class="role">
<button id="btnCustomer" onclick="setRole('customer')">🛒 Customer</button>
<button id="btnVendor" class="active" onclick="setRole('vendor')">🏪 Vendor</button>
<button id="btnDelivery" onclick="setRole('delivery')">🚚 Delivery Agent</button>
</div>
<p id="roleInfo" style="font-size:12px; color:#6b7280; margin-bottom:10px;">Sell your products on the platform</p>
<label>Full Name</label><input type="text" id="name" placeholder="James Agbem">
<label>Location in Lokoja</label><select id="location"><option>Ganaja</option><option>Adankolo</option><option>Lokongoma</option><option>Felele</option><option>Zango</option><option>Natako</option><option>Kabawa</option><option>Phase 1-3</option></select>
<label>Shop Address</label><input type="text" id="shop" placeholder="B243 Ganaja Roundabout Lokoja">
<label>WhatsApp Number</label><input type="text" id="phone" placeholder="08104282311">
<label>Email</label><input type="email" id="email" placeholder="agbemjames@gmail.com">
<label>Password</label>
<div class="pass-wrap">
<input type="password" id="password" placeholder="At least 6 characters">
<span class="eye" onclick="togglePass()">👁️</span>
</div>
<label id="bankLabel">Bank Name</label><select id="bank"><option>Access Bank</option><option>First Bank</option><option>GTBank</option><option>Zenith Bank</option><option>UBA</option><option>Opay</option><option>Palmpay</option><option>Kuda Bank</option><option>Moniepoint</option></select>
<label>Account Number</label><input type="text" id="accNo" placeholder="0123456789">
<label>Account Name</label><input type="text" id="accName" placeholder="James Agbem">
<button class="btn" id="signupBtn" onclick="signup()">Continue</button>
<p style="text-align:center; margin-top:15px; font-size:14px;">Already have account? <a href="login.html" style="color:#16a34a; font-weight:700; text-decoration:none;">Login</a></p>
</div>

<script>
// NEW LGM-PRODUCTION KEYS
const SUPABASE_URL = 'https://yhfxmrpqaccbllszoxyf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedRole = 'vendor';
function setRole(role){
  selectedRole=role;
  document.querySelectorAll('.role button').forEach(b=>b.classList.remove('active'));
  if(role==='customer') document.getElementById('btnCustomer').classList.add('active');
  if(role==='vendor') document.getElementById('btnVendor').classList.add('active');
  if(role==='delivery') document.getElementById('btnDelivery').classList.add('active');
}
function togglePass(){
  let i=document.getElementById('password');
  i.type = i.type==='password' ? 'text' : 'password';
}

async function signup(){
  const btn = document.getElementById('signupBtn');
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const shop=document.getElementById('shop').value.trim();
  const location=document.getElementById('location').value;
  const bank=document.getElementById('bank').value;
  const accNo=document.getElementById('accNo').value.trim();
  const accName=document.getElementById('accName').value.trim() || name;

  if(!name || !email || !password || !phone){ alert('Fill all required fields'); return; }
  btn.disabled=true; btn.innerText='Creating account...';

  const { data, error } = await supabaseClient.from('users').insert([{
    email: email,
    password: password,
    name: name,
    full_name: name,
    phone: phone,
    shop_address: shop,
    shop_name: shop,
    location: location,
    bank_name: bank,
    account_number: accNo,
    account_name: accName,
    role: selectedRole,
    is_approved: selectedRole==='customer' ? true : false
  }]).select();

  if(error){
    btn.disabled=false; btn.innerText='Continue';
    if(error.message.includes('duplicate') || error.code==='23505'){
      alert('Email already exists, please Login'); window.location.href='login.html'; return;
    }
    alert('Error: ' + error.message); return;
  }

  alert('✅ Registration successful! Admin will approve you shortly.');
  window.location.href='login.html';
}
setRole('vendor');
</script>
</body>
</html>
