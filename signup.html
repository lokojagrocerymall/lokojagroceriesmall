<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
  <h1 class="text-2xl font-bold text-center text-green-600">Join Lokoja Grocery Mall</h1>
  <p class="text-center text-gray-500 text-sm mb-4">I want to join as</p>

  <!-- ROLE SELECTOR -->
  <div class="flex gap-2 mb-4">
    <button type="button" onclick="selectRole('customer')" id="btnCustomer" class="flex-1 p-2 rounded-lg border-2 border-green-600 bg-green-50">
      🛒<br><b>Customer</b>
    </button>
    <button type="button" onclick="selectRole('vendor')" id="btnVendor" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🏪<br><b>Vendor</b>
    </button>
    <button type="button" onclick="selectRole('delivery_agent')" id="btnAgent" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🚚<br><b>Delivery<br>Agent</b>
    </button>
  </div>

  <form onsubmit="signup(event)" class="space-y-3">
    <input id="fullName" type="text" placeholder="Full Name" required class="w-full p-3 border rounded-lg">
    
    <!-- 1. LOCATION DROPDOWN FOR LOKOJA - A-Z -->
    <select id="location" required class="w-full p-3 border rounded-lg bg-white">
      <option value="">Select Location in Lokoja</option>
    </select>

    <!-- 2. THIS FIELD WILL HIDE FOR CUSTOMERS -->
    <div id="addressField">
      <input id="address" type="text" placeholder="Shop/House Address" required class="w-full p-3 border rounded-lg">
    </div>
    
    <input id="landmark" type="text" placeholder="Nearest Bus Stop / Landmark" required class="w-full p-3 border rounded-lg">
    <input id="phone" type="tel" placeholder="WhatsApp Number" required class="w-full p-3 border rounded-lg">
    <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg">
    <input id="password" type="password" placeholder="Password - At least 6 characters" required class="w-full p-3 border rounded-lg">

    <!-- 3. BANK FIELDS WILL HIDE FOR CUSTOMERS -->
    <div id="bankFields" class="space-y-3">
      <input id="bankName" type="text" placeholder="Bank Name" class="w-full p-3 border rounded-lg">
      <input id="accountNumber" type="text" placeholder="Account Number" class="w-full p-3 border rounded-lg">
      <input id="accountName" type="text" placeholder="Account Name" class="w-full p-3 border rounded-lg">
    </div>

    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Continue</button>
  </form>
  <p class="text-center text-sm mt-3">Already have account? <a href="login.html" class="text-purple-600 font-bold">Login</a></p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = 'customer';

const LOKOJA_AREAS = [
  "200 Units","500 Unit","Adankolo","Adankolo Junction","Adankolo Newlayout","Anebo Qtrs",
  "Barracks","C - Division","CBN","Commissioners Qtrs","Como","Crusher","Dunamis","FMC",
  "FUL Adankolo","FUL Felele","Fentolu","Felele","Gadumo","Ganaja","Ganaja Junction",
  "Government Day","Government House","GRA","Hydro Junction","Jimgbe","Kabawa","Kabba Junction",
  "Karaworo","Kporoka","Kpata Market","Maigeri Palace","NATACO","NUJ","NTA","New Market",
  "New Stadium","Old Market","Old Poly Qtrs","Otokiti","Phase 1","Phase 2","Police Clinic",
  "Poly","Post Office","Shetima","Zenith Bank","Zango","Zone 8"
];

// FILL DROPDOWN
window.onload = () => {
  const select = document.getElementById('location');
  LOKOJA_AREAS.forEach(area => {
    select.innerHTML += `<option value="${area}">${area}</option>`;
  });
  selectRole('customer'); // default
}

function selectRole(role){
  currentRole = role;
  document.querySelectorAll('[id^=btn]').forEach(b=>{
    b.classList.remove('border-green-600','bg-green-50');
    b.classList.add('border-gray-200');
  });
  document.getElementById('btn'+role.charAt(0).toUpperCase()+role.slice(1).replace('_agent','Agent')).classList.add('border-green-600','bg-green-50');

  // HIDE/SHOW FIELDS - ONLY FOR CUSTOMER
  if(role === 'customer'){
    document.getElementById('addressField').classList.add('hidden');
    document.getElementById('bankFields').classList.add('hidden');
    document.getElementById('address').required = false;
    document.getElementById('bankName').required = false;
    document.getElementById('accountNumber').required = false;
    document.getElementById('accountName').required = false;
  } else {
    document.getElementById('addressField').classList.remove('hidden');
    document.getElementById('bankFields').classList.remove('hidden');
    document.getElementById('address').required = true;
  }
}

async function signup(e){
  e.preventDefault();
  const userData = {
    full_name: document.getElementById('fullName').value,
    location: document.getElementById('location').value,
    address: document.getElementById('address').value,
    landmark: document.getElementById('landmark').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    bank_name: document.getElementById('bankName').value,
    account_number: document.getElementById('accountNumber').value,
    account_name: document.getElementById('accountName').value,
    role: currentRole
  };
  
  const { error } = await supabaseClient.from('users').insert([userData]);
  if(error) alert(error.message);
  else {
    alert('Account Created! Please Login');
    location.href='login.html';
  }
}
</script>
</body></html>
