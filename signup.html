<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
  <h1 class="text-2xl font-bold text-center text-green-600">Join Lokoja Grocery Mall</h1>
  <p class="text-center text-gray-500 text-sm mb-4">I want to join as</p>

  <div class="flex gap-2 mb-4">
    <button type="button" onclick="selectRole('customer')" id="btnCustomer" class="flex-1 p-2 rounded-lg border-2 border-green-600 bg-green-50">
      🛒<br><b>Customer</b>
    </button>
    <button type="button" onclick="selectRole('vendor')" id="btnVendor" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🏪<br><b>Vendor</b>
    </button>
    <button type="button" onclick="selectRole('delivery_agent')" id="btnDeliveryAgent" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🚚<br><b>Delivery<br>Agent</b>
    </button>
  </div>

  <form id="signupForm" onsubmit="signup(event)" class="space-y-3">
    <input id="fullName" type="text" placeholder="Full Name" required class="w-full p-3 border rounded-lg">
    <select id="location" required class="w-full p-3 border rounded-lg bg-white"><option value="">Select Location in Lokoja</option></select>
    <input id="landmark" type="text" placeholder="Nearest Bus Stop / Landmark" required class="w-full p-3 border rounded-lg">
    <input id="phone" type="tel" placeholder="WhatsApp Number" required class="w-full p-3 border rounded-lg">
    <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg">
    <div class="relative">
      <input id="password" type="password" placeholder="Password - At least 6 characters" required minlength="6" class="w-full p-3 border rounded-lg pr-10">
      <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-3 text-gray-500"><span id="eye-password">👁️</span></button>
    </div>

    <div id="customerAddressField" class="hidden">
      <input id="customerAddress" type="text" placeholder="Delivery Address" class="w-full p-3 border rounded-lg">
      <p class="text-xs text-gray-500 mt-1">Where should we deliver your orders?</p>
    </div>

    <div id="addressField" class="hidden">
      <input id="address" type="text" placeholder="Shop/House Address" class="w-full p-3 border rounded-lg">
    </div>

    <div id="bankFields" class="space-y-3 hidden">
      <p class="text-sm font-bold text-green-600">Bank Details for Payout</p>
      <input id="bankName" type="text" placeholder="Bank Name" class="w-full p-3 border rounded-lg">
      <input id="accountNumber" type="text" placeholder="Account Number" class="w-full p-3 border rounded-lg">
      <input id="accountName" type="text" placeholder="Account Name" class="w-full p-3 border rounded-lg">
    </div>

    <div id="deliveryFields" class="hidden space-y-4">
      <p class="text-sm font-bold text-green-600">Delivery Verification *</p>
      <div><label class="text-sm font-semibold">Passport Photograph *</label><input id="passportPhoto" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div>
      <div><label class="text-sm font-semibold">NIN Slip / Card *</label><input id="ninCard" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div>

      <p class="text-sm font-bold text-green-600">Guarantor Information *</p>
      <input id="guarantorName" type="text" placeholder="Guarantor Full Name" class="w-full p-3 border rounded-lg">
      <input id="guarantorPhone" type="tel" placeholder="Guarantor WhatsApp Number" class="w-full p-3 border rounded-lg">
      <input id="guarantorAddress" type="text" placeholder="Guarantor Address" class="w-full p-3 border rounded-lg">
      <div><label class="text-sm font-semibold">Guarantor Passport *</label><input id="guarantorPassport" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div>
      <div><label class="text-sm font-semibold">Guarantor NIN *</label><input id="guarantorNIN" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div>

      <p class="text-sm font-bold text-green-600">Vehicle</p>
      <div class="flex gap-4">
        <label><input type="radio" name="vehicle" value="yes" checked> Yes, I am Driver & Rider</label>
        <label><input type="radio" name="vehicle" value="no"> No</label>
      </div>
    </div>

    <button id="submitBtn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Continue</button>
    <p id="msg" class="text-center text-sm mt-2"></p>
  </form>
  <p class="text-center text-sm mt-3">Already have account? <a href="index.html#login" onclick="localStorage.setItem('openLogin','1')" class="text-purple-600 font-bold">Login</a></p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = 'customer';

const LOKOJA_AREAS = [
  "200 Units","500 Unit","Adankolo","Adankolo Junction","Adankolo Newlayout","Anebo Qtrs",
  "Barracks","C - Division","CBN","Commissioners Qtrs","Como","Crusher","Dunamis","FMC",
  "FUL Adankolo","FUL Felele","Fentolu","Felele","Gadumo","Ganaja","Ganaja Junction",
  "Government Day","Government House","GRA","Hydro Junction","Jimgbe","Kabawa","Kabba Junction",
  "Karaworo","Kporoka","Kpata Market","Maigeri Palace","NATACO","NUJ","NTA","New Market",
  "New Stadium","Old Market","Old Poly Qtrs","Otokiti","Phase 1","Phase 2","Police Clinic",
  "Poly","Post Office","Shetima","Zenith Bank","Zango","Zone 8"
];

window.onload = () => {
  const select = document.getElementById('location');
  LOKOJA_AREAS.forEach(area => { select.innerHTML += `<option value="${area}">${area}</option>`; });
  selectRole('customer');

  document.querySelectorAll('input[name="vehicle"]').forEach(radio => {
    radio.addEventListener('change', checkVehicle);
  });
}

function togglePassword(id) {
  const input = document.getElementById(id);
  const eye = document.getElementById('eye-' + id);
  input.type = input.type === "password"? "text" : "password";
  eye.textContent = input.type === "password"? "👁️" : "🙈";
}

function checkVehicle(){
  const btn = document.getElementById('submitBtn');
  const vehicle = document.querySelector('input[name="vehicle"]:checked')?.value;

  if(currentRole === 'delivery_agent' && vehicle === 'no'){
    btn.disabled = true;
    btn.classList.remove('bg-green-600','bg-yellow-500');
    btn.classList.add('bg-gray-400','cursor-not-allowed');
  } else {
    btn.disabled = false;
    btn.classList.add('bg-green-600');
    btn.classList.remove('bg-gray-400','cursor-not-allowed','bg-yellow-500');
  }
}

function selectRole(role){
  currentRole = role;

  ['btnCustomer','btnVendor','btnDeliveryAgent'].forEach(id=>{
    document.getElementById(id).classList.remove('border-green-600','bg-green-50');
    document.getElementById(id).classList.add('border-gray-200');
  });
  if(role === 'customer') document.getElementById('btnCustomer').classList.add('border-green-600','bg-green-50');
  if(role === 'vendor') document.getElementById('btnVendor').classList.add('border-green-600','bg-green-50');
  if(role === 'delivery_agent') document.getElementById('btnDeliveryAgent').classList.add('border-green-600','bg-green-50');

  ['customerAddressField','addressField','bankFields','deliveryFields'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  ['customerAddress','address','bankName','accountNumber','accountName','guarantorName','guarantorPhone','guarantorAddress','passportPhoto','ninCard','guarantorPassport','guarantorNIN'].forEach(id=>document.getElementById(id).required = false);

  if(role === 'customer'){
    document.getElementById('customerAddressField').classList.remove('hidden');
    document.getElementById('customerAddress').required = true;
  }
  if(role === 'vendor'){
    document.getElementById('addressField').classList.remove('hidden');
    document.getElementById('address').required = true;
    document.getElementById('shopNameField').classList.remove('hidden');
    document.getElementById('shopName').required = true;
    document.getElementById('bankFields').classList.remove('hidden');
    document.getElementById('bankName').required = true;
    document.getElementById('accountNumber').required = true;
    document.getElementById('accountName').required = true;
    
    // Auto-populate Nigerian banks with codes
    const banks = [
      { name: "Access Bank", code: "044" },
      { name: "GTBank", code: "058" },
      { name: "First Bank", code: "011" },
      { name: "UBA", code: "033" },
      { name: "Zenith Bank", code: "057" },
      { name: "Fidelity Bank", code: "070" },
      { name: "Union Bank", code: "032" },
      { name: "Sterling Bank", code: "232" },
      { name: "Wema Bank", code: "035" },
      { name: "Opay", code: "999992" },
      { name: "Moniepoint", code: "50515" },
      { name: "Palmpay", code: "999991" },
      { name: "Kuda", code: "50211" },
      { name: "UBA", code: "033" }
    ];
    
    const bankSelect = document.getElementById('bankName');
    bankSelect.innerHTML = '<option value="">Select Bank</option>';
    banks.forEach(bank => {
      bankSelect.innerHTML += `<option value="${bank.code}" data-name="${bank.name}">${bank.name}</option>`;
    });
    
    // When bank is selected, auto-save code + name
    bankSelect.addEventListener('change', function(){
      const selected = this.options[this.selectedIndex];
      document.getElementById('bankCode').value = this.value; // hidden field for code
      document.getElementById('bankNameText').value = selected.getAttribute('data-name'); // hidden field for name
    });
  }
  if(role === 'delivery_agent'){
    document.getElementById('addressField').classList.remove('hidden');
    document.getElementById('address').required = true;
    document.getElementById('bankFields').classList.remove('hidden');
    document.getElementById('bankName').required = true;
    document.getElementById('accountNumber').required = true;
    document.getElementById('accountName').required = true;
    document.getElementById('deliveryFields').classList.remove('hidden');
    document.getElementById('passportPhoto').required = true;
    document.getElementById('ninCard').required = true;
    document.getElementById('guarantorName').required = true;
    document.getElementById('guarantorPhone').required = true;
    document.getElementById('guarantorAddress').required = true;
    document.getElementById('guarantorPassport').required = true;
    document.getElementById('guarantorNIN').required = true;
    checkVehicle();
  }
}

async function uploadFile(file, path){
  if(!file) return '';
  const { data, error } = await supabaseClient.storage.from('delivery_docs').upload(path, file, {upsert: true}); // upsert files too
  if(error) throw error;
  const { data: urlData } = supabaseClient.storage.from('delivery_docs').getPublicUrl(path);
  return urlData.publicUrl;
}

async function signup(e){
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.innerText = "Creating..."; msg.innerText = "";

  try{
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value.trim();
    const fullName = document.getElementById('fullName').value;
    const finalAddress = currentRole === 'customer'? document.getElementById('customerAddress').value : document.getElementById('address').value;

    if(currentRole === 'delivery_agent'){
      const vehicle = document.querySelector('input[name="vehicle"]:checked')?.value;
      if(vehicle === 'no') throw new Error("You must have a vehicle to be a Delivery Agent");
      if(!document.getElementById('passportPhoto').files[0]) throw new Error("Please upload Passport Photograph");
      if(!document.getElementById('ninCard').files[0]) throw new Error("Please upload NIN Slip");
      if(!document.getElementById('guarantorPassport').files[0]) throw new Error("Please upload Guarantor Passport");
      if(!document.getElementById('guarantorNIN').files[0]) throw new Error("Please upload Guarantor NIN");
    }

    // 1. Try to signup
    let { data, error: authError } = await supabaseClient.auth.signUp({
      email, password,
      options: { data: { full_name: fullName, role: currentRole }}
    });
    
    // 2. If email already exists, login instead
    if(authError && authError.message.includes("already registered")){
      msg.innerText = "Email exists. Logging you in...";
      const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({email, password});
      if(loginError) throw new Error("This email is already registered. Use the correct password or login.");
      data = loginData;
    } else if(authError) {
      throw authError;
    }

    let passport_url='', nin_url='', g_passport='', g_nin='';
    if(currentRole === 'delivery_agent'){
      const uid = data.user.id;
      passport_url = await uploadFile(document.getElementById('passportPhoto').files[0], `delivery/${uid}/passport.jpg`);
      nin_url = await uploadFile(document.getElementById('ninCard').files[0], `delivery/${uid}/nin.jpg`);
      g_passport = await uploadFile(document.getElementById('guarantorPassport').files[0], `delivery/${uid}/g_passport.jpg`);
      g_nin = await uploadFile(document.getElementById('guarantorNIN').files[0], `delivery/${uid}/g_nin.jpg`);
    }

    // 3. UPSERT profile - this fixes the duplicate key error
    const { error } = await supabaseClient.from('users').upsert({
      id: data.user.id,
      email, full_name: fullName,
      location: document.getElementById('location').value, address: finalAddress,
      landmark: document.getElementById('landmark').value, phone: document.getElementById('phone').value,
      role: currentRole,
      bank_name: document.getElementById('bankName').value || null,
      account_number: document.getElementById('accountNumber').value || null,
      account_name: document.getElementById('accountName').value || null,
      guarantor_name: document.getElementById('guarantorName').value || null,
      guarantor_phone: document.getElementById('guarantorPhone').value || null,
      guarantor_address: document.getElementById('guarantorAddress').value || null,
      has_vehicle: document.querySelector('input[name="vehicle"]:checked')?.value || 'no',
      passport_url, nin_url, guarantor_passport_url: g_passport, guarantor_nin_url: g_nin,
      is_approved: currentRole === 'customer'? true : false
    }, { onConflict: 'id' }); // important for upsert
    if(error) throw error;

    msg.className = "text-center text-sm mt-2 text-green-600 font-bold";
    msg.innerText = "Success! Redirecting to login...";

    setTimeout(() => {
      window.location.href = 'index.html#login';
    }, 1500);

  } catch(err){
    msg.className = "text-center text-sm mt-2 text-red-500";
    msg.innerText = "Error: " + err.message;
    btn.disabled = false; btn.innerText = "Continue";
    btn.classList.remove('bg-yellow-500');
    btn.classList.add('bg-green-600');
    checkVehicle();
  }
}
</script>
</body></html>
