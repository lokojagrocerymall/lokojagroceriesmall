<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Lokoja Grocery Mall</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background:#f5f5f5; padding:20px; }
  .container { max-width:500px; margin:0 auto; background:#fff; padding:25px; border-radius:12px; }
  .role-select { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .role-btn { padding:12px 5px; border:2px solid #e5e7eb; border-radius:10px; background:#fff; cursor:pointer; text-align:center; font-size:13px; font-weight:600; }
  .role-btn.active { border-color:#16a34a; background:#f0fdf4; }
  .role-btn img { font-size:24px; margin-bottom:5px; }
  label { font-weight:600; font-size:14px; margin-bottom:5px; display:block; }
  input, select { width:100%; padding:12px 12px 12px 40px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; }
  .input-wrap { position:relative; }
  .input-wrap .icon { position:absolute; left:12px; top:12px; }
  .btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; font-size:16px; }
  .hidden { display:none; }
  .sub-text { color:#6b7280; font-size:12px; margin-top:-10px; margin-bottom:15px; }
</style>
</head>
<body>

<div class="container">
  <h2 style="margin-bottom:8px;">Join Lokoja Grocery Mall</h2>
  
  <p style="margin-bottom:10px; font-weight:600;">I want to join as</p>
  <div class="role-select">
    <div class="role-btn" onclick="selectRole('Customer')">
      <div>🛒</div>
      <div>Customer</div>
    </div>
    <div class="role-btn active" onclick="selectRole('Vendor')">
      <div>🏪</div>
      <div>Vendor</div>
    </div>
    <div class="role-btn" onclick="selectRole('Delivery Agent')">
      <div>🚚</div>
      <div>Delivery<br>Agent</div>
    </div>
  </div>
  <p class="sub-text" id="roleDesc">Sell your products on the platform</p>
  
  <form id="signupForm">
    <!-- COMMON FIELDS -->
    <label>Full Name</label>
    <div class="input-wrap">
      <span class="icon">👤</span>
      <input type="text" id="fullName" required>
    </div>
    
    <!-- VENDOR ONLY FIELDS -->
    <div id="vendorFields">
      <label>Location in Lokoja</label>
      <select id="location" required>
        <option value="">Select Area</option>
        <option>Ganaja</option>
        <option>Felele</option>
        <option>Adankolo</option>
        <option>Nataco</option>
        <option>Zango</option>
        <option>Other</option>
      </select>
      
      <label>Shop Address</label>
      <div class="input-wrap">
        <span class="icon">📍</span>
        <input type="text" id="shopAddress" placeholder="e.g No 5, Ganaja Junction" required>
      </div>
      
      <label>WhatsApp Number</label>
      <div class="input-wrap">
        <span class="icon">📞</span>
        <input type="tel" id="whatsapp" placeholder="08031234567" required>
      </div>
    </div>
    
    <!-- CUSTOMER/AGENT PHONE -->
    <div id="simpleFields" class="hidden">
      <label>Phone Number</label>
      <div class="input-wrap">
        <span class="icon">📞</span>
        <input type="tel" id="phone" required>
      </div>
    </div>
    
    <label>Email</label>
    <div class="input-wrap">
      <span class="icon">✉️</span>
      <input type="email" id="email" required>
    </div>
    
    <label>Password</label>
    <input type="password" id="password" placeholder="Create password" required>
    
    <button type="submit" class="btn">Continue</button>
  </form>
</div>

<script>
let selectedRole = 'Vendor';

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  event.target.closest('.role-btn').classList.add('active');
  
  if(role === 'Vendor') {
    document.getElementById('vendorFields').classList.remove('hidden');
    document.getElementById('simpleFields').classList.add('hidden');
    document.getElementById('roleDesc').innerText = 'Sell your products on the platform';
  } else if(role === 'Customer') {
    document.getElementById('vendorFields').classList.add('hidden');
    document.getElementById('simpleFields').classList.remove('hidden');
    document.getElementById('roleDesc').innerText = 'Shop for groceries and essentials';
  } else {
    document.getElementById('vendorFields').classList.add('hidden');
    document.getElementById('simpleFields').classList.remove('hidden');
    document.getElementById('roleDesc').innerText = 'Deliver orders to customers';
  }
}

document.getElementById("signupForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const newUser = {
    id: Date.now(),
    name: document.getElementById("fullName").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    role: selectedRole,
    status: 'pending'
  };
  
  if(selectedRole === 'Vendor') {
    newUser.location = document.getElementById("location").value;
    newUser.shop_address = document.getElementById("shopAddress").value;
    newUser.phone = document.getElementById("whatsapp").value;
  } else {
    newUser.phone = document.getElementById("phone").value;
  }
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  allUsers.push(newUser);
  localStorage.setItem('allUsers', JSON.stringify(allUsers));
  
  alert("Application submitted! Wait for admin approval.");
  window.location.href = "login.html";
});
</script>
</body>
</html>
