<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
  <h1 class="text-2xl font-bold text-center text-green-600">Join Lokoja Grocery Mall</h1>
  <p class="text-center text-gray-500 text-sm mb-4">I want to join as</p>

  <!-- ROLE SELECTOR -->
  <div class="flex gap-2 mb-4">
    <button type="button" onclick="selectRole('customer')" id="btnCustomer" class="flex-1 p-2 rounded-lg border-2 border-green-600 bg-green-50">
      🛒<br><b>Customer</b>
    </button>
    <button type="button" onclick="selectRole('vendor')" id="btnVendor" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🏪<br><b>Vendor</b>
    </button>
    <button type="button" onclick="selectRole('delivery_agent')" id="btnDeliveryAgent" class="flex-1 p-2 rounded-lg border-2 border-gray-200">
      🚚<br><b>Delivery<br>Agent</b>
    </button>
  </div>

  <form onsubmit="signup(event)" class="space-y-3">
    <input id="fullName" type="text" placeholder="Full Name" required class="w-full p-3 border rounded-lg">

    <select id="location" required class="w-full p-3 border rounded-lg bg-white">
      <option value="">Select Location in Lokoja</option>
    </select>

    <div id="addressField">
      <input id="address" type="text" placeholder="Shop/House Address" required class="w-full p-3 border rounded-lg">
    </div>

    <input id="landmark" type="text" placeholder="Nearest Bus Stop / Landmark" required class="w-full p-3 border rounded-lg">
    <input id="phone" type="tel" placeholder="WhatsApp Number" required class="w-full p-3 border rounded-lg">
    <input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg">
    
    <!-- PASSWORD WITH EYE ICON -->
    <div class="relative">
      <input id="password" type="password" placeholder="Password - At least 6 characters" required class="w-full p-3 border rounded-lg pr-10">
      <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-3 text-gray-500">
        <span id="eye-password">👁️</span>
      </button>
    </div>

    <div id="bankFields" class="space-y-3">
      <input id="bankName" type="text" placeholder="Bank Name" class="w-full p-3 border rounded-lg">
      <input id="accountNumber" type="text" placeholder="Account Number" class="w-full p-3 border rounded-lg">
      <input id="accountName" type="text" placeholder="Account Name" class="w-full p-3 border rounded-lg">
    </div>

    <!-- DELIVERY AGENT ONLY SECTION -->
    <div id="deliveryFields" class="hidden space-y-4">
      <h3 class="font-bold text-green-600 mt-2">Delivery Verification</h3>
      <div>
        <label class="text-sm font-semibold">Passport Photograph</label>
        <input id="passportPhoto" type="file" accept="image/*" class="w-full p-2 border rounded-lg">
      </div>
      <div>
        <label class="text-sm font-semibold">NIN Slip / Card</label>
        <input id="ninCard" type="file" accept="image/*" class="w-full p-2 border rounded-lg">
      </div>

      <h3 class="font-bold text-green-600 mt-2">Guarantor Information</h3>
      <input id="guarantorName" type="text" placeholder="Guarantor Full Name" required class="w-full p-3 border rounded-lg">
      <input id="guarantorPhone" type="tel" placeholder="Guarantor WhatsApp Number" required class="w-full p-3 border rounded-lg">
      <input id="guarantorAddress" type="text" placeholder="Guarantor Address" required class="w-full p-3 border rounded-lg">
      <div>
        <label class="text-sm font-semibold">Guarantor Passport</label>
        <input id="guarantorPassport" type="file" accept="image/*" class="w-full p-2 border rounded-lg">
      </div>
      <div>
        <label class="text-sm font-semibold">Guarantor NIN</label>
        <input id="guarantorNIN" type="file" accept="image/*" class="w-full p-2 border rounded-lg">
      </div>

      <h3 class="font-bold text-green-600 mt-2">Vehicle</h3>
      <div class="flex gap-4">
        <label><input type="radio" name="vehicle" value="yes" checked> Yes, I am Driver & Rider</label>
        <label><input type="radio" name="vehicle" value="no"> No</label>
      </div>
    </div>

    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Continue</button>
  </form>
  <p class="text-center text-sm mt-3">Already have account? <a href="login.html" class="text-purple-600 font-bold">Login</a></p>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = 'customer';

const LOKOJA_AREAS = [
  "200 Units","500 Unit","Adankolo","Adankolo Junction","Adankolo Newlayout","Anebo Qtrs",
  "Barracks","C - Division","CBN","Commissioners Qtrs","Como","Crusher","Dunamis","FMC",
  "FUL Adankolo","FUL Felele","Fentolu","Felele","Gadumo","Ganaja","Ganaja Junction",
  "Government Day","Government House","GRA","Hydro Junction","Jimgbe","Kabawa","Kabba Junction",
  "Karaworo","Kporoka","Kpata Market","Maigeri Palace","NATACO","NUJ","NTA","New Market",
  "New Stadium","Old Market","Old Poly Qtrs","Otokiti","Phase 1","Phase 2","Police Clinic",
  "Poly","Post Office","Shetima","Zenith Bank","Zango","Zone 8"
];

window.onload = () => {
  const select = document.getElementById('location');
  LOKOJA_AREAS.forEach(area => {
    select.innerHTML += `<option value="${area}">${area}</option>`;
  });
  selectRole('customer');
}

// NEW FUNCTION: TOGGLE PASSWORD
function togglePassword(id) {
  const input = document.getElementById(id);
  const eye = document.getElementById('eye-' + id);
  if(input.type === "password"){
    input.type = "text";
    eye.textContent = "🙈"; // hide
  } else {
    input.type = "password";
    eye.textContent = "👁️"; // show
  }
}

function selectRole(role){
  currentRole = role;
  ['btnCustomer','btnVendor','btnDeliveryAgent'].forEach(id=>{
    document.getElementById(id).classList.remove('border-green-600','bg-green-50');
    document.getElementById(id).classList.add('border-gray-200');
  });
  if(role === 'customer') document.getElementById('btnCustomer').classList.add('border-green-600','bg-green-50');
  if(role === 'vendor') document.getElementById('btnVendor').classList.add('border-green-600','bg-green-50');
  if(role === 'delivery_agent') document.getElementById('btnDeliveryAgent').classList.add('border-green-600','bg-green-50');

  if(role === 'customer'){
    document.getElementById('addressField').classList.add('hidden');
    document.getElementById('bankFields').classList.add('hidden');
    document.getElementById('deliveryFields').classList.add('hidden');
    document.getElementById('address').required = false;
  } else {
    document.getElementById('addressField').classList.remove('hidden');
    document.getElementById('bankFields').classList.remove('hidden');
    document.getElementById('address').required = true;
    if(role === 'delivery_agent'){
      document.getElementById('deliveryFields').classList.remove('hidden');
    } else {
      document.getElementById('deliveryFields').classList.add('hidden');
    }
  }
}

async function signup(e){
  e.preventDefault();
  const userData = {
    full_name: document.getElementById('fullName').value,
    location: document.getElementById('location').value,
    address: document.getElementById('address').value,
    landmark: document.getElementById('landmark').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    bank_name: document.getElementById('bankName').value,
    account_number: document.getElementById('accountNumber').value,
    account_name: document.getElementById('accountName').value,
    role: currentRole,
    guarantor_name: document.getElementById('guarantorName')?.value || '',
    guarantor_phone: document.getElementById('guarantorPhone')?.value || '',
    guarantor_address: document.getElementById('guarantorAddress')?.value || '',
    has_vehicle: document.querySelector('input[name="vehicle"]:checked')?.value || 'no'
  };

  const { error } = await supabaseClient.from('users').insert([userData]);
  if(error) alert(error.message);
  else {
    alert('Account Created! Please Login');
    location.href='login.html';
  }
}
</script>
</body></html>
