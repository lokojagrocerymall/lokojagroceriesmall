<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Join Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 flex items-center justify-center min-h-screen p-4"><div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md"><h1 class="text-2xl font-bold text-center text-green-600">Join Lokoja Grocery Mall</h1><p class="text-center text-gray-500 text-sm mb-4">I want to join as</p><div class="flex gap-2 mb-4"><button type="button" onclick="selectRole('customer')" id="btnCustomer" class="flex-1 p-2 rounded-lg border-2 border-green-600 bg-green-50">🛒<br><b>Customer</b></button><button type="button" onclick="selectRole('vendor')" id="btnVendor" class="flex-1 p-2 rounded-lg border-2 border-gray-200">🏪<br><b>Vendor</b></button><button type="button" onclick="selectRole('delivery_agent')" id="btnDeliveryAgent" class="flex-1 p-2 rounded-lg border-2 border-gray-200">🚚<br><b>Delivery<br>Agent</b></button></div><form id="signupForm" onsubmit="signup(event)" class="space-y-3" autocomplete="off"><input id="fullName" type="text" placeholder="Full Name" required class="w-full p-3 border rounded-lg" autocomplete="off"><select id="location" required class="w-full p-3 border rounded-lg bg-white"><option value="">Select Location in Lokoja</option></select><input id="landmark" type="text" placeholder="Nearest Bus Stop / Landmark" required class="w-full p-3 border rounded-lg" autocomplete="off"><input id="phone" type="tel" placeholder="WhatsApp Number" required class="w-full p-3 border rounded-lg" autocomplete="off"><input id="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg" autocomplete="off"><div class="relative"><input id="password" type="password" placeholder="Password - At least 6 characters" required minlength="6" class="w-full p-3 border rounded-lg pr-10" autocomplete="new-password"><button type="button" onclick="togglePassword('password')" class="absolute right-3 top-3 text-gray-500"><span id="eye-password">👁️</span></button></div><div id="customerAddressField" class="hidden"><input id="customerAddress" type="text" placeholder="Delivery Address" class="w-full p-3 border rounded-lg"><p class="text-xs text-gray-500 mt-1">Where should we deliver your orders?</p></div><div id="addressField" class="hidden"><input id="address" type="text" placeholder="Shop/House Address" class="w-full p-3 border rounded-lg"></div><div id="shopNameField" class="hidden"><input id="shopName" type="text" placeholder="Shop Name / Business Name e.g Emiguni Store" class="w-full p-3 border rounded-lg"></div><div id="bankFields" class="space-y-3 hidden"><p class="text-sm font-bold text-green-600">Bank Details for Payout</p><select id="bankName" class="w-full p-3 border rounded-lg bg-white"><option value="">Select Bank</option></select><div class="flex gap-2"><input id="accountNumber" type="text" placeholder="Account Number (10 digits)" maxlength="10" class="flex-1 p-3 border rounded-lg" autocomplete="off"><button type="button" id="verifyBtn" onclick="verifyAccountManual()" class="bg-black text-white px-4 rounded-lg text-sm font-bold">Verify</button></div><input id="accountName" type="text" placeholder="Account Name - auto fills after verify" readonly class="w-full p-3 border rounded-lg bg-gray-50"><input type="hidden" id="bankCode"><input type="hidden" id="bankNameText"><p id="verifyStatus" class="text-xs hidden p-2 rounded"></p></div><div id="deliveryFields" class="hidden space-y-4"><p class="text-sm font-bold text-green-600">Delivery Verification *</p><div><label class="text-sm font-semibold">Passport Photograph *</label><input id="passportPhoto" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div><div><label class="text-sm font-semibold">NIN Slip / Card *</label><input id="ninCard" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div><p class="text-sm font-bold text-green-600">Guarantor Information *</p><input id="guarantorName" type="text" placeholder="Guarantor Full Name" class="w-full p-3 border rounded-lg"><input id="guarantorPhone" type="tel" placeholder="Guarantor WhatsApp Number" class="w-full p-3 border rounded-lg"><input id="guarantorAddress" type="text" placeholder="Guarantor Address" class="w-full p-3 border rounded-lg"><div><label class="text-sm font-semibold">Guarantor Passport *</label><input id="guarantorPassport" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div><div><label class="text-sm font-semibold">Guarantor NIN *</label><input id="guarantorNIN" type="file" accept="image/*" class="w-full p-2 border rounded-lg"></div><p class="text-sm font-bold text-green-600">Vehicle</p><div class="flex gap-4"><label><input type="radio" name="vehicle" value="yes" checked> Yes, I am Driver & Rider</label><label><input type="radio" name="vehicle" value="no"> No</label></div></div><button id="submitBtn" type="submit" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Continue</button><p id="msg" class="text-center text-sm mt-2"></p></form><p class="text-center text-sm mt-3">Already have account? <a href="index.html#login" class="text-purple-600 font-bold">Login</a></p></div><script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";let currentRole='customer',allBanksLoaded=false;const LOKOJA_AREAS=["200 Units","500 Unit","Adankolo","Adankolo Junction","Adankolo Newlayout","Anebo Qtrs","Barracks","C - Division","CBN","Commissioners Qtrs","Como","Crusher","Dunamis","FMC","FUL Adankolo","FUL Felele","Fentolu","Felele","Gadumo","Ganaja","Ganaja Junction","Government Day","Government House","GRA","Hydro Junction","Jimgbe","Kabawa","Kabba Junction","Karaworo","Kporoka","Kpata Market","Maigeri Palace","NATACO","NUJ","NTA","New Market","New Stadium","Old Market","Old Poly Qtrs","Otokiti","Phase 1","Phase 2","Police Clinic","Poly","Post Office","Shetima","Zenith Bank","Zango","Zone 8"];
window.onload=()=>{const s=document.getElementById('location');LOKOJA_AREAS.forEach(a=>s.innerHTML+=`<option value="${a}">${a}</option>`);selectRole('customer');document.querySelectorAll('input[name="vehicle"]').forEach(r=>r.addEventListener('change',checkVehicle));}
function togglePassword(id){const i=document.getElementById(id),e=document.getElementById('eye-'+id);i.type=i.type==="password"?"text":"password";e.textContent=i.type==="password"?"👁️":"🙈";}
function checkVehicle(){const b=document.getElementById('submitBtn'),v=document.querySelector('input[name="vehicle"]:checked')?.value;if(currentRole==='delivery_agent'&&v==='no'){b.disabled=true;b.classList.add('bg-gray-400');b.classList.remove('bg-green-600');}else{b.disabled=false;b.classList.add('bg-green-600');b.classList.remove('bg-gray-400');}}
async function loadAllBanks(){if(allBanksLoaded)return;const b=document.getElementById('bankName');b.innerHTML='<option>Loading...</option>';const banks=[{name:"Access Bank",code:"044"},{name:"ALAT by WEMA",code:"035A"},{name:"Carbon",code:"565"},{name:"Ecobank",code:"050"},{name:"Fidelity Bank",code:"070"},{name:"First Bank",code:"011"},{name:"FCMB",code:"214"},{name:"GTBank",code:"058"},{name:"Jaiz Bank",code:"301"},{name:"Keystone Bank",code:"082"},{name:"Kuda Bank",code:"50211"},{name:"Moniepoint MFB",code:"50515"},{name:"Opay",code:"999992"},{name:"PalmPay",code:"999991"},{name:"Polaris Bank",code:"076"},{name:"Providus Bank",code:"101"},{name:"Stanbic IBTC",code:"221"},{name:"Sterling Bank",code:"232"},{name:"UBA",code:"033"},{name:"Union Bank",code:"032"},{name:"Unity Bank",code:"215"},{name:"Wema Bank",code:"035"},{name:"Zenith Bank",code:"057"}];b.innerHTML='<option value="">Select Bank</option>';banks.sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>b.innerHTML+=`<option value="${x.code}" data-name="${x.name}">${x.name}</option>`);allBanksLoaded=true;}
function setupBankVerification(){document.getElementById('bankName').onchange=function(){const o=this.options[this.selectedIndex];document.getElementById('bankCode').value=this.value;document.getElementById('bankNameText').value=o.getAttribute('data-name')||''; document.getElementById('accountName').value=''; document.getElementById('verifyStatus').classList.add('hidden');};}
async function verifyAccountManual(){const acc=document.getElementById('accountNumber').value.trim(),bankCode=document.getElementById('bankCode').value||document.getElementById('bankName').value;if(!bankCode)return alert("Select bank");if(acc.length!==10)return alert("10 digits");const btn=document.getElementById('verifyBtn'),st=document.getElementById('verifyStatus');btn.innerText="⏳...";btn.disabled=true;st.classList.remove('hidden');st.textContent="⏳ Verifying...";try{const res=await fetch(SUPABASE_URL+"/functions/v1/verify-bank",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify({account_number:acc,bank_code:bankCode})});const data=await res.json();if(data&&data.verified){document.getElementById('accountName').value=data.account_name;st.textContent="✅ Verified: "+data.account_name;st.className="text-xs p-2 rounded bg-green-100 text-green-700 font-bold";}else{st.textContent="⚠️ "+(data?.message||"Could not verify - you can still signup");st.className="text-xs p-2 rounded bg-yellow-100 text-yellow-700";}}catch(e){st.textContent="⚠️ Network - you can still signup: "+e.message;st.className="text-xs p-2 rounded bg-yellow-100 text-yellow-700";}btn.innerText="Verify";btn.disabled=false;}
function selectRole(role){
document.getElementById('bankName').value='';
document.getElementById('accountNumber').value='';
document.getElementById('accountName').value='';
document.getElementById('bankCode').value='';
document.getElementById('bankNameText').value='';
const vs=document.getElementById('verifyStatus'); if(vs){vs.classList.add('hidden'); vs.textContent=''; vs.className='text-xs hidden p-2 rounded';}
const vb=document.getElementById('verifyBtn'); if(vb){vb.innerText='Verify'; vb.disabled=false;}
['passportPhoto','ninCard','guarantorPassport','guarantorNIN'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
['guarantorName','guarantorPhone','guarantorAddress','shopName','address','customerAddress'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
currentRole=role;['btnCustomer','btnVendor','btnDeliveryAgent'].forEach(id=>{document.getElementById(id).classList.remove('border-green-600','bg-green-50');document.getElementById(id).classList.add('border-gray-200');});if(role==='customer')document.getElementById('btnCustomer').classList.add('border-green-600','bg-green-50');if(role==='vendor')document.getElementById('btnVendor').classList.add('border-green-600','bg-green-50');if(role==='delivery_agent')document.getElementById('btnDeliveryAgent').classList.add('border-green-600','bg-green-50');['customerAddressField','addressField','shopNameField','bankFields','deliveryFields'].forEach(id=>document.getElementById(id).classList.add('hidden'));['customerAddress','address','shopName','bankName','accountNumber','guarantorName','guarantorPhone','guarantorAddress','passportPhoto','ninCard','guarantorPassport','guarantorNIN'].forEach(id=>document.getElementById(id).required=false);if(role==='customer'){document.getElementById('customerAddressField').classList.remove('hidden');document.getElementById('customerAddress').required=true;}if(role==='vendor'){document.getElementById('addressField').classList.remove('hidden');document.getElementById('shopNameField').classList.remove('hidden');document.getElementById('bankFields').classList.remove('hidden');document.getElementById('address').required=true;document.getElementById('shopName').required=true;document.getElementById('bankName').required=true;document.getElementById('accountNumber').required=true;loadAllBanks();setupBankVerification();}if(role==='delivery_agent'){document.getElementById('addressField').classList.remove('hidden');document.getElementById('bankFields').classList.remove('hidden');document.getElementById('deliveryFields').classList.remove('hidden');document.getElementById('address').required=true;document.getElementById('bankName').required=true;document.getElementById('accountNumber').required=true;document.getElementById('passportPhoto').required=true;document.getElementById('ninCard').required=true;document.getElementById('guarantorName').required=true;document.getElementById('guarantorPhone').required=true;document.getElementById('guarantorAddress').required=true;document.getElementById('guarantorPassport').required=true;document.getElementById('guarantorNIN').required=true;loadAllBanks();setupBankVerification();checkVehicle();}}
async function uploadFile(f,p){if(!f)return'';const form=new FormData();form.append('file',f);const res=await fetch(SUPABASE_URL+"/storage/v1/object/delivery_docs/"+p,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:form});if(!res.ok)throw new Error("Upload failed");return SUPABASE_URL+"/storage/v1/object/public/delivery_docs/"+p;}
async function signup(e){e.preventDefault();const b=document.getElementById('submitBtn'),m=document.getElementById('msg');b.disabled=true;b.innerText="Creating...";m.innerText="";try{if(currentRole==='delivery_agent'){const v=document.querySelector('input[name="vehicle"]:checked')?.value;if(v==='no')throw new Error("You must have a vehicle");}let passport_url='',nin_url='',g_passport='',g_nin='';if(currentRole==='delivery_agent'){const uid=Date.now()+'_'+Math.random().toString(36).slice(2);if(document.getElementById('passportPhoto').files[0])passport_url=await uploadFile(document.getElementById('passportPhoto').files[0],`delivery/${uid}/passport.jpg`);if(document.getElementById('ninCard').files[0])nin_url=await uploadFile(document.getElementById('ninCard').files[0],`delivery/${uid}/nin.jpg`);if(document.getElementById('guarantorPassport').files[0])g_passport=await uploadFile(document.getElementById('guarantorPassport').files[0],`delivery/${uid}/g_passport.jpg`);if(document.getElementById('guarantorNIN').files[0])g_nin=await uploadFile(document.getElementById('guarantorNIN').files[0],`delivery/${uid}/g_nin.jpg`);}const payload={email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value.trim(),full_name:document.getElementById('fullName').value,role:currentRole,location:document.getElementById('location').value,landmark:document.getElementById('landmark').value,phone:document.getElementById('phone').value,address:currentRole==='customer'?document.getElementById('customerAddress').value:document.getElementById('address').value,business_name:document.getElementById('shopName')?.value||null,bank_name:document.getElementById('bankNameText').value||null,bank_code:document.getElementById('bankCode').value||document.getElementById('bankName').value||null,account_number:document.getElementById('accountNumber').value||null,account_name:document.getElementById('accountName').value||null,guarantor_name:document.getElementById('guarantorName').value||null,guarantor_phone:document.getElementById('guarantorPhone').value||null,guarantor_address:document.getElementById('guarantorAddress').value||null,has_vehicle:document.querySelector('input[name="vehicle"]:checked')?.value||'no',passport_url,nin_url,guarantor_passport_url:g_passport,guarantor_nin_url:g_nin};const res=await fetch(SUPABASE_URL+"/functions/v1/secure-signup",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(payload)});const out=await res.json();if(!res.ok)throw new Error(out.error||"Signup failed");m.className="text-center text-sm mt-2 text-green-600 font-bold";m.innerText="Success! Redirecting to login...";setTimeout(()=>{window.location.href='index.html#login';},1500);}catch(err){m.className="text-center text-sm mt-2 text-red-500";m.innerText="Error: "+err.message;b.disabled=false;b.innerText="Continue";checkVehicle();}}
</script></body></html>
