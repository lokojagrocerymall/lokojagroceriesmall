<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Lokoja Grocery Mall</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background: #f8f9fa; padding-top: 60px; }
  
  .app-header {
    position: fixed; top: 0; left: 0; width: 100%;
    background: #16a34a; color: white; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; z-index: 1000;
  }
  .app-header .logo { width: 32px; height: 32px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  
  .container { max-width: 480px; margin: 20px auto; padding: 0 16px; }
  
  .basket-icon { width: 60px; height: 60px; background: #16a34a; border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  
  h1 { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; }
  
  .role-selector { background: white; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .role-label { font-size: 14px; color: #374151; margin-bottom: 12px; font-weight: 500; }
  .role-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  
  .role-btn {
    border: 2px solid #e5e7eb; border-radius: 12px; padding: 16px 8px;
    text-align: center; cursor: pointer; background: white; transition: all 0.2s;
  }
  .role-btn.active {
    border-color: #16a34a; background: #f0fdf4;
  }
  .role-icon { font-size: 24px; margin-bottom: 6px; }
  .role-name { font-size: 13px; font-weight: 600; color: #111827; }
  .role-desc { font-size: 11px; color: #6b7280; margin-top: 6px; }
  
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px; display: block; }
  .input-wrapper { position: relative; }
  .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
  .form-input {
    width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #d1d5db;
    border-radius: 10px; font-size: 15px; background: white;
  }
  .form-input:focus { outline: none; border-color: #16a34a; }
  
  .btn-submit {
    width: 100%; padding: 14px; background: #16a34a; color: white;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    margin-top: 8px; cursor: pointer;
  }
  
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">🛒</div>
  <strong>Lokoja Grocery Mall</strong>
</header>

<div class="container">
  <div class="basket-icon">🧺</div>
  <h1>Create Account</h1>
  <p class="subtitle">Join Lokoja Grocery Mall today</p>
  
  <div class="role-selector">
    <div class="role-label">I want to join as</div>
    <div class="role-options">
      <div class="role-btn active" onclick="selectRole(this)">
        <div class="role-icon">🛒</div>
        <div class="role-name">Customer</div>
      </div>
      <div class="role-btn" onclick="selectRole(this)">
        <div class="role-icon">🏪</div>
        <div class="role-name">Vendor</div>
      </div>
      <div class="role-btn" onclick="selectRole(this)">
        <div class="role-icon">🚚</div>
        <div class="role-name">Delivery<br>Agent</div>
      </div>
    </div>
    <div class="role-desc" id="roleDesc">Shop and order groceries</div>
  </div>
  
  <form>
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="form-input" placeholder="Your full name">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <div class="input-wrapper">
        <span class="input-icon">📞</span>
        <input type="tel" class="form-input" placeholder="0803...">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">Email</label>
      <div class="input-wrapper">
        <span class="input-icon">✉️</span>
        <input type="email" class="form-input" placeholder="you@email.com">
      </div>
    </div>
    
    <button type="submit" class="btn-submit">Continue</button>
  </form>
</div>


<script>
function selectRole(el) {
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const desc = el.querySelector('.role-name').innerText;
  if(desc.includes('Customer')) document.getElementById('roleDesc').innerText = 'Shop and order groceries';
  if(desc.includes('Vendor')) document.getElementById('roleDesc').innerText = 'Sell your products on the platform';
  if(desc.includes('Delivery')) document.getElementById('roleDesc').innerText = 'Deliver orders and earn money';
}
</script>

</body>
</html>
