<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokoja Grocery Mall - Sign Up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;padding:18px;color:#111827}
.wrap{max-width:420px;margin:0 auto}
.logo{text-align:center;margin-bottom:18px}
.logo .t{font-size:26px;font-weight:900;color:#166534}
.logo .s{font-size:13px;color:#6b7280}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,0.07)}
.card h1{font-size:22px;text-align:center;color:#166534;margin-bottom:6px}
.card p{font-size:13px;color:#6b7280;text-align:center;margin-bottom:16px}
label{font-size:12px;font-weight:800;margin-top:12px;display:block;color:#374151}
input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;margin-top:6px;background:#fff;outline:none}
input:focus,select:focus{border-color:#16a34a;box-shadow:0 0 0 3px #dcfce7}
button{width:100%;background:#16a34a;color:#fff;border:0;padding:15px;border-radius:12px;font-size:16px;font-weight:900;margin-top:20px;cursor:pointer}
button:disabled{opacity:0.5}
#err{color:#dc2626;font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:18px}
#ok{color:#16a34a;font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:18px}
.foot{text-align:center;margin-top:14px;font-size:13px}
.foot a{color:#166534;font-weight:800;text-decoration:none}
.topbar{background:#facc15;text-align:center;padding:7px;font-size:12px;font-weight:900;border-radius:10px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
<div class="logo"><div class="t">Lokoja Grocery Mall</div><div class="s">Fresh groceries from local vendors</div></div>
<div class="topbar">⏰ OPEN: Mon-Sat 8AM-6PM • Sunday CLOSED</div>
<div class="card">
<h1>Create Account</h1>
<p>Join as Vendor or Customer</p>
<label>Role</label>
<select id="role">
<option value="vendor">Vendor</option>
<option value="customer">Customer</option>
</select>
<label>Full Name</label>
<input id="name" placeholder="Full Name">
<label>Phone</label>
<input id="phone" placeholder="080...">
<label>Email</label>
<input id="email" type="email" placeholder="you@email.com">
<label>Password (min 6 chars)</label>
<input id="password" type="password" placeholder="Password">
<button id="btn" onclick="signup()">Create Account</button>
<div id="err"></div>
<div id="ok"></div>
<div class="foot">Already have account? <a href="index.html#login">Login</a></div>
</div>
</div>
<script>
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
async function signup(){
  const err=document.getElementById('err');const ok=document.getElementById('ok');
  err.textContent='';ok.textContent='';
  const role=document.getElementById('role').value;
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value.trim();
  if(!name||!phone||!email||!password){err.textContent='Fill all fields';return}
  if(password.length<6){err.textContent='Password min 6 chars';return}
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Creating...';
  try{
    const r=await fetch(URL+"/functions/v1/secure-signup",{
      method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password,full_name:name,phone,role})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||'Signup failed');
    ok.textContent='✅ Success! '+ (data.email||email) +' created as '+role;
    err.textContent='';
    setTimeout(()=>{location.href='index.html#login'},1500);
  }catch(e){err.textContent='Error: '+e.message;btn.disabled=false;btn.textContent='Create Account';}
}
</script>
</body>
</html>
