<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co' // <- put your URL from Supabase > Settings > API
const SUPABASE_KEY = 'YOUR_ANON_KEY' // <- put your anon key
const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY)

let selectedRole = 'vendor';
function setRole(r){ /* keep your same setRole code */ }
function togglePass(){ /* same */ }

async function signup(){
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const shop = document.getElementById('shop').value.trim();
  const location = document.getElementById('location').value;
  const bank = document.getElementById('bank').value;
  const accNo = document.getElementById('accNo').value.trim();
  const accName = document.getElementById('accName').value.trim() || name;

  if(!name || !email || !password || !phone){ alert('Fill all required fields'); return; }

  // SAVE TO SUPABASE - NOT localStorage!
  const { data, error } = await supabase.from('users').insert([{
    email: email,
    password: password,
    name: name,
    phone: phone,
    shop_address: shop,
    location: location,
    bank_name: bank,
    account_number: accNo,
    account_name: accName,
    shop_name: shop,
    is_approved: false
  }]).select();

  if(error){
    if(error.message.includes('duplicate')){ alert('Email already exists, please Login'); window.location.href='login.html'; return; }
    alert('Error: ' + error.message); return;
  }

  alert('✅ Registration successful! Wait for Admin approval.');
  window.location.href='login.html';
}
</script>
