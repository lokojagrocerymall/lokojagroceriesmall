<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Lokoja Grocery Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0">
  <b class="text-green-700">Admin Dashboard</b>
  <button onclick="localStorage.removeItem('lgm_user'); location.href='/';" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Logout</button>
</header>

<div class="p-4 max-w-5xl mx-auto">
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-white p-3 rounded-xl shadow text-center">
      <div class="text-xs text-gray-400">Gross Sales</div>
      <div class="text-xl font-black" id="sales">₦0</div>
    </div>
    <div class="bg-white p-3 rounded-xl shadow text-center">
      <div class="text-xs text-gray-400">Platform Income</div>
      <div class="text-xl font-black text-green-600" id="income">₦0</div>
    </div>
    <div class="bg-white p-3 rounded-xl shadow text-center">
      <div class="text-xs text-gray-400">Pending</div>
      <div class="text-xl font-black text-orange-600" id="pendingCount">0</div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow">
    <div class="flex border-b overflow-x-auto text-xs">
      <button onclick="showTab('pending')" id="btnP" class="flex-1 p-3 font-bold text-green-600 border-b-2 border-green-600">Pending (<span id="cP">0</span>)</button>
      <button onclick="showTab('vendors')" id="btnV" class="flex-1 p-3 font-bold text-gray-400">Active V (<span id="cV">0</span>)</button>
      <button onclick="showTab('suspended')" id="btnS" class="flex-1 p-3 font-bold text-gray-400">Suspended (<span id="cS">0</span>)</button>
      <button onclick="showTab('agents')" id="btnA" class="flex-1 p-3 font-bold text-gray-400">Agents (<span id="cA">0</span>)</button>
      <button onclick="showTab('orders')" id="btnO" class="flex-1 p-3 font-bold text-gray-400">Orders (<span id="cO">0</span>)</button>
    </div>
    <div id="list" class="p-4 text-sm">Loading...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let users=[], orders=[], tab='pending';
let curUser = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!curUser.email || curUser.role!=='admin'){ alert('Login as admin first'); location.href='/'; }

async function load(){
  document.getElementById('list').innerHTML = 'Loading...';
  try{
    const {data:u} = await supabaseClient.from('users').select('*');
    users = u||[];

    const {data:o} = await supabaseClient.from('orders')
     .select('*')
     .eq('status','paid')
     .eq('payment_status', true)
     .order('created_at',{ascending:false});
    orders = o||[];

    let vendors = users.filter(x=>String(x.role).toLowerCase().trim()==='vendor');
    let agents = users.filter(x=>String(x.role).toLowerCase().trim()==='delivery_agent');
    let pendingV = vendors.filter(x=>x.is_approved===false || x.is_approved===null);
    let pendingA = agents.filter(x=>x.is_approved===false || x.is_approved===null);
    let suspendedV = vendors.filter(x=>x.is_approved===false);
    let activeV = vendors.filter(x=>x.is_approved===true);

    document.getElementById('cP').innerText = pendingV.length + pendingA.length;
    document.getElementById('cV').innerText = activeV.length;
    document.getElementById('cS').innerText = suspendedV.length;
    document.getElementById('cA').innerText = agents.length;
    document.getElementById('cO').innerText = orders.length;
    document.getElementById('pendingCount').innerText = pendingV.length + pendingA.length;

    let gross = orders.reduce((s,x)=>s+Number(x.total||0),0);
    document.getElementById('sales').innerText = '₦'+Math.round(gross).toLocaleString();
    document.getElementById('income').innerText = '₦'+Math.round(gross*0.15).toLocaleString();
    render();
  }catch(e){
    document.getElementById('list').innerHTML = `<div class="text-red-500">ERROR: ${e.message}</div>`;
  }
}

function render(){
  let data=[];
  if(tab==='pending') data = users.filter(x=> (String(x.role).toLowerCase().trim()==='vendor' || String(x.role).toLowerCase().trim()==='delivery_agent') && (x.is_approved===false || x.is_approved===null));
  if(tab==='vendors') data = users.filter(x=>String(x.role).toLowerCase().trim()==='vendor' && x.is_approved===true);
  if(tab==='suspended') data = users.filter(x=> (String(x.role).toLowerCase().trim()==='vendor' || String(x.role).toLowerCase().trim()==='delivery_agent') && x.is_approved===false);
  if(tab==='agents') data = users.filter(x=>String(x.role).toLowerCase().trim()==='delivery_agent');
  if(tab==='orders') data = orders;

  if(data.length===0){ document.getElementById('list').innerHTML = `<div class="text-center text-gray-400 py-10">No ${tab} yet</div>`; return; }

  let html='';
  if(tab==='pending' || tab==='vendors' || tab==='suspended' || tab==='agents'){
    data.forEach(u=>{
      let roleBadge = String(u.role).toLowerCase().trim()==='delivery_agent'? `<span class="bg-blue-500 text-white px-2 py-0.5 rounded text-[10px]">AGENT</span>` : `<span class="bg-green-500 text-white px-2 py-0.5 rounded text-[10px]">VENDOR</span>`;
      let actionBtn = '';
      if(tab==='pending' || tab==='suspended'){
        actionBtn = `<button onclick="updateStatus('${u.email}', true)" class="mt-2 bg-green-600 text-white px-4 py-1 rounded-full text-xs font-bold">Approve / Reactivate</button>`;
      } else {
        actionBtn = `<button onclick="updateStatus('${u.email}', false)" class="mt-2 bg-red-600 text-white px-4 py-1 rounded-full text-xs font-bold">Suspend</button>`;
      }

      html += `<div class="border rounded-lg p-3 mb-2">
        <div class="font-bold">${u.full_name} ${roleBadge}</div>
        <div class="text-xs text-gray-500">${u.email} • ${u.phone} • ${u.location}</div>
        <div class="text-xs mt-1">Status: <b class="${u.is_approved? 'text-green-600':'text-red-600'}">${u.is_approved? 'Active':'Suspended'}</b></div>
        ${actionBtn}
      </div>`;
    });
  }
  if(tab==='orders'){
    data.forEach(o=>{
      let agentInfo = o.delivery_agent_name? `<div class="text-xs text-blue-600 font-bold">Agent: ${o.delivery_agent_name}</div>` : `<div class="text-xs text-orange-600 font-bold">Waiting for Agent</div>`;
      html += `<div class="border rounded-lg p-3 mb-2">
        <div class="flex justify-between"><div class="font-bold">Order #${o.id}</div><div class="font-bold text-green-700">₦${Number(o.total||0).toLocaleString()}</div></div>
        <div class="text-xs">Customer: ${o.customer_name || o.customer_email}</div>
        <div class="text-xs">Status: ${o.status}</div>
        ${agentInfo}
      </div>`;
    });
  }
  document.getElementById('list').innerHTML = html;
}

function showTab(t){
  tab=t;
  ['btnP','btnV','btnS','btnA','btnO'].forEach(id=>document.getElementById(id).className = 'flex-1 p-3 font-bold text-gray-400');
  document.getElementById('btn'+t[0].toUpperCase()+t.slice(1)).className = 'flex-1 p-3 font-bold text-green-600 border-b-2 border-green-600';
  render();
}

async function updateStatus(email, status){
  let action = status? 'Approve' : 'Suspend';
  if(!confirm(`${action} this account?`)) return;
  await supabaseClient.from('users').update({is_approved: status}).eq('email',email);
  alert(`Account ${action}d!`);
  load();
}

load();
</script>
</body>
</html>
