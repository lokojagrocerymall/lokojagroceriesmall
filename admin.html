<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Lokoja Grocery Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#f3f4f6;font-family:system-ui}</style>
</head>
<body>
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0 z-10">
  <b>Admin Dashboard - Lokoja Grocery Mall</b>
  <div class="flex gap-2">
    <button onclick="location.href='index.html'" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm font-bold">Store</button>
    <button onclick="logout()" class="bg-gray-100 px-3 py-1.5 rounded-full text-sm">Logout</button>
  </div>
</header>

<div class="p-4 max-w-5xl mx-auto">
  <!-- STATS -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white p-4 rounded-2xl shadow"><div class="text-xs text-gray-400">Total Vendors</div><div class="text-2xl font-black" id="totalV">0</div><div class="text-xs text-green-600" id="statV">0 Approved • 0 Pending</div></div>
    <div class="bg-white p-4 rounded-2xl shadow"><div class="text-xs text-gray-400">Total Sales (Products)</div><div class="text-2xl font-black" id="totalSales">₦0</div><div class="text-xs text-gray-400">0 orders</div></div>
    <div class="bg-white p-4 rounded-2xl shadow border-2 border-green-100"><div class="text-xs text-gray-400">Total Income (Your Cut)</div><div class="text-2xl font-black text-green-600" id="totalIncome">₦0</div><div class="text-[11px] text-green-700">Your Earnings</div></div>
    <div class="bg-white p-4 rounded-2xl shadow"><div class="text-xs text-gray-400">Customers</div><div class="text-2xl font-black" id="totalCust">0</div><div class="text-xs text-gray-400">Unique buyers</div></div>
  </div>

  <div class="bg-white p-4 rounded-2xl shadow mb-4">
    <h3 class="font-black text-sm mb-2">📈 Daily Sales Last 7 Days</h3>
    <div id="chart" class="text-xs text-gray-400">Sales chart will appear after orders</div>
  </div>

  <div class="bg-white rounded-2xl shadow overflow-hidden">
    <div class="flex gap-4 p-4 border-b text-sm font-bold overflow-x-auto">
      <button onclick="showTab('vendors')" id="tabV" class="text-green-600 border-b-2 border-green-600 pb-1">Vendors (<span id="cV">0</span>)</button>
      <button onclick="showTab('pending')" id="tabP" class="text-gray-400">Pending (<span id="cP">0</span>)</button>
      <button onclick="showTab('customers')" id="tabC" class="text-gray-400">Customers</button>
      <button onclick="showTab('delivery')" id="tabD" class="text-gray-400">Delivery Agents</button>
    </div>
    <div id="list" class="p-4 text-sm">Loading...</div>
  </div>
</div>

<script>
// NEW LGM-PRODUCTION KEYS - FIXED
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers=[];
let curTab='vendors';

let curUser = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!curUser.email || curUser.role!=='admin'){ location.href='login.html'; }

async function loadAll(){
  const { data, error } = await supabaseClient.from('users').select('*').order('created_at',{ascending:false});
  if(error){ document.getElementById('list').innerText='Error: '+error.message; return; }
  allUsers=data||[];

  let vendors = allUsers.filter(u=>u.role==='vendor');
  let pending = vendors.filter(v=>v.is_approved===false);
  let approved = vendors.filter(v=>v.is_approved!==false);
  let customers = allUsers.filter(u=>u.role==='customer');
  let delivery = allUsers.filter(u=>u.role==='delivery');

  document.getElementById('totalV').innerText=vendors.length;
  document.getElementById('statV').innerText=approved.length+' Approved • '+pending.length+' Pending';
  document.getElementById('totalCust').innerText=customers.length;
  document.getElementById('cV').innerText=vendors.length;
  document.getElementById('cP').innerText=pending.length;

  render();
}

function render(){
  let list=[];
  if(curTab==='vendors') list = allUsers.filter(u=>u.role==='vendor');
  if(curTab==='pending') list = allUsers.filter(u=>u.role==='vendor' && u.is_approved===false);
  if(curTab==='customers') list = allUsers.filter(u=>u.role==='customer');
  if(curTab==='delivery') list = allUsers.filter(u=>u.role==='delivery');

  if(list.length===0){ document.getElementById('list').innerHTML='<div class="text-center text-gray-400 py-8">No '+curTab+' yet</div>'; return; }

  let html='';
  list.forEach(u=>{
    html+=`<div class="border rounded-xl p-3 mb-3 flex justify-between items-center">
      <div>
        <div class="font-bold">${u.full_name||u.name||'No name'} <span class="text-xs ${u.is_approved===false?'text-orange-500':'text-green-600'}">${u.is_approved===false?'(Pending)':'(Approved)'}</span></div>
        <div class="text-xs text-gray-500">${u.email} • ${u.phone||''} • ${u.location||''}<br>Shop: ${u.shop_address||'N/A'}</div>
      </div>
      <div class="flex gap-2">
        ${u.is_approved===false?`<button onclick="approve('${u.id}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">Approve</button>`:''}
        <button onclick="removeUser('${u.id}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs">Delete</button>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
}

function showTab(t){
  curTab=t;
  document.querySelectorAll('[id^=tab]').forEach(b=>{b.classList.remove('text-green-600','border-b-2','border-green-600'); b.classList.add('text-gray-400')});
  let map={vendors:'tabV',pending:'tabP',customers:'tabC',delivery:'tabD'};
  let el=document.getElementById(map[t]); if(el){el.classList.add('text-green-600','border-b-2','border-green-600'); el.classList.remove('text-gray-400')}
  render();
}

async function approve(id){
  const { error } = await supabaseClient.from('users').update({is_approved:true}).eq('id',id);
  if(error) alert(error.message); else { alert('Approved!'); loadAll(); }
}
async function removeUser(id){
  if(!confirm('Delete user?')) return;
  await supabaseClient.from('users').delete().eq('id',id);
  loadAll();
}
function logout(){ localStorage.removeItem('lgm_user'); location.href='login.html'; }

loadAll();
</script>
</body>
</html>
