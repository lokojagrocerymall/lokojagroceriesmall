<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Debug</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-4xl mx-auto bg-white p-4 rounded-xl shadow">
  <h1 class="font-bold text-xl mb-3">Admin Debug</h1>
  <div id="status" class="bg-yellow-100 p-3 rounded text-xs">Starting...</div>
  <pre id="data" class="bg-gray-900 text-green-400 p-3 rounded mt-3 text-[10px] overflow-x-auto"></pre>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function test(){
  try{
    document.getElementById('status').innerText = '1. Connecting to Supabase...';
    
    const {data:u, error:uErr} = await supabaseClient.from('users').select('*');
    if(uErr) throw uErr;
    document.getElementById('status').innerText = `2. Got ${u.length} users`;
    
    const {data:o, error:oErr} = await supabaseClient.from('orders').select('*');
    if(oErr) throw oErr;
    document.getElementById('status').innerText = `3. Got ${o.length} orders. Done!`;

    document.getElementById('data').innerText = 
      "USERS:\n" + JSON.stringify(u,null,2) + 
      "\n\nORDERS:\n" + JSON.stringify(o,null,2);

  }catch(e){
    document.getElementById('status').innerText = 'ERROR: ' + e.message;
    document.getElementById('status').className = 'bg-red-200 p-3 rounded text-xs';
  }
}
test();
</script>
</body>
</html>
