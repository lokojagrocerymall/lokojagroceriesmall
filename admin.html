<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Lokoja Grocery Mall</title>
<style>
  body { background:#f5f5f5; padding:20px; font-family:sans-serif; }
 .container { max-width:800px; margin:0 auto; background:#fff; padding:25px; border-radius:12px; }
 .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-bottom:20px; }
 .stat-card { background:#f9fafb; padding:20px; border-radius:10px; }
 .stat-card h3 { color:#6b7280; font-size:14px; }
 .stat-card p { font-size:28px; font-weight:700; margin-top:5px; }
 .vendor-card { border:1px solid #e5e7eb; padding:15px; border-radius:10px; margin-bottom:10px; }
 .btn-approve { background:#16a34a; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; }
 .btn-reject { background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; }
 .tabs { display:flex; gap:20px; border-bottom:2px solid #e5e7eb; margin-bottom:20px; }
 .tab { padding:10px; cursor:pointer; font-weight:600; }
 .tab.active { border-bottom:2px solid #16a34a; color:#16a34a; }
</style>
</head>
<body>

<div class="container">
  <h2>Admin Dashboard - Lokoja Grocery Mall</h2>
  
  <div class="stats">
    <div class="stat-card">
      <h3>Total Vendors</h3>
      <p id="totalVendors">0</p>
    </div>
    <div class="stat-card">
      <h3>Approved</h3>
      <p id="approvedVendors">0</p>
    </div>
    <div class="stat-card">
      <h3>Revenue</h3>
      <p>₦0</p>
    </div>
  </div>
  
  <div class="tabs">
    <div class="tab active" onclick="showTab('pending')">Pending Approvals</div>
    <div class="tab" onclick="showTab('all')">All Vendors</div>
  </div>
  
  <div id="pendingTab">
    <h3>Pending Vendors</h3>
    <div id="pendingList"></div>
  </div>
  
  <div id="allTab" style="display:none;">
    <h3>All Vendors</h3>
    <div id="allList"></div>
  </div>
</div>

<script>
function loadData() {
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  let vendors = allUsers.filter(u => u.role === 'Vendor');
  
  document.getElementById('totalVendors').innerText = vendors.length;
  document.getElementById('approvedVendors').innerText = vendors.filter(v => v.status === 'approved').length;
  
  let pendingHTML = '';
  let allHTML = '';
  
  vendors.forEach(vendor => {
    let card = `
      <div class="vendor-card">
        <h4>${vendor.name}</h4>
        <p style="color:#6b7280; font-size:14px;">${vendor.email} | ${vendor.phone}</p>
        <p style="color:#6b7280; font-size:12px;">Applied: ${new Date(vendor.id).toLocaleDateString()}</p>
        ${vendor.status === 'pending'? `
          <button class="btn-approve" onclick="approveVendor(${vendor.id})">Approve</button>
          <button class="btn-reject" onclick="rejectVendor(${vendor.id})">Reject</button>
        ` : `
          <span style="color:#16a34a; font-weight:700;">Status: ${vendor.status.toUpperCase()}</span>
        `}
      </div>
    `;
    
    allHTML += card;
    if(vendor.status === 'pending') pendingHTML += card;
  });
  
  document.getElementById('pendingList').innerHTML = pendingHTML || '<p>No pending vendors</p>';
  document.getElementById('allList').innerHTML = allHTML || '<p>No vendors yet</p>';
}

function approveVendor(id) {
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  let userIndex = allUsers.findIndex(u => u.id === id);
  
  if(userIndex!== -1) {
    allUsers[userIndex].status = 'approved';
    allUsers[userIndex].flutterwaveSubaccount = 'RS_' + Math.random().toString(36).substr(2, 9).toUpperCase();
    localStorage.setItem('allUsers', JSON.stringify(allUsers));
    alert(`✅ ${allUsers[userIndex].name} Approved!\nFlutterwave Subaccount: ${allUsers[userIndex].flutterwaveSubaccount}`);
    loadData(); // Refresh the page
  }
}

function rejectVendor(id) {
  let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
  let userIndex = allUsers.findIndex(u => u.id === id);
  
  if(userIndex!== -1) {
    allUsers[userIndex].status = 'rejected';
    localStorage.setItem('allUsers', JSON.stringify(allUsers));
    alert('Vendor Rejected');
    loadData(); // Refresh the page
  }
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  if(tab === 'pending') {
    document.getElementById('pendingTab').style.display = 'block';
    document.getElementById('allTab').style.display = 'none';
  } else {
    document.getElementById('pendingTab').style.display = 'none';
    document.getElementById('allTab').style.display = 'block';
  }
}

loadData();
</script>
</body>
</html>
