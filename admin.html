<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - LGM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">LGM</div>
    <span>Admin Dashboard</span>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom:20px">Pending Approvals</h2>

  <!-- VENDOR SIGNUP FORM -->
  <div style="max-width:600px; margin:20px auto; padding:20px; background:white; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="color:green; text-align:center;">Vendor Registration</h2>
    <form id="vendorForm">
      <input type="text" id="storeName" placeholder="Store Name" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;"><br>
      <input type="text" id="ownerName" placeholder="Owner Name" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;"><br>
      <input type="email" id="email" placeholder="Email" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;"><br>
      <input type="password" id="password" placeholder="Password" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;"><br>
      <input type="tel" id="phone" placeholder="Phone Number" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;"><br>
      <button type="submit" style="width:100%; padding:12px; background:green; color:white; border:none; border-radius:5px; font-weight:bold;">Create Account</button>
    </form>
    <p id="message" style="text-align:center; margin-top:10px; font-weight:bold;"></p>
  </div>
  <hr style="margin:30px 0;">

  <!-- PENDING DELIVERY AGENTS -->
  <div class="form-card">
  <h3>Pending Vendors</h3>
  <div id="pendingVendorList">Loading vendors...</div>
</div>

  <!-- PENDING VENDORS -->
  <div class="form-card">
    <h3>Pending Vendors</h3>
    <p style="font-size:13px;color:#666">Vendor list will appear here</p>
  </div>

</main>

<footer class="app-footer">© 2026 Lokoja Grocery Mall Admin</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, addDoc, getDocs, query, where, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyChrVZh6NUm7N5W7FMXnxztmU7NXRYrVa0",
    authDomain: "lokoja-grocery-mall.firebaseapp.com",
    projectId: "lokoja-grocery-mall",
    storageBucket: "lokoja-grocery-mall.firebasestorage.app",
    messagingSenderId: "642467126038",
    appId: "1:642467126038:web:420d7c0e33119b7fa24e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // SAMPLE DATA
  const pendingAgents = [
    {id:1, name:"Ahmad Musa", phone:"08031234567", driverrider:"yes", nin:"12345678901", status:"pending"},
    {id:2, name:"John Doe", phone:"08099887766", driverrider:"no", nin:"98765432109", status:"pending"},
    {id:3, name:"Fatima Bello", phone:"08123456789", driverrider:"yes", nin:"11223344556", status:"pending"}
  ];

  function renderAgents(){
    const list = document.getElementById('pendingDeliveryList');
    list.innerHTML = '';
    pendingAgents.forEach(agent => {
      const isRejected = agent.driverrider === 'no';
      const cardColor = isRejected ? '#fee2e2' : '#f0fdf4';
      const borderColor = isRejected ? '#ef4444' : '#16a34a';
      list.innerHTML += `
        <div style="background:${cardColor};border:2px solid ${borderColor};border-radius:12px;padding:15px;margin-bottom:12px">
          <h4>${agent.name}</h4>
          <p>Phone: ${agent.phone}</p>
          ${isRejected ? `<button disabled>Rejected</button>` : `<button onclick="approveAgent(${agent.id})">Approve</button>`}
        </div>
      `;
    });
  }

  window.approveAgent = function(id){
    alert('Agent ' + id + ' Approved!');
  }

  renderAgents();

  // VENDOR FORM
  const form = document.getElementById('vendorForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // STOPS WIPE

    const storeName = document.getElementById('storeName').value;
    const ownerName = document.getElementById('ownerName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const phone = document.getElementById('phone').value;
    const messageEl = document.getElementById('message');

    try {
      messageEl.innerHTML = "Creating account...";
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      
      await setDoc(doc(db, "vendors", userCred.user.uid), {
        uid: userCred.user.uid,
        storeName, ownerName, email, phone,
        status: "pending",
        createdAt: serverTimestamp()
      });

      messageEl.innerHTML = "✅ Account created! Waiting for admin approval";
      messageEl.style.color = "green";
      form.reset();
    } catch(err) {
      messageEl.innerHTML = "❌ Error: " + err.message;
      messageEl.style.color = "red";
    }
  });
  // LOAD PENDING VENDORS
async function loadPendingVendors(){
  const list = document.getElementById('pendingVendorList');
  if(!list) return;
  list.innerHTML = "Loading...";
  
  const q = query(collection(db, "vendors"), where("status", "==", "pending"));
  const querySnapshot = await getDocs(q);
  
  if(querySnapshot.empty){
    list.innerHTML = "<p>No pending vendors</p>";
    return;
  }
  
  list.innerHTML = '';
  querySnapshot.forEach((docSnap) => {
    const v = docSnap.data();
    list.innerHTML += `
      <div style="background:#f0fdf4;border:2px solid #16a34a;border-radius:12px;padding:15px;margin-bottom:12px">
        <h4>${v.storeName}</h4>
        <p>Owner: ${v.ownerName}</p>
        <p>Email: ${v.email}</p>
        <p>Phone: ${v.phone}</p>
        <button onclick="approveVendor('${docSnap.id}')" style="padding:8px 12px;background:#16a34a;color:white;border:none;border-radius:8px;cursor:pointer">Approve</button>
      </div>
    `;
  });
}

window.approveVendor = async (id) => {
  await updateDoc(doc(db, "vendors", id), { status: "approved" });
  alert("Vendor Approved!");
  loadPendingVendors();
}

// RUN IT WHEN PAGE LOADS
loadPendingVendors();
</script>

</body>
</html>
