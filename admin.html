<!DOCTYPE html>
<html>
<head>
<title>Admin - Lokoja Grocery Mall</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 5px #ccc}
input{padding:10px;width:95%;margin:5px 0;border:1px solid #ddd;border-radius:5px}
button{background:#4CAF50;color:white;border:0;padding:12px 20px;border-radius:5px;cursor:pointer;font-weight:bold}
.product-item{border-bottom:1px solid #eee;padding:10px 0}
</style>
</head>
<body>
<h1>👑 Admin Dashboard</h1>

<div class="card">
<h2>Add New Product</h2>
<input id="pName" placeholder="Product Name e.g Rice 5kg">
<input id="pPrice" placeholder="Price e.g 12000" type="number">
<input id="pImg" placeholder="Image URL from internet">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="card">
<h2>All Products</h2>
<div id="productList">No products yet. Add one above.</div>
</div>

<script>
function addProduct(){
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const img = document.getElementById('pImg').value;
  if(!name || !price){alert('Name and Price required'); return;}
  
  let products = JSON.parse(localStorage.getItem('products') || '[]');
  products.push({name, price, img});
  localStorage.setItem('products', JSON.stringify(products));
  alert('Product Added!');
  document.getElementById('pName').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pImg').value = '';
  loadProducts();
}

function loadProducts(){
  let products = JSON.parse(localStorage.getItem('products') || '[]');
  if(products.length === 0){
    document.getElementById('productList').innerHTML = 'No products yet. Add one above.';
    return;
  }
  document.getElementById('productList').innerHTML = products.map((p,i) => 
    `<div class="product-item"><b>${p.name}</b> - ₦${p.price}</div>`
  ).join('');
}
loadProducts();
</script>
</body>
</html>
