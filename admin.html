<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Lokoja Grocery Mall</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background:#f5f5f5; }
  .container { max-width:1200px; margin:20px auto; padding:20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:20px; }
  .stat-card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .stat-card h4 { color:#6b7280; font-size:13px; }
  .stat-card h2 { color:#111; font-size:24px; margin-top:5px; }
  .tabs { display:flex; gap:10px; margin-bottom:20px; border-bottom:2px solid #e5e7eb; }
  .tab { padding:12px 20px; background:none; border:none; border-bottom:3px solid transparent; font-weight:700; cursor:pointer; }
  .tab.active { border-bottom:3px solid #16a34a; color:#16a34a; }
  .vendor-card { background:#fff; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .btn-approve { background:#16a34a; color:#fff; border:none; padding:8px 15px; border-radius:8px; font-weight:700; cursor:pointer; }
  .btn-reject { background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:8px; font-weight:700; cursor:pointer; }
  .loading { opacity:0.6; pointer-events:none; }
</style>
</head>
<body>

<!-- HEADER -->
<header style="background:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); height:65px;">
  <div style="background:#16a34a; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;">
    <img src="./logo.png" alt="LGM" style="width:36px; height:36px; object-fit:contain;">
  </div>
  <span style="color:#111; font-size:18px; font-weight:900;">Lokoja Grocery Mall Admin</span>
</header>

<div class="container">
  <h2 style="margin-bottom:15px;">Dashboard Overview</h2>
  
  <div class="stats">
    <div class="stat-card"><h4>Total Vendors</h4><h2 id="totalVendors">0</h2></div>
    <div class="stat-card"><h4>Pending</h4><h2 id="pendingCount">0</h2></div>
    <div class="stat-card"><h4>Approved</h4><h2 id="approvedCount">0</h2></div>
    <div class="stat-card"><h4>Revenue</h4><h2>₦0</h2></div>
  </div>
  
  <div class="tabs">
    <button class="tab active" onclick="showTab('pending')">Pending Approvals</button>
    <button class="tab" onclick="showTab('vendors')">All Vendors</button>
  </div>
  
  <div id="pendingTab">
    <h3>Pending Vendors</h3>
    <div id="pendingList">Loading...</div>
  </div>
</div>

<!-- FOOTER -->
<footer style="background:#111827; color:#fff; padding:20px; text-align:center; margin-top:50px;">
  © 2026 Lokoja Grocery Mall Admin
</footer>

<script>
let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];

function loadStats() {
  const vendors = allUsers.filter(u => u.role === 'Vendor');
  const pending = vendors.filter(u => u.status === 'pending');
  const approved = vendors.filter(u => u.status === 'approved');
  document.getElementById('totalVendors').innerText = vendors.length;
  document.getElementById('pendingCount').innerText = pending.length;
  document.getElementById('approvedCount').innerText = approved.length;
}

function loadPending() {
  const pending = allUsers.filter(u => u.role === 'Vendor' && u.status === 'pending');
  
  if(pending.length === 0) {
    document.getElementById('pendingList').innerHTML = '<p style="color:#6b7280;">No pending vendors</p>';
    return;
  }
  
  document.getElementById('pendingList').innerHTML = pending.map(v => `
    <div class="vendor-card" id="vendor-${v.id}">
      <div>
        <h4>${v.name}</h4>
        <p style="color:#6b7280; font-size:13px;">${v.email} | ${v.phone}</p>
        <p style="color:#6b7280; font-size:12px;">Applied: ${new Date(v.id).toLocaleDateString()}</p>
      </div>
      <div>
        <button class="btn-approve" onclick="approveVendor('${v.id}', this)">Approve</button>
        <button class="btn-reject" onclick="rejectVendor('${v.id}')">Reject</button>
      </div>
    </div>
  `).join('');
}

async function approveVendor(id, btn) {
  btn.innerText = 'Approving...';
  btn.parentElement.parentElement.classList.add('loading');
  
  let users = JSON.parse(localStorage.getItem('allUsers'));
  const vendor = users.find(u => u.id == id);
  
  // 1. CALL FLUTTERWAVE TO CREATE SUBACCOUNT
  try {
    const subaccount = await createFlutterwaveSubaccount(vendor);
    
    // 2. UPDATE VENDOR STATUS
    users = users.map(u => u.id == id ? {...u, status: 'approved', subaccount_id: subaccount.id} : u);
    localStorage.setItem('allUsers', JSON.stringify(users));
    
    alert(`✅ ${vendor.name} Approved!\nFlutterwave Subaccount: ${subaccount.id}`);
    
  } catch(e) {
    alert('Error: ' + e.message);
  }
  
  loadStats();
  loadPending();
}

function rejectVendor(id) {
  if(!confirm('Reject this vendor?')) return;
  let users = JSON.parse(localStorage.getItem('allUsers'));
  users = users.filter(u => u.id != id);
  localStorage.setItem('allUsers', JSON.stringify(users));
  alert('Vendor Rejected');
  loadStats();
  loadPending();
}

      split_type: "percentage",
      split_value: 10 // Your 10% commission
    })
  });
  const data = await res.json();
  return data.data;

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

loadStats();
loadPending();
</script>
</body>
</html>
