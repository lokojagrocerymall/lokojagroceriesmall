<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Lokoja Grocery Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f3f4f6;font-family:system-ui}
.tab-btn{white-space:nowrap}
@keyframes pulse {0%, 100% {opacity: 1;} 50% {opacity:.5;}}
.animate-pulse {animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;}
</style>
</head>
<body>
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0 z-10">
  <b class="text-green-700">Admin Dashboard - Lokoja Grocery Mall</b>
  <div class="flex gap-2">
    <button onclick="location.href='/'" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm font-bold">Store</button>
    <button onclick="localStorage.removeItem('lgm_user'); location.href='index.html';" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
  </div>
</header>

<div class="p-4 max-w-6xl mx-auto">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <div onclick="showTab('new')" class="bg-white p-4 rounded-2xl shadow cursor-pointer border-2 border-red-200 hover:bg-red-50 transition active:scale-95">
      <div class="text-xs text-red-500 font-bold flex items-center gap-1">🔔 New Orders</div>
      <div class="text-2xl font-black text-red-600" id="newOrderCount">0</div>
      <div class="text-xs text-red-700">Tap to view</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow">
      <div class="text-xs text-gray-400">Gross Sales</div>
      <div class="text-2xl font-black" id="totalSales">₦0</div>
      <div class="text-xs text-gray-400" id="orderCount">0 orders</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow border-2 border-green-100">
      <div class="text-xs text-gray-400">Platform Income</div>
      <div class="text-2xl font-black text-green-600" id="totalIncome">₦0</div>
      <div class="text-[11px] text-green-700" id="incomeBreak">₦0 commission + ₦0 delivery</div>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow">
      <div class="text-xs text-gray-400">Customers</div>
      <div class="text-2xl font-black" id="totalCust">0</div>
      <div class="text-xs text-gray-400">Unique buyers</div>
    </div>
  </div>

  <div class="bg-white p-4 rounded-2xl shadow mb-4">
    <h3 class="font-black text-sm mb-2">📈 Daily Sales Last 7 Days</h3>
    <div id="chart" class="text-xs text-gray-400">Sales chart will appear after orders</div>
  </div>

  <div class="bg-white rounded-2xl shadow overflow-hidden">
    <div class="flex gap-4 p-4 border-b text-sm font-bold overflow-x-auto">
      <button onclick="showTab('new')" id="tabN" class="tab-btn text-gray-400">🔔 New Orders (<span id="cN">0</span>)</button>
      <button onclick="showTab('active')" id="tabA" class="tab-btn text-gray-400">🚚 Active (<span id="cA">0</span>)</button>
      <button onclick="showTab('orders')" id="tabO" class="tab-btn text-gray-400">All Orders (<span id="cO">0</span>)</button>
      <button onclick="showTab('vendors')" id="tabV" class="tab-btn text-gray-400">Vendors (<span id="cV">0</span>)</button>
      <button onclick="showTab('pending')" id="tabP" class="tab-btn text-gray-400">Pending (<span id="cP">0</span>)</button>
      <button onclick="showTab('customers')" id="tabC" class="tab-btn text-gray-400">Customers</button>
      <button onclick="showTab('delivery')" id="tabD" class="tab-btn text-gray-400">Delivery Agents (<span id="cD">0</span>)</button>
    </div>
    <div id="list" class="p-4 text-sm">Loading...</div>
  </div>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers=[]; let allOrders=[]; let curTab='pending'; let countdownInterval;
let curUser = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!curUser.email || curUser.role!=='admin'){ location.href='login.html'; }

const THREE_HOURS_MS = 3 * 60 * 60 * 1000;

async function loadAll(){
  const { data:users, error: e1 } = await supabaseClient.from('users').select('*').order('created_at',{ascending:false});
  if(e1){ document.getElementById('list').innerHTML = `<div class="text-red-500">DB Error Users: ${e1.message}</div>`; return; }
  allUsers=users||[];

  const { data:orders, error: e2 } = await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  if(e2){ document.getElementById('list').innerHTML = `<div class="text-red-500">DB Error Orders: ${e2.message}</div>`; return; }
  allOrders=orders||[];

  let vendors = allUsers.filter(u=>u.role==='vendor');
  let pending = vendors.filter(v=>v.is_approved===false || v.is_approved===null); // FIXED
  let delivery = allUsers.filter(u=>u.role==='delivery' || u.role==='agent');
  let deliveryPending = delivery.filter(d=>d.is_approved===false || d.is_approved===null); // FIXED
  let newOrders = allOrders.filter(o=>o.status==='paid');
  let activeOrders = allOrders.filter(o=>o.status==='on the way' || o.status==='processing');

  document.getElementById('newOrderCount').innerText = newOrders.length;
  if(newOrders.length > 0) document.getElementById('newOrderCount').classList.add('animate-pulse'); else document.getElementById('newOrderCount').classList.remove('animate-pulse');

  document.getElementById('cN').innerText=newOrders.length;
  document.getElementById('cA').innerText=activeOrders.length;
  document.getElementById('cV').innerText=vendors.length;
  document.getElementById('cP').innerText=pending.length + deliveryPending.length;
  document.getElementById('cO').innerText=allOrders.length;
  document.getElementById('cD').innerText=delivery.length;
  document.getElementById('totalCust').innerText=[...new Set(allOrders.map(o=>o.customer_email).filter(Boolean))].length;
  document.getElementById('orderCount').innerText=allOrders.length+' orders';

  let grossSales = allOrders.reduce((s,o)=> s + Number(o.total||0), 0);
  let totalDelivery = allOrders.reduce((s,o)=> s + Number(o.delivery_fee||0), 0);
  let productTotal = grossSales - totalDelivery;
  let commission = productTotal * 0.1;
  let platformIncome = commission + totalDelivery;
  document.getElementById('totalSales').innerText='₦'+Math.round(grossSales).toLocaleString();
  document.getElementById('totalIncome').innerText='₦'+Math.round(platformIncome).toLocaleString();
  document.getElementById('incomeBreak').innerText=`₦${Math.round(commission).toLocaleString()} commission + ₦${Math.round(totalDelivery).toLocaleString()} delivery`;
  render(); renderChart(); startAllTimers();
}

function formatAdminCountdown(startTime){
  if(!startTime) return '';
  const end = new Date(startTime).getTime() + THREE_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return `⏰ Time up! Auto-failing...`;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const pickedUpTime = new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
  return `⏰ Auto-fail in: ${h}h ${m}m ${s}s <span class="text-gray-400">(Picked up: ${pickedUpTime})</span>`;
}

function render(){
  let list=[];
  if(curTab==='new') list = allOrders.filter(o=>o.status==='paid');
  if(curTab==='active') list = allOrders.filter(o=>o.status==='on the way' || o.status==='processing');
  if(curTab==='vendors') list = allUsers.filter(u=>u.role==='vendor');
  if(curTab==='pending') list = [...allUsers.filter(u=>u.role==='vendor' && (u.is_approved===false || u.is_approved===null)),...allUsers.filter(u=>u.role==='delivery' && (u.is_approved===false || u.is_approved===null))]; // FIXED
  if(curTab==='customers') list = allUsers.filter(u=>u.role==='customer');
  if(curTab==='delivery') list = allUsers.filter(u=>u.role==='delivery' || u.role==='agent');
  if(curTab==='orders') list = allOrders;

  if(list.length===0){ document.getElementById('list').innerHTML='<div class="text-center text-gray-400 py-8">No '+curTab+' yet</div>'; return; }

  let html='';
  if(curTab==='new' || curTab==='active' || curTab==='orders'){
    list.forEach(o=>{
      let deliveryFee = Math.round(Number(o.total||0) * 0.05);
      let productTotal = Number(o.total||0) - deliveryFee;
      let vendorEarn = productTotal * 0.9;
      let platform = productTotal * 0.1 + deliveryFee;
      let status = o.status||'paid';
      let statusColor = status==='delivered'? 'text-green-600' : status==='on the way'? 'text-orange-500' : status==='failed_delivery'? 'text-red-600' : status==='paid'? 'text-red-600' : 'text-blue-600';
      let countdown = '';
      if(status === 'on the way' && o.delivery_started_at){ countdown = `<div id="timer-${o.id}" class="text-xs mt-1 font-bold text-orange-600">${formatAdminCountdown(o.delivery_started_at)}</div>`; }

      let border = status==='paid'? 'border-red-300 bg-red-50' : status==='on the way'? 'border-orange-300 bg-orange-50' : 'border-gray-200';

      let vendor = allUsers.find(u => u.email === o.vendor_email);
      let vendorName = vendor? (vendor.full_name || vendor.name || o.vendor_email) : 'Not assigned yet';
      let vendorPhone = vendor? (vendor.phone || 'N/A') : ''; // FIXED to phone

      let deliveryAgent = allUsers.find(u => u.email === o.delivery_agent_email);
      let agentName = deliveryAgent? (deliveryAgent.full_name || deliveryAgent.name || 'Waiting for rider') : 'Waiting for rider';
      let agentPhone = deliveryAgent? (deliveryAgent.phone || 'N/A') : 'N/A'; // FIXED to phone

      html+=`<div class="border-2 ${border} rounded-xl p-3 mb-3">
        <div class="flex justify-between items-center mb-2">
          <div class="font-bold text-base">Order #${o.id}</div>
          <div class="font-bold ${statusColor} capitalize">${status.replace('_',' ')}</div>
        </div>
        <div class="bg-white p-2 rounded-lg mb-2 border-gray-100">
          <div class="font-bold text-sm">👤 ${o.customer_name || 'No Name'}</div>
          <div class="text-xs text-gray-600">📧 ${o.customer_email}</div>
          <div class="text-xs text-gray-600">📱 ${o.customer_phone || 'N/A'}</div>
          <div class="text-xs text-gray-600 mt-1">📍 ${o.customer_location || ''}</div>
          <div class="text-xs text-gray-600">🏠 ${o.customer_address || 'No Address'}</div>
          ${o.customer_landmark? `<div class="text-xs text-gray-500">📍 Landmark: ${o.customer_landmark}</div>` : ''}
        </div>
        <div class="bg-green-50 p-2 rounded-lg mb-2 border-green-200">
          <div class="text-xs font-bold text-green-800">🏪 Vendor</div>
          <div class="text-xs text-green-700">Name: ${vendorName}</div>
          <div class="text-xs text-green-700">📧 ${o.vendor_email || 'Not assigned yet'}</div>
          ${vendorPhone? `<div class="text-xs text-green-700">📱 ${vendorPhone}</div>` : ''}
        </div>
        <div class="bg-blue-50 p-2 rounded-lg mb-2 border-blue-200">
          <div class="text-xs font-bold text-blue-800">🚚 Delivery Agent</div>
          <div class="text-xs text-blue-700">Name: ${agentName}</div>
          <div class="text-xs text-blue-700">📧 ${o.delivery_agent_email || 'N/A'}</div>
          <div class="text-xs text-blue-700">📱 ${agentPhone}</div>
        </div>
        <div class="text-xs">💰 Total: <b>₦${Number(o.total||0).toLocaleString()}</b></div>
        <div class="text-xs">Product: ₦${Math.round(productTotal).toLocaleString()} | Delivery 5%: ₦${Math.round(deliveryFee).toLocaleString()}</div>
        <div class="text-xs">Vendor 90%: ₦${Math.round(vendorEarn).toLocaleString()} | You: ₦${Math.round(platform).toLocaleString()}</div>
        <div class="text-[10px] text-gray-400 mt-1">Ordered: ${new Date(o.created_at).toLocaleString()}</div>
        ${countdown}
      </div>`;
    });
  } else if(curTab==='delivery'){
    list.forEach(u=>{
      let isPending = u.is_approved===false || u.is_approved===null;
      let statusColor = isPending? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800';
      let borderColor = isPending? 'border-yellow-400' : 'border-green-400';
      html+=`<div class="border-2 ${borderColor} rounded-xl p-3 mb-3">
        <div class="font-bold text-base">${u.full_name||u.email} <span class="px-2 py-0.5 text-xs rounded-full ${statusColor}">${isPending?'pending':'approved'}</span></div>
        <div class="text-xs text-gray-500">${u.email} • ${u.phone||''}</div> <!-- FIXED to phone -->
        <div class="flex gap-2 mt-3">
          ${isPending?`<button onclick="approveDelivery('${u.email}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">Approve</button>`:''}
          <button onclick="removeUser('${u.email}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs">Delete</button>
        </div>
      </div>`;
    });
  } else {
    list.forEach(u=>{
      let isPending = u.is_approved===false || u.is_approved===null;
      html+=`<div class="border rounded-xl p-3 mb-3 flex justify-between items-center">
        <div>
          <div class="font-bold">${u.full_name||u.email}
            <span class="text-xs ${isPending?'text-orange-500':'text-green-600'}">${u.role==='vendor'? (isPending?'(Pending)':'(Approved)') : ''}</span>
          </div>
          <div class="text-xs text-gray-500">${u.email} • ${u.phone||''} • ${u.location||''}</div> <!-- FIXED to phone -->
        </div>
        <div class="flex gap-2">
          ${curTab==='pending' && isPending?`<button onclick="approve('${u.email}')" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">Approve</button>`:''}
          ${curTab==='vendors' && u.role==='vendor'?`<button onclick="location.href='vendor-orders.html?email=${u.email}'" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold">Orders</button>`:''}
          <button onclick="removeUser('${u.email}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs">Delete</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('list').innerHTML=html;
}

function startAllTimers(){
  clearInterval(countdownInterval);
  countdownInterval = setInterval(()=>{
    allOrders.filter(o=>o.status==='on the way' && o.delivery_started_at).forEach(o=>{
      let el = document.getElementById(`timer-${o.id}`);
      if(!el) return;
      let end = new Date(o.delivery_started_at).getTime() + THREE_HOURS_MS;
      let left = end - new Date().getTime();
      if(left <= 0){
        el.innerHTML = '⏰ Time up! Auto-failing...';
        markFailed(o.id);
      }
      else {
        el.innerHTML = formatAdminCountdown(o.delivery_started_at);
      }
    });
  }, 1000);
}

function renderChart(){
  const now=new Date(); let days=[];
  for(let i=6;i>=0;i--){
    let d=new Date(now); d.setDate(d.getDate()-i);
    let dayOrders = allOrders.filter(o=> new Date(o.created_at).toDateString()===d.toDateString());
    let dayGross = dayOrders.reduce((s,o)=> s + Number(o.total||0), 0);
    let dayPlatform = dayOrders.reduce((s,o)=> s + (Number(o.total||0)*0.95)*0.1 + (Number(o.total||0)*0.05), 0);
    days.push(`<div class="flex justify-between py-1 border-b border-gray-100">
      <span>${d.toLocaleDateString('en-NG',{weekday:'short'})}</span>
      <b>Gross: ₦${Math.round(dayGross).toLocaleString()} | You: ₦${Math.round(dayPlatform).toLocaleString()}</b>
    </div>`);
  }
  document.getElementById('chart').innerHTML = days.join('') || 'No sales yet';
}

function showTab(t){
  curTab=t;
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('text-green-600','text-red-600','border-b-2','border-green-600','border-red-600'); b.classList.add('text-gray-400')});
  let map={new:'tabN',active:'tabA',vendors:'tabV',pending:'tabP',orders:'tabO',customers:'tabC',delivery:'tabD'};
  let el=document.getElementById(map[t]);
  if(el){
    if(t==='new') el.classList.add('text-red-600','border-b-2','border-red-600');
    else el.classList.add('text-green-600','border-b-2','border-green-600');
    el.classList.remove('text-gray-400')
  }
  render();
}

async function approve(email){ const { error } = await supabaseClient.from('users').update({is_approved:true}).eq('email',email); if(error) alert(error.message); else { alert('Vendor Approved!'); loadAll(); } }
async function approveDelivery(email){ const { error } = await supabaseClient.from('users').update({is_approved:true}).eq('email',email); if(error) alert(error.message); else { alert('Delivery Agent Approved!'); loadAll(); } } // FIXED }
async function removeUser(email){ if(!confirm('Delete this user?')) return; await supabaseClient.from('users').delete().eq('email',email); loadAll(); }
async function markFailed(id){ const order = allOrders.find(o=>o.id===id); if(order && order.status!== 'failed_delivery' && order.status!== 'delivered'){ await supabaseClient.from('orders').update({status:'failed_delivery'}).eq('id',id); loadAll(); } }
function logout(){ localStorage.removeItem('lgm_user'); location.href='login.html'; }
loadAll(); setInterval(loadAll, 5000);
</script>
</body>
</html>
