<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>DEBUG</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body style="padding:20px; font-family:monospace">
<h2>ADMIN DEBUG</h2>
<div id="out">Running...</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const out = document.getElementById('out');

async function test(){
  out.innerHTML += '1. Testing USERS table...<br>';
  let {data, error} = await supabaseClient.from('users').select('*').limit(1);
  if(error) out.innerHTML += `<span style="color:red">ERROR: ${error.message} | Code: ${error.code}</span><br><br>`;
  else out.innerHTML += `<span style="color:green">SUCCESS: Found ${data.length} users</span><br>`;
  out.innerHTML += `Columns: ${data && data[0] ? Object.keys(data[0]).join(', ') : 'none'}<br><br>`;

  out.innerHTML += '2. Testing ORDERS table...<br>';
  let {data:orders, error:e2} = await supabaseClient.from('orders').select('*').limit(1);
  if(e2) out.innerHTML += `<span style="color:red">ERROR: ${e2.message} | Code: ${e2.code}</span><br>`;
  else out.innerHTML += `<span style="color:green">SUCCESS: Found ${orders.length} orders</span><br>`;
}
test();
</script>
</body>
</html>
