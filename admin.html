      <div class="text-[10px] text-gray-400 mt-1">Income</div>
      <div class="text-[12px] font-bold text-green-600 truncate" id="wIncome">₦0</div>
    </div>
    <div class="bg-white p-2 rounded-xl shadow min-w-0">

      <button onclick="filterOrders('all')" id="fAll" class="px-3 py-1.5 rounded-full bg-green-600 text-white font-bold whitespace-nowrap">All (<span id="fcAll">0</span>)</button>

      <button onclick="filterOrders('onway')" id="fOnway" class="px-3 py-1.5 rounded-full bg-white border font-bold whitespace-nowrap">🚚 On Way (<span id="fcOnway">0</span>)</button>

  </div>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let users=[], orders=[], tab='pending', orderSubTab='all', lastSeenOrderCount=0;
let returnsChart = null;
const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
let curUser = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!curUser.email || curUser.role!=='admin'){ alert('Login as admin first'); location.href='/'; }

function formatAdminCountdown(startTime){
  if(!startTime) return `<div style="background:#fff7ed;border:2px dashed #f97316;padding:8px;border-radius:10px;margin-top:8px;text-align:center;font-weight:900;color:#c2410c;font-size:11px">⏰ Rider picked - timer starting...</div>`;
  const end = new Date(startTime).getTime() + TWO_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return `<div style="background:#fee2e2;border:3px solid #dc2626;color:#dc2626;padding:10px;border-radius:12px;margin-top:8px;text-align:center;font-weight:900;font-size:12px">❌ TIME UP - FAILED</div>`;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const pickedUpTime = new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
  return `<div style="background:linear-gradient(135deg,#ffffff,#fef3c7);border:3px solid #f59e0b;padding:12px;border-radius:14px;margin-top:8px;text-align:center;box-shadow:0 4px 12px rgba(245,158,11,0.25)">
    <div style="font-size:9px;font-weight:900;letter-spacing:1.5px;color:#92400e;background:#fde68a;display:inline-block;padding:2px 8px;border-radius:12px">⏰ DELIVERY COUNTDOWN</div>
    <div style="font-size:26px;font-weight:900;color:#dc2626;margin:4px 0;letter-spacing:1px;line-height:1;animation:timer-pulse 1s infinite">${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</div>
    <div style="font-size:10px;font-weight:800;color:#78350f">Picked at: ${pickedUpTime} • Auto-fail 2hrs</div>
  </div>`;
}

async function load(){
  document.getElementById('list').innerHTML = 'Loading...';
  try{
    const {data:u} = await supabaseClient.from('users').select('*');
    users = u||[];
    const {data:o} = await supabaseClient.from('orders').select('*').in('status',['paid','picked','on the way','delivered','failed']).order('id',{ascending:false}).limit(200);
    orders = o||[];
    orders.sort((a,b)=>{ const priority = {paid:0, picked:1, 'on the way':1, delivered:2, failed:3}; const pa = priority[a.status]?? 4; const pb = priority[b.status]?? 4; if(pa!==pb) return pa - pb; return b.id - a.id; });
    const paidOrders = orders.filter(x=>x.status==='paid');
    if(paidOrders.length > lastSeenOrderCount && lastSeenOrderCount!== 0){ triggerNewOrderAlert(); }
    lastSeenOrderCount = paidOrders.length;
    let vendors = users.filter(x=>String(x.role).toLowerCase().trim()==='vendor');
    let agents = users.filter(x=>String(x.role).toLowerCase().trim()==='delivery_agent');
    let pendingV = vendors.filter(x=>x.is_approved===false || x.is_approved===null);
    let pendingA = agents.filter(x=>x.is_approved===false || x.is_approved===null);
    let suspendedV = vendors.filter(x=>x.is_approved===false);
    let suspendedA = agents.filter(x=>x.is_approved===false);
    let activeV = vendors.filter(x=>x.is_approved===true);
    document.getElementById('cP').innerText = pendingV.length + pendingA.length;
    document.getElementById('cV').innerText = activeV.length;
    document.getElementById('cS').innerText = suspendedV.length + suspendedA.length;
    document.getElementById('cA').innerText = agents.length;
    document.getElementById('cO').innerText = orders.length;
    document.getElementById('pendingCount').innerText = pendingV.length + pendingA.length;
    calcSales(); drawReturnsChart();
    document.getElementById('fcAll').innerText = orders.length;
    document.getElementById('fcPaid').innerText = orders.filter(x=>x.status==='paid').length;
    document.getElementById('fcOnway').innerText = orders.filter(x=>x.status==='picked' || x.status==='on the way').length;
    document.getElementById('fcDel').innerText = orders.filter(x=>x.status==='delivered').length;
    document.getElementById('fcFail').innerText = orders.filter(x=>x.status==='failed').length;
    updateOrdersTabAlert(); render();
    setTimeout(()=>{ const tabsEl = document.getElementById('mainTabs'); if(tabsEl) tabsEl.scrollLeft = tabsEl.scrollWidth; }, 300);
  }catch(e){ document.getElementById('list').innerHTML = `<div class="text-red-500">ERROR: ${e.message}</div>`; }
}

function calcSales(){
  let gross = orders.reduce((s,x)=>s+Number(x.total||0),0);
  document.getElementById('sales').innerText = '₦'+Math.round(gross).toLocaleString();
  document.getElementById('sales').title = '₦'+Math.round(gross).toLocaleString();
  document.getElementById('income').innerText = '₦'+Math.round(gross*0.15).toLocaleString();
  document.getElementById('income').title = '₦'+Math.round(gross*0.15).toLocaleString();
  let now = new Date(); let todayStr = now.toDateString(); let weekAgo = new Date(); weekAgo.setDate(now.getDate()-7); let monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  let d = orders.filter(o=> new Date(o.created_at).toDateString()===todayStr); let w = orders.filter(o=> new Date(o.created_at) >= weekAgo); let m = orders.filter(o=> new Date(o.created_at) >= monthStart);
  let dGross = d.reduce((s,x)=>s+Number(x.total||0),0); let wGross = w.reduce((s,x)=>s+Number(x.total||0),0); let mGross = m.reduce((s,x)=>s+Number(x.total||0),0);
  document.getElementById('dSales').innerText = '₦'+Math.round(dGross).toLocaleString();
  document.getElementById('dIncome').innerText = '₦'+Math.round(dGross*0.15).toLocaleString();
  document.getElementById('wSales').innerText = '₦'+Math.round(wGross).toLocaleString();
  document.getElementById('wIncome').innerText = '₦'+Math.round(wGross*0.15).toLocaleString();
  document.getElementById('mSales').innerText = '₦'+Math.round(mGross).toLocaleString();
  document.getElementById('mIncome').innerText = '₦'+Math.round(mGross*0.15).toLocaleString();
}
function drawReturnsChart(){
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  const now = new Date(); const day = now.getDay(); const diffToMonday = day===0? -6 : 1 - day; const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0,0,0,0);
  let salesPerDay = [0,0,0,0,0,0]; let incomePerDay = [0,0,0,0,0,0];
  for(let i=0;i<6;i++){ const dStart = new Date(monday); dStart.setDate(monday.getDate()+i); const dEnd = new Date(dStart); dEnd.setDate(dStart.getDate()+1); const dayOrders = orders.filter(o=>{ const cd = new Date(o.created_at); return cd >= dStart && cd < dEnd; }); const gross = dayOrders.reduce((s,x)=>s+Number(x.total||0),0); salesPerDay[i]=Math.round(gross); incomePerDay[i]=Math.round(gross*0.15); }
  const ctx = document.getElementById('returnsChart').getContext('2d'); if(returnsChart) returnsChart.destroy();
  returnsChart = new Chart(ctx, { type: 'bar', data: { labels: dayNames, datasets: [ { label:'Sales', data:salesPerDay, backgroundColor:'#16a34a', borderRadius:6 }, { label:'Income (15%)', data:incomePerDay, backgroundColor:'#f59e0b', borderRadius:6 } ] }, options: { responsive:true, plugins:{ legend:{ display:true, position:'bottom', labels:{ font:{size:10}, boxWidth:12 } } }, scales:{ y:{ beginAtZero:true, ticks:{ font:{size:9}, callback:v=>'₦'+v } }, x:{ ticks:{ font:{size:10, weight:'bold'} } } } } });
}
function updateOrdersTabAlert(){
  const ordersTab = document.getElementById('btnO'); const newPaidOrders = orders.filter(o => o.status === 'paid').length;
  if(newPaidOrders > 0){ ordersTab.classList.add('alert-tab'); ordersTab.innerHTML = `Orders (<span id="cO">${orders.length}</span>) <span class="badge">${newPaidOrders}</span>`; } else { ordersTab.classList.remove('alert-tab'); ordersTab.innerHTML = `Orders (<span id="cO">${orders.length}</span>)`; }
}
function triggerNewOrderAlert(){ new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{}); if(navigator.vibrate) navigator.vibrate([200,100,200]); if(Notification.permission === "granted"){ new Notification("🔔 New Order!", { body: `You have ${orders.filter(o=>o.status==='paid').length} pending order(s)` }); } else if(Notification.permission!== "denied"){ Notification.requestPermission(); } }
function filterOrders(type){
  orderSubTab = type;
  document.querySelectorAll('#orderFilters button').forEach(b=> b.className = 'px-3 py-1.5 rounded-full bg-white border font-bold whitespace-nowrap');
  const activeMap = {all:'fAll', paid:'fPaid', onway:'fOnway', delivered:'fDel', failed:'fFail'};
  document.getElementById(activeMap[type]).className = 'px-3 py-1.5 rounded-full bg-green-600 text-white font-bold whitespace-nowrap';
  render();
}

  const ninImg = u.nin_image || u.nin_url || u.nin_photo || u.id_card_url || '';
  const guarantorImg = u.guarantor_image || u.guarantor_nin_url || u.guarantor_id_url || u.guarantor_photo || '';
  const html = `
    <div class="space-y-3">
      <div class="text-center">
        ${passport? `<img src="${passport}" class="w-28 h-28 rounded-full mx-auto border-4 border-green-500 object-cover shadow">` : `<div class="w-28 h-28 rounded-full mx-auto bg-gray-200 flex items-center justify-center text-4xl">👤</div>`}
        <h2 class="font-black text-[15px] mt-2">${u.full_name || 'No Name'}</h2>
        <p class="text-[11px] text-gray-500">${u.email}</p>
        <span class="inline-block mt-1 px-3 py-0.5 rounded-full text-[10px] font-bold ${String(u.role).includes('delivery')? 'bg-blue-500 text-white':'bg-green-500 text-white'}">${u.role}</span>
      </div>
      <hr>
      <div class="bg-green-50 p-3 rounded-xl border border-green-100">
        <b class="text-green-700">📱 Personal Info</b><br>
        Phone: <b>${u.phone || u.whatsapp || 'N/A'}</b><br>
        WhatsApp: ${u.whatsapp || u.phone || 'N/A'}<br>
        Location: ${u.location || u.address || 'N/A'}<br>
        Status: <b class="${u.is_approved? 'text-green-600':'text-red-600'}">${u.is_approved? 'Active':'Suspended/Pending'}</b><br>
        Joined: ${u.created_at? new Date(u.created_at).toLocaleString() : 'N/A'}
      </div>
      <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
        <b class="text-blue-700">🆔 NIN & Passport</b><br>
        NIN No: <b>${u.nin || u.nin_number || u.nin_no || 'N/A'}</b><br>
        <div class="flex gap-2 mt-2 flex-wrap">
          ${passport? `<a href="${passport}" target="_blank" class="bg-green-600 text-white px-3 py-1.5 rounded-full text-[11px] font-bold">🖼️ View Passport</a>` : '<span class="text-[11px] text-gray-400">No passport uploaded</span>'}
          ${ninImg? `<a href="${ninImg}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-[11px] font-bold">📄 View NIN Card</a>` : '<span class="text-[11px] text-gray-400">No NIN image</span>'}
        </div>
      </div>
      <div class="bg-yellow-50 p-3 rounded-xl border border-yellow-100">
        <b class="text-yellow-700">👨‍👩‍👦 Guarantor Info</b><br>
        Name: <b>${u.guarantor_name || u.guarantor_fullname || 'N/A'}</b><br>
        Phone: <b>${u.guarantor_phone || u.guarantor_number || 'N/A'}</b><br>
        Address: ${u.guarantor_address || 'N/A'}<br>
        Relationship: ${u.guarantor_relationship || u.guarantor_relation || 'N/A'}<br>
        <div class="mt-2">
          ${guarantorImg? `<a href="${guarantorImg}" target="_blank" class="bg-yellow-600 text-white px-3 py-1.5 rounded-full text-[11px] font-bold">📄 View Guarantor ID</a>` : '<span class="text-[11px] text-gray-400">No guarantor ID</span>'}
        </div>
      </div>
      ${u.bank_name || u.account_number? `<div class="bg-purple-50 p-3 rounded-xl border border-purple-100"><b>🏦 Bank</b><br>Bank: ${u.bank_name||''}<br>Acct No: ${u.account_number||''}<br>Acct Name: ${u.account_name||''}<br>${u.paystack_subaccount_code? `Sub: <b>${u.paystack_subaccount_code}</b>`:''}</div>` : ''}
    </div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('detailModal').classList.remove('hidden');
}
function closeModal(){ document.getElementById('detailModal').classList.add('hidden'); }

function render(){
  let data=[];
  if(tab==='pending') data = users.filter(x=> (String(x.role).toLowerCase().trim()==='vendor' || String(x.role).toLowerCase().trim()==='delivery_agent') && (x.is_approved===false || x.is_approved===null));
  if(tab==='vendors') data = users.filter(x=>String(x.role).toLowerCase().trim()==='vendor' && x.is_approved===true);
  if(tab==='suspended') data = users.filter(x=> (String(x.role).toLowerCase().trim()==='vendor' || String(x.role).toLowerCase().trim()==='delivery_agent') && x.is_approved===false);
  if(tab==='agents') data = users.filter(x=>String(x.role).toLowerCase().trim()==='delivery_agent');
  if(tab==='orders'){
    if(orderSubTab==='all') data = orders;
    if(orderSubTab==='paid') data = orders.filter(o=>o.status==='paid');
    if(orderSubTab==='onway') data = orders.filter(o=>o.status==='picked' || o.status==='on the way');
    if(orderSubTab==='delivered') data = orders.filter(o=>o.status==='delivered');
    if(orderSubTab==='failed') data = orders.filter(o=>o.status==='failed');
  }
  document.getElementById('orderFilters').className = tab==='orders'? 'flex gap-1 p-2 bg-gray-50 overflow-x-auto text-[11px] border-b' : 'hidden';
  if(data.length===0){ document.getElementById('list').innerHTML = `<div class="text-center text-gray-400 py-10">No ${orderSubTab==='all'?'':orderSubTab} ${tab} yet</div>`; return; }
  let html='';
  if(tab==='pending' || tab==='vendors' || tab==='suspended' || tab==='agents'){
    data.forEach(u=>{
      let roleBadge = String(u.role).toLowerCase().trim()==='delivery_agent'? `<span class="bg-blue-500 text-white px-2 py-0.5 rounded text-[10px]">AGENT</span>` : `<span class="bg-green-500 text-white px-2 py-0.5 rounded text-[10px]">VENDOR</span>`;
      let actionBtn = (tab==='pending' || tab==='suspended')? `<button id="btn-${u.email}" onclick="updateStatus('${u.email}', true)" class="mt-2 bg-green-600 text-white px-4 py-1 rounded-full text-xs font-bold">Approve / Reactivate</button>` : `<button onclick="updateStatus('${u.email}', false)" class="mt-2 bg-red-600 text-white px-4 py-1 rounded-full text-xs font-bold">Suspend</button>`;
      let viewBtn = `<button onclick="openAgentDetail('${u.email}')" class="mt-2 ml-1 bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-bold">👁️ View Full Info</button>`;
      let subInfo = u.paystack_subaccount_code? `<div class="text-[10px] text-green-600 font-bold mt-1">✅ ${u.paystack_subaccount_code}</div>` : '';
      html += `<div class="border rounded-lg p-3 mb-2"><div class="font-bold">${u.full_name || 'null'} ${roleBadge}</div><div class="text-xs text-gray-500">${u.email} • ${u.phone||u.whatsapp||''} • ${u.location||''}</div><div class="text-xs mt-1">Status: <b class="${u.is_approved? 'text-green-600':'text-red-600'}">${u.is_approved? 'Active':'Suspended'}</b> ${u.account_number? `• Acct: ${u.account_number} (${u.bank_name||'Opay'})`:''}</div>${subInfo}${actionBtn} ${viewBtn}</div>`;
    });
  }
  if(tab==='orders'){
    data.forEach(o=>{
      let statusColor = o.status==='paid'? 'text-orange-600' : (o.status==='picked' || o.status==='on the way')? 'text-blue-600' : o.status==='delivered'? 'text-green-600' : 'text-red-600';
      let agentUser = users.find(u=>u.email===o.delivery_agent_email);
      let agentDisplayName = o.delivery_agent_name || agentUser?.full_name || o.delivery_agent_email || 'N/A';
      let agentDisplayPhone = o.delivery_agent_phone || agentUser?.phone || agentUser?.whatsapp || '';
      let agentInfo = o.delivery_agent_email? `<div class="text-xs text-blue-600 font-bold truncate">🚚 Agent: ${agentDisplayName} (${agentDisplayPhone}) <button onclick="openAgentDetail('${o.delivery_agent_email}')" class="ml-1 bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[9px] font-bold">View KYC</button></div>` : `<div class="text-xs text-orange-600 font-bold">⚠️ Waiting for Agent</div>`;
      const startTime = o.picked_at || o.delivery_started_at;
      const isActive = (o.status==='picked' || o.status==='on the way');
      let timerHTML = isActive? `<div class="admin-timer" data-start="${startTime}">${formatAdminCountdown(startTime)}</div>` : '';
      const newBorder = o.status==='paid'? 'border-2 border-green-500 bg-green-50' : 'border';
      html += `<div class="${newBorder} rounded-lg p-3 mb-2 min-w-0">
        <div class="flex justify-between gap-2"><div class="font-bold text-[12px] truncate">Order #${o.id} - <span class="${statusColor}">${o.status.toUpperCase()}</span> ${o.status==='paid'? '🆕 NEW FIRST':''}</div><div class="font-bold text-green-700 text-[12px] shrink-0">₦${Number(o.total||0).toLocaleString()}</div></div>
        <div class="text-xs truncate">Customer: ${o.customer_name || o.customer_email} - ${o.customer_phone||''}</div>
        <div class="text-xs text-gray-500 truncate">${o.customer_address||''}</div>
        ${agentInfo}
        ${timerHTML}
        <div class="text-[10px] text-gray-400 mt-1">${new Date(o.created_at).toLocaleString()}</div>
      </div>`;
    });
  }
  document.getElementById('list').innerHTML = html;
}

function showTab(t){
  tab=t;
  ['P','V','S','A','O'].forEach(k=> document.getElementById('btn'+k).className = 'flex-1 p-3 font-bold text-gray-400 whitespace-nowrap');
  const map={pending:'btnP',vendors:'btnV',suspended:'btnS',agents:'btnA',orders:'btnO'};
  document.getElementById(map[t]).className = 'flex-1 p-3 font-bold text-green-600 border-b-2 border-green-600 whitespace-nowrap';
  if(t==='orders'){ document.getElementById('btnO').classList.remove('alert-tab'); setTimeout(()=>{ document.getElementById('mainTabs').scrollLeft = document.getElementById('mainTabs').scrollWidth; },100); }
  render();
}

// ===== FIXED UPDATE STATUS - AUTO PAYSTACK + AUTO HIDE/SHOW PRODUCTS =====
function getBankCode(bankName){
  if(!bankName) return "999992";
  const n = bankName.toLowerCase();
  if(n.includes("opay")) return "999992";
  if(n.includes("palm")) return "999991";
  if(n.includes("kuda")) return "090267";
  if(n.includes("monie")) return "50515";
  if(n.includes("gtb") || n.includes("gtbank") || n.includes("guaranty")) return "058";
  if(n.includes("access")) return "044";
  if(n.includes("uba")) return "033";
  if(n.includes("first")) return "011";
  if(n.includes("zenith")) return "057";
  if(n.includes("wema")) return "035";
  if(n.includes("fcmb")) return "214";
  if(n.includes("fidelity")) return "070";
  if(n.includes("union")) return "032";
  if(n.includes("stanbic")) return "221";
  return "999992";
}

async function updateStatus(email, status){
  const u = users.find(x=>x.email===email);
  if(!u){ alert('User not found: '+email); return; }
  const isVendor = String(u.role).toLowerCase().trim() === 'vendor';

  if(!confirm(`${status?'Approve':'Suspend'} ${u.full_name || email}?${isVendor && status? '\n\nThis will auto-create Paystack subaccount for: ' + (u.account_number||'NO ACCOUNT') + ' ('+(u.bank_name||'Opay')+')' : ''}${isVendor &&!status? '\n\nAll his products will be HIDDEN from Store!' : ''}`)) return;

  // VENDOR APPROVAL = CREATE PAYSTACK SUBACCOUNT + SHOW PRODUCTS
  if(isVendor && status){
    if(!u.account_number){
      if(!confirm('❌ No account_number found for this vendor!\n\nVendor email: '+u.email+'\n\nDo you still want to APPROVE without Paystack? (vendor will NOT get auto-split)')) return;
      await supabaseClient.from('users').update({is_approved: true}).eq('email',email);
      // FIX 2: Show products again
      await supabaseClient.from('products').update({is_approved: true}).eq('vendor_email', email);
      alert('Approved without Paystack subaccount + Products now VISIBLE');
      load(); return;
    }

    const btn = document.getElementById(`btn-${email}`);
    if(btn){ btn.innerText = '⏳ Creating...'; btn.disabled = true; }

    try{
      document.getElementById('list').innerHTML = `<div class="text-center py-12"><div class="text-green-600 font-black">⏳ Creating Paystack subaccount...</div><div class="text-xs mt-2">${u.full_name} - ${u.account_number} - ${u.bank_name||'Opay'}</div></div>`;

      const bankCode = u.bank_code || getBankCode(u.bank_name);

      const { data, error } = await supabaseClient.functions.invoke('create-vendor-subaccount', {
        body: {
          account_number: String(u.account_number).trim(),
          bank_code: String(bankCode).trim(),
          vendor_name: u.full_name || u.business_name || 'Vendor',
          vendor_email: u.email,
          vendor_phone: u.phone || u.whatsapp || '08000000000'
        }
      });

      if(error) throw new Error(error.message || JSON.stringify(error));
      if(!data?.data?.subaccount_code) throw new Error('No subaccount_code returned: ' + JSON.stringify(data));

      const subCode = data.data.subaccount_code;

      // Save to DB + approve
      const { error: updErr } = await supabaseClient.from('users').update({
        is_approved: true,
        paystack_subaccount_code: subCode,
        paystack_bank: data.data.settlement_bank || u.bank_name || 'OPay',
        account_name_resolved: data.data.account_name || '',
        bank_code: bankCode
      }).eq('email', email);

      if(updErr){
        await supabaseClient.from('users').update({is_approved: true}).eq('email', email);
      }

      // FIX 2: Show products again on re-approve
      await supabaseClient.from('products').update({is_approved: true}).eq('vendor_email', email);

      alert(`✅ VENDOR APPROVED & LINKED!\n\nName: ${data.data.account_name}\nBank: ${data.data.settlement_bank}\nSubaccount: ${subCode}\n\nSplit: You 10% / Vendor 90% auto!\nProducts now VISIBLE in Store!`);

    }catch(err){
      console.error(err);
      alert('❌ Paystack Failed: ' + err.message + '\n\nCheck: 1) Vendor Opay number correct? 2) Edge Function deployed? 3) Paystack secret key set?\n\nYou can retry Approve.');
      load();
      return;
    }
  } else {
    // Agent approval OR suspending vendor/agent
    await supabaseClient.from('users').update({is_approved: status}).eq('email',email);

    // FIX 1: Hide products when suspending vendor
    if(isVendor &&!status){
      await supabaseClient.from('products').update({is_approved: false}).eq('vendor_email', email);
      alert(`🚫 Vendor Suspended!\n\nAll products from ${email} are now HIDDEN from Store!`);
    } else {
      alert(`Account ${status?'Approved':'Suspended'}!`);
    }
  }
  load();
}

setInterval(()=>{ document.querySelectorAll('.admin-timer').forEach(el=>{ const start = el.getAttribute('data-start'); if(start && start!=='null' && start!=='undefined'){ el.innerHTML = formatAdminCountdown(start); } }); },1000);
setInterval(load, 40000);
load();
</script>
