<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyChrVZh6NUm7N5W7FMXnxztmU7NXRYrVa0",
    authDomain: "lokoja-grocery-mall.firebaseapp.com",
    projectId: "lokoja-grocery-mall",
    storageBucket: "lokoja-grocery-mall.firebasestorage.app",
    messagingSenderId: "642467126038",
    appId: "1:642467126038:web:420d7c0e33119b7fa24e37"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // SAMPLE DATA - Delivery Agents
  const pendingAgents = [
    {id:1, name:"Ahmad Musa", phone:"08031234567", driverrider:"yes", nin:"12345678901", status:"pending"},
    {id:2, name:"John Doe", phone:"08099887766", driverrider:"no", nin:"98765432109", status:"pending"},
    {id:3, name:"Fatima Bello", phone:"08123456789", driverrider:"yes", nin:"11223344556", status:"pending"}
  ];

  function renderAgents(){
    const list = document.getElementById('pendingDeliveryList');
    list.innerHTML = '';
    
    pendingAgents.forEach(agent => {
      const isRejected = agent.driverrider === 'no';
      const cardColor = isRejected ? '#fee2e2' : '#f0fdf4';
      const borderColor = isRejected ? '#ef4444' : '#16a34a';
      
      list.innerHTML += `
        <div style="background:${cardColor};border:2px solid ${borderColor};border-radius:12px;padding:15px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <div>
              <h4 style="margin:0;font-size:15px">${agent.name}</h4>
              <p style="margin:4px 0;font-size:12px;color:#666">Phone: ${agent.phone} | NIN: ${agent.nin}</p>
              <p style="margin:4px 0;font-size:12px">
                Driver & Rider: 
                <b style="color:${isRejected ? '#dc2626' : '#16a34a'}">
                  ${agent.driverrider === 'yes' ? 'YES ✓' : 'NO ✗ AUTO-REJECT'}
                </b>
              </p>
            </div>
            <div>
              ${isRejected 
                ? `<button disabled style="padding:8px 12px;background:#ccc;color:white;border:none;border-radius:8px">Rejected</button>`
                : `<button onclick="approveAgent(${agent.id})" style="padding:8px 12px;background:#16a34a;color:white;border:none;border-radius:8px;cursor:pointer">Approve</button>`
              }
            </div>
          </div>
          ${isRejected ? `<p style="font-size:11px;color:#dc2626;margin-top:8px">*Did not meet "Driver and Rider" requirement</p>` : ''}
        </div>
      `;
    });
  }

  window.approveAgent = function(id){
    alert('Agent ' + id + ' Approved! Bank details field will now open for them.');
  }

  renderAgents();

  // VENDOR FORM SUBMIT - THIS IS THE FIX
  const form = document.getElementById('vendorForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // STOPS THE WIPE

    const storeName = document.getElementById('storeName').value;
    const ownerName = document.getElementById('ownerName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const phone = document.getElementById('phone').value;
    const messageEl = document.getElementById('message');

    try {
      messageEl.innerHTML = "Creating account...";
      
      // 1. Create user in Firebase Auth
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      
      // 2. Save vendor data to Firestore
      await setDoc(doc(db, "vendors", userCred.user.uid), {
        uid: userCred.user.uid,
        storeName,
        ownerName,
        email,
        phone,
        status: "pending",
        createdAt: serverTimestamp()
      });

      messageEl.innerHTML = "✅ Account created! Waiting for admin approval";
      messageEl.style.color = "green";
      form.reset();
      
    } catch(err) {
      messageEl.innerHTML = "❌ Error: " + err.message;
      messageEl.style.color = "red";
      console.error(err);
    }
  });
</script>
