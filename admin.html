<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - LGM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">LGM</div>
    <span>Admin Dashboard</span>
  </div>
</header>

<main class="container">
  <h2 style="margin-bottom:20px">Pending Approvals</h2>

  <!-- PENDING DELIVERY AGENTS -->
  <div class="form-card">
    <h3>Pending Delivery Agents</h3>
    <div id="pendingDeliveryList"></div>
  </div>

  <!-- PENDING VENDORS -->
  <div class="form-card">
    <h3>Pending Vendors</h3>
    <p style="font-size:13px;color:#666">Vendor list will appear here</p>
  </div>

</main>

<footer class="app-footer">© 2026 Lokoja Grocery Mall Admin</footer>

<script>
// SAMPLE DATA - Replace this with your real data from database
const pendingAgents = [
  {id:1, name:"Ahmad Musa", phone:"08031234567", driverrider:"yes", nin:"12345678901", status:"pending"},
  {id:2, name:"John Doe", phone:"08099887766", driverrider:"no", nin:"98765432109", status:"pending"},
  {id:3, name:"Fatima Bello", phone:"08123456789", driverrider:"yes", nin:"11223344556", status:"pending"}
];

function renderAgents(){
  const list = document.getElementById('pendingDeliveryList');
  list.innerHTML = '';
  
  pendingAgents.forEach(agent => {
    const isRejected = agent.driverrider === 'no';
    const cardColor = isRejected ? '#fee2e2' : '#f0fdf4';
    const borderColor = isRejected ? '#ef4444' : '#16a34a';
    
    list.innerHTML += `
      <div style="background:${cardColor};border:2px solid ${borderColor};border-radius:12px;padding:15px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <div>
            <h4 style="margin:0;font-size:15px">${agent.name}</h4>
            <p style="margin:4px 0;font-size:12px;color:#666">Phone: ${agent.phone} | NIN: ${agent.nin}</p>
            <p style="margin:4px 0;font-size:12px">
              Driver & Rider: 
              <b style="color:${isRejected ? '#dc2626' : '#16a34a'}">
                ${agent.driverrider === 'yes' ? 'YES ✓' : 'NO ✗ AUTO-REJECT'}
              </b>
            </p>
          </div>
          <div>
            ${isRejected 
              ? `<button disabled style="padding:8px 12px;background:#ccc;color:white;border:none;border-radius:8px">Rejected</button>`
              : `<button onclick="approveAgent(${agent.id})" style="padding:8px 12px;background:#16a34a;color:white;border:none;border-radius:8px;cursor:pointer">Approve</button>`
            }
          </div>
        </div>
        ${isRejected ? `<p style="font-size:11px;color:#dc2626;margin-top:8px">*Did not meet "Driver and Rider" requirement</p>` : ''}
      </div>
    `;
  });
}

function approveAgent(id){
  alert('Agent ' + id + ' Approved! Bank details field will now open for them.');
  // Here you will update database: status = 'approved'
}

renderAgents();
</script>
<script type="module">
import { auth, db, createUserWithEmailAndPassword, collection, addDoc, serverTimestamp } from './firebase.js';

const form = document.querySelector('form');
if(form){
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    const name = document.getElementById('name').value;

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      await addDoc(collection(db, "users"), {
        uid: userCred.user.uid,
        name,
        email,
        role,
        createdAt: serverTimestamp()
      });
      alert('Account created successfully! You are now a ' + role);
      window.location.href = 'dashboard.html';
    } catch(err) {
      alert('Error: ' + err.message);
    }
  });
}
</script>
