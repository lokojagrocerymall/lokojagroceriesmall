<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Agent Signup - LGM</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100">
<header class="bg-green-700 p-4 text-center"><b class="text-white text-lg">🚚 Delivery Agent Application</b></header>

<div class="p-4 max-w-2xl mx-auto">
  <form id="agentForm" class="bg-white p-4 rounded-2xl shadow space-y-4">
    <h3 class="font-bold text-lg text-green-700">1. Personal Information</h3>
    <input name="full_name" placeholder="Full Name - Must match NIN" required class="w-full border p-2 rounded">
    <input name="address" placeholder="House Address" required class="w-full border p-2 rounded"> <!-- changed name -->
    <input name="whatsapp" placeholder="WhatsApp Number" required class="w-full border p-2 rounded">
    <input name="email" type="email" placeholder="Email Address" required class="w-full border p-2 rounded">
    <input name="password" type="password" placeholder="Create Password" required class="w-full border p-2 rounded">

    <label class="text-sm font-bold">Passport Photograph</label>
    <input name="passport" type="file" accept="image/*" required class="w-full">

    <label class="text-sm font-bold">NIN Slip / Card - Upload Image or PDF</label>
    <input name="nin" type="file" accept="image/*,.pdf" required class="w-full">

    <h3 class="font-bold text-lg text-green-700 pt-2">2. Guarantor Information</h3>
    <input name="g_name" placeholder="Guarantor Full Name - Must match NIN" required class="w-full border p-2 rounded">
    <input name="g_address" placeholder="Guarantor House/Office Address" required class="w-full border p-2 rounded">
    
    <label class="text-sm font-bold">Guarantor Passport Photograph</label>
    <input name="g_passport" type="file" accept="image/*" required class="w-full">

    <label class="text-sm font-bold">Guarantor NIN Slip / Card</label>
    <input name="g_nin" type="file" accept="image/*,.pdf" required class="w-full">

    <h3 class="font-bold text-lg text-green-700 pt-2">3. Vehicle Requirement</h3>
    <div class="flex gap-4">
      <label><input type="radio" name="is_driver_rider" value="true" required> Yes, I am a Driver & Rider</label>
      <label><input type="radio" name="is_driver_rider" value="false"> No</label>
    </div>

    <button id="submitBtn" type="submit" class="w-full bg-green-700 text-white py-3 rounded-full font-bold disabled:bg-gray-400">Submit Application</button>
    <p id="msg" class="text-center text-sm"></p>
  </form>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('agentForm');
const submitBtn = document.getElementById('submitBtn');

// Disable submit if "No" is selected
form.is_driver_rider.forEach(radio => {
  radio.addEventListener('change', () => {
    if(radio.value === 'false' && radio.checked){
      submitBtn.disabled = true;
      document.getElementById('msg').innerText = 'You must be a Driver and Rider to apply';
    } else {
      submitBtn.disabled = false;
      document.getElementById('msg').innerText = '';
    }
  })
})

form.onsubmit = async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.innerText = 'Submitting...';
  const fd = new FormData(form);

  // 1. UPLOAD FILES TO STORAGE - All in one bucket, no folders
  const uploadFile = async (file) => {
    const fileName = `${Date.now()}_${file.name}`;
    const { data, error } = await supabaseClient.storage.from('delivery_docs').upload(fileName, file);
    if(error) throw error;
    return fileName;
  }

  try{
    const passportPath = await uploadFile(fd.get('passport'));
    const ninPath = await uploadFile(fd.get('nin'));
    const gPassportPath = await uploadFile(fd.get('g_passport'));
    const gNinPath = await uploadFile(fd.get('g_nin'));

    // 2. INSERT INTO users TABLE - NOT delivery_agents
    const { error } = await supabaseClient.from('users').insert([{
      role: 'delivery', // KEY: so admin and login can find it
      status: 'pending', // KEY: so admin can approve
      full_name: fd.get('full_name'),
      address: fd.get('address'),
      whatsapp: fd.get('whatsapp'),
      email: fd.get('email'),
      password: fd.get('password'), // NOTE: Hash this later in production
      passport_url: passportPath,
      nin_url: ninPath,
      g_full_name: fd.get('g_name'),
      g_house_address: fd.get('g_address'),
      g_passport_url: gPassportPath,
      g_nin_url: gNinPath,
      is_driver_rider: fd.get('is_driver_rider') === 'true'
    }]);

    if(error) throw error;
    
    document.getElementById('msg').innerHTML = '✅ Application Submitted! Admin will verify your NIN and contact you.';
    form.reset();

  }catch(err){
    document.getElementById('msg').innerText = 'Error: ' + err.message;
  }
  submitBtn.disabled = false;
  submitBtn.innerText = 'Submit Application';
}
</script></body></html>
