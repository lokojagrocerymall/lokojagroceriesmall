<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery - LGM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f8fafc;margin:0;padding:12px} .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head><body>
<div class="card"><b id="dName">Delivery Agent</b><div id="dEmail" style="font-size:12px;color:#666"></div><div style="font-size:12px;color:green">✅ You earn 5% per delivery</div></div>
<div class="card"><h3>Available Orders</h3><div id="orders">Loading...</div></div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cur=JSON.parse(localStorage.getItem('lgm_user')||'{}'); if(!cur.email){location.href='login.html';}
document.getElementById('dName').innerText=cur.name||cur.email;document.getElementById('dEmail').innerText=cur.email;
async function load(){const{data}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false}).limit(20);let h='';if(!data||data.length==0)h='<p style="font-size:12px;color:#888">No orders yet</p>';else data.forEach(o=>{h+=`<div class="card" style="border:1px solid #e5e7eb"><b>Order #${o.id}</b><br><span style="font-size:12px">₦${o.total_amount||0} • ${o.status||'pending'}</span><br><button onclick="accept(${o.id})" style="background:#16a34a;color:#fff;border:0;padding:8px 12px;border-radius:8px;margin-top:6px">Accept Delivery</button></div>`});document.getElementById('orders').innerHTML=h;}
async function accept(id){await supabaseClient.from('orders').update({status:'out_for_delivery', delivery_agent_email:cur.email}).eq('id',id);alert('✅ Accepted! Customer will be notified');load();}
load();
</script></body></html>
