<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard - Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100">
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0">
  <b class="text-green-700">Delivery Agent Dashboard</b>
  <button onclick="logout()" class="bg-red-500 text-white px-4 py-1.5 rounded-full text-sm">Logout</button>
</header>
<div class="p-4 max-w-4xl mx-auto">
  <div class="bg-white p-4 rounded-2xl shadow mb-4">
    <h2 id="welcome" class="text-lg font-bold text-green-700"></h2>
    <p>View and update delivery orders assigned to you</p>
  </div>
  <div class="bg-white p-4 rounded-2xl shadow">
    <h3 class="font-bold mb-3">🚚 Orders On The Way</h3>
    <div id="ordersList">Loading...</div>
  </div>
</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const user = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!user.email || (user.role!=='agent' && user.role!=='delivery')){ location.href='login.html'; }
document.getElementById('welcome').innerText = 'Welcome, ' + (user.name||user.full_name);

async function loadOrders(){
  const { data:orders } = await supabaseClient.from('orders').select('*').eq('status','on the way').order('created_at',{ascending:false});
  if(!orders || orders.length===0){ document.getElementById('ordersList').innerHTML = '<p class="text-gray-400">No active deliveries</p>'; return; }
  let html = '';
  orders.forEach(o=>{
    html += `<div class="border rounded-xl p-3 mb-2">
      <b>Order #${o.id}</b> - ₦${Number(o.total||0).toLocaleString()}
      <div class="text-xs">${o.customer_name} - ${o.customer_phone} - ${o.customer_address}</div>
    </div>`;
  });
  document.getElementById('ordersList').innerHTML = html;
}
function logout(){ localStorage.removeItem('lgm_user'); location.href='login.html'; }
loadOrders();
</script></body></html>
