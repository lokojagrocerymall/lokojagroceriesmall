<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard - Lokoja Grocery Mall</title>
<style>
  body { background:#f5f5f5; padding:20px; font-family:sans-serif; }
  .container { max-width:600px; margin:0 auto; }
  .welcome { background:#16a34a; color:#fff; padding:20px; border-radius:12px; margin-bottom:20px; }
  .card { background:#fff; padding:20px; border-radius:12px; margin-bottom:15px; }
  input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px; }
  .btn { background:#16a34a; color:#fff; border:none; padding:14px; border-radius:8px; font-weight:700; width:100%; cursor:pointer; }
  .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; }
  .modal-content { background:#fff; padding:25px; border-radius:12px; width:90%; max-width:400px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div class="container">
  <div class="welcome">
    <h2 id="welcomeName">Welcome, Vendor!</h2>
    <p>Manage your store and products</p>
  </div>
  
  <div class="card">
    <h3>My Products</h3>
    <button class="btn" onclick="showAddProduct()">+ Add New Product</button>
    <div id="productList"><p>No products yet</p></div>
  </div>
  
  <div class="card">
    <h3>Orders</h3>
    <p>0 orders</p>
  </div>
</div>

<!-- BANK DETAILS MODAL -->
<div id="bankModal" class="modal hidden">
  <div class="modal-content">
    <h3>Complete Bank Details</h3>
    <p style="color:#6b7280; font-size:14px;">Required to receive payments via Flutterwave</p>
    <label>Account Name</label>
    <input type="text" id="accountName">
    <label>Account Number</label>
    <input type="number" id="accountNumber">
    <label>Bank</label>
    <select id="bankName">
      <option value="">Select Bank</option>
      <option>Access Bank</option>
      <option>First Bank</option>
      <option>GTBank</option>
      <option>Zenith Bank</option>
      <option>UBA</option>
      <option>Polaris Bank</option>
      <option>Fidelity Bank</option>
      <option>Union Bank</option>
      <option>Stanbic IBTC</option>
      <option>Keystone Bank</option>
      <option>Ecobank</option>
      <option>Jaiz Bank</option>
      <option>Wema Bank</option>
      <option>Unity Bank</option>
      <option>First City Monument Bank</option>
      <option>Heritage Bank</option>
      <option>Opay</option>
      <option>Palmpay</option>
      <option>Kuda Bank</option>
      <option>Moniepoint</option>
    </select>
    <button class="btn" onclick="saveBankDetails()">Save & Activate Store</button>
  </div>
</div>

<!-- ADD PRODUCT MODAL -->
<div id="productModal" class="modal hidden">
  <div class="modal-content">
    <h3>Add New Product</h3>
    <label>Product Name</label>
    <input type="text" id="productName" placeholder="e.g Rice 50kg">
    <label>Price ₦</label>
    <input type="number" id="productPrice" placeholder="e.g 45000">
    <label>Category</label>
    <select id="productCategory">
      <option>Foodstuffs</option>
      <option>Drinks</option>
      <option>Household</option>
      <option>Personal Care</option>
    </select>
    <label>Stock Quantity</label>
    <input type="number" id="productStock" placeholder="e.g 20">
    <button class="btn" onclick="saveProduct()">Save Product</button>
    <button style="background:#6b7280; margin-top:10px;" class="btn" onclick="closeProduct()">Cancel</button>
  </div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('currentUser'));

document.getElementById('welcomeName').innerText = `Welcome, ${currentUser.name}!`;

if(!currentUser.accountNumber) {
  document.getElementById('bankModal').classList.remove('hidden');
  document.getElementById('accountName').value = currentUser.name;
}

function saveBankDetails() {
  currentUser.accountName = document.getElementById('accountName').value;
  currentUser.accountNumber = document.getElementById('accountNumber').value;
  currentUser.bankName = document.getElementById('bankName').value;
  
  let allUsers = JSON.parse(localStorage.getItem('allUsers'));
  let userIndex = allUsers.findIndex(u => u.id === currentUser.id);
  allUsers[userIndex] = currentUser;
  localStorage.setItem('allUsers', JSON.stringify(allUsers));
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  
  alert('Bank details saved! Your store is now active.');
  document.getElementById('bankModal').classList.add('hidden');
}

function showAddProduct() {
  document.getElementById('productModal').classList.remove('hidden');
}

function closeProduct() {
  document.getElementById('productModal').classList.add('hidden');
}

function saveProduct() {
  const product = {
    id: Date.now(),
    vendorId: currentUser.id,
    name: document.getElementById('productName').value,
    price: document.getElementById('productPrice').value,
    category: document.getElementById('productCategory').value,
    stock: document.getElementById('productStock').value
  };
  
  let products = JSON.parse(localStorage.getItem('products')) || [];
  products.push(product);
  localStorage.setItem('products', JSON.stringify(products));
  
  alert('Product Added Successfully!');
  closeProduct();
  loadProducts();
}

function loadProducts() {
  let products = JSON.parse(localStorage.getItem('products')) || [];
  let vendorProducts = products.filter(p => p.vendorId === currentUser.id);
  
  let html = '';
  vendorProducts.forEach(p => {
    html += `<div style="border:1px solid #ddd; padding:10px; border-radius:8px; margin-top:10px;">
      <b>${p.name}</b> - ₦${p.price}<br>
      <small>Stock: ${p.stock} | ${p.category}</small>
    </div>`;
  });
  
  document.getElementById('productList').innerHTML = html || '<p>No products yet</p>';
}

loadProducts();
</script>
</body>
</html>
