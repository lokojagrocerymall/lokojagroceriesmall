<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#fff;padding:12px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.wallet{background:#16a34a;color:#fff}
.tabs{display:flex;gap:18px;border-bottom:1px solid #e5e7eb;margin:14px 0;font-weight:700;font-size:14px}
.tab{padding-bottom:8px;color:#9ca3af}.active{color:#16a34a;border-bottom:3px solid #16a34a}
input,select{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.upload{border:2px dashed #86efac;background:#f0fdf4;padding:12px;border-radius:12px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800}
.small{font-size:12px;color:#6b7280}
</style>
</head>
<body>

<div class="card"><b id="vName">Welcome...</b><div id="vEmail" class="small"></div><div class="small" style="color:green">✅ Approved Vendor • You keep 90%</div></div>

<div class="stats">
<div class="stat"><div class="small">Products</div><h2 id="pCount" style="margin:0">0</h2></div>
<div class="stat"><div class="small">Orders</div><h2 style="margin:0;color:#2563eb">0</h2></div>
<div class="stat wallet"><div class="small">Wallet</div><h2 style="margin:0">₦0</h2></div>
</div>

<div class="tabs"><span class="tab active">Products</span><span class="tab">Orders</span><span class="tab">Wallet</span><span class="tab">Shop</span></div>

<div class="card">
<h3 style="margin:0 0 10px">Add New Product - With Image Upload</h3>
<input id="pName" placeholder="Product Name e.g. White Garri 4L">
<div style="display:flex;gap:8px"><input id="pPrice" placeholder="Price ₦"><input id="pStock" placeholder="Stock Qty"></div>
<select id="pCat"><option>Others</option><option>Foodstuff</option><option>Provisions</option><option>Vegetables</option></select>
<div class="upload">
<b>🖼️ Product Image (Tap to choose from gallery)</b>
<input type="file" id="pFile" accept="image/*" style="margin-top:8px">
<div id="status" class="small" style="color:green;margin-top:6px"></div>
</div>
<button class="btn" onclick="addProduct()" style="margin-top:12px">Add Product</button>
</div>

<div id="list"></div>

<script>
// NEW LGM-PRODUCTION KEYS
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let curUser=null; let imgUrl="";

function init(){
  const saved = localStorage.getItem('lgm_user');
  if(!saved){ location.href="login.html"; return; }
  curUser = JSON.parse(saved);
  document.getElementById('vName').innerText="Welcome, "+(curUser.name || curUser.full_name || curUser.email.split('@')[0]);
  document.getElementById('vEmail').innerText=curUser.email + " • " + curUser.role;
  load();
}
document.getElementById('pFile').addEventListener('change', async(e)=>{
 const f=e.target.files[0]; if(!f) return;
 document.getElementById('status').innerText="Uploading to product-images...";
 const name=Date.now()+"-"+f.name.replace(/\s/g,'_');
 const {data, error}=await supabaseClient.storage.from('product-images').upload(name,f);
 if(error){ alert(error.message); document.getElementById('status').innerText=""; return; }
 const {data:u}=supabaseClient.storage.from('product-images').getPublicUrl(data.path);
 imgUrl=u.publicUrl;
 document.getElementById('status').innerText="✅ Uploaded! Ready to save.";
});
async function addProduct(){
 const name=document.getElementById('pName').value;
 const price=document.getElementById('pPrice').value;
 const stock=document.getElementById('pStock').value;
 const cat=document.getElementById('pCat').value;
 if(!name||!price) return alert("Enter name & price");
 if(!imgUrl) return alert("Please choose image first!");
 const {error}=await supabaseClient.from('products').insert({
   name, price:Number(price), stock:Number(stock)||0, category:cat,
   image: imgUrl, image_url: imgUrl,
   vendor_id: curUser.id, vendor_email: curUser.email
 });
 if(error) alert(error.message); else { alert("✅ Product added!"); imgUrl=""; document.getElementById('pName').value=""; document.getElementById('status').innerText=""; load(); }
}
async function load(){
 const {data}=await supabaseClient.from('products').select('*').eq('vendor_email',curUser.email).order('id',{ascending:false});
 document.getElementById('pCount').innerText=data?data.length:0;
 let h="<div class='small' style='margin:8px'>My Products</div>";
 if(!data||data.length==0) h+="<p class='small'>No products yet.</p>";
 else data.forEach(p=>{
   let img = p.image || p.image_url || '';
   h+=`<div class='card' style='display:flex;gap:10px;align-items:center'><img src='${img}' style='width:56px;height:56px;border-radius:10px;object-fit:cover'><div><b style='font-size:14px'>${p.name}</b><br><span class='small'>₦${p.price} • ${p.stock} left</span></div></div>` });
 document.getElementById('list').innerHTML=h;
}
init();
</script>
</body>
</html>
