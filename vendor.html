<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Portal - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
.nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.nav a,.nav button{padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;border:0;cursor:pointer}
.nav-home{background:#fff;color:#16a34a;border:1px solid #e5e7eb!important}
.nav-logout{background:#fee2e2;color:#dc2626}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#fff;padding:12px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.wallet{background:#16a34a;color:#fff}
.tabs{display:flex;gap:18px;border-bottom:1px solid #e5e7eb;margin:14px 0;font-weight:700;font-size:14px;overflow-x:auto}
.tab{padding-bottom:8px;color:#9ca3af;cursor:pointer;white-space:nowrap}.active{color:#16a34a;border-bottom:3px solid #16a34a}
input,select{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.btn-sm{padding:8px 12px;border-radius:8px;border:0;font-weight:700;font-size:12px;cursor:pointer;margin-right:6px}
.small{font-size:12px;color:#6b7280}
.view{display:none}.view.active-view{display:block}
.sales-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.status{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800;text-transform:capitalize}
.status-paid{background:#dbeafe;color:#1d4ed8}
.status-on-the-way{background:#fef3c7;color:#92400e}
.status-delivered{background:#dcfce7;color:#166534}
.status-failed_delivery{background:#fee2e2;color:#dc2626}
.product-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px}
.product-item img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#f3f4f6}
</style>
</head>
<body>
<div class="nav">
<a href="/" class="nav-home">🏠 Store / Home</a>
<button class="nav-logout" onclick="logout()">Logout</button>
</div>
<div class="card"><b id="vName">Welcome...</b><div id="vEmail" class="small"></div><div id="vBadge" class="small" style="color:green"></div></div>
<div class="stats">
<div class="stat"><div class="small">Products</div><h2 id="pCount" style="margin:0">0</h2></div>
<div class="stat"><div class="small">Orders</div><h2 id="oCount" style="margin:0;color:#2563eb">0</h2></div>
<div class="stat wallet"><div class="small">Wallet (90%)</div><h2 id="wallet" style="margin:0">₦0</h2></div>
</div>
<div class="tabs">
<span class="tab active" id="tab-products" onclick="setTab('products')">Products</span>
<span class="tab" id="tab-orders" onclick="setTab('orders')">Orders</span>
<span class="tab" id="tab-wallet" onclick="setTab('wallet')">Wallet</span>
<span class="tab" id="tab-profile" onclick="setTab('profile')">Profile</span>
</div>

<!-- PRODUCTS TAB -->
<div id="view-products" class="view active-view">
<div class="card">
<h3>Add New Product</h3>
<input id="pName" placeholder="Product Name e.g. White Garri 4L">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<input id="pPrice" type="number" placeholder="Price ₦">
<input id="pStock" type="number" placeholder="Stock Qty">
</div>
<input id="pImage" type="file" accept="image/*">
<select id="pCategory">
  <option>Foodstuff</option><option>Drinks</option><option>Household</option>
  <option>Meat & Fish</option><option>Grains</option><option>Spices & Seasoning</option>
  <option>Oil & Condiments</option><option>Fruits & Vegetables</option>
  <option>Beverages</option><option>Baby & Personal Care</option>
</select>
<button class="btn" onclick="addProduct()">Add Product</button>
</div>
<div class="card"><h3>My Products</h3><div id="productList"></div></div>
</div>

<!-- ORDERS TAB -->
<div id="view-orders" class="view">
<div class="sales-grid">
<div class="stat"><div class="small">Today Sales</div><b id="salesToday">₦0</b></div>
<div class="stat"><div class="small">This Week</div><b id="salesWeek">₦0</b></div>
<div class="stat"><div class="small">This Month</div><b id="salesMonth">₦0</b></div>
</div>
<div class="card"><h3>📦 Customer Orders</h3><div id="ordersList" class="small">Loading orders...</div></div>
</div>

<!-- WALLET TAB -->
<div id="view-wallet" class="view">
<div class="card">
<h3>💰 My Wallet (90%)</h3>
<h1 id="walletBig" style="color:#16a34a;margin:0">₦0</h1>
<div class="small">Available for withdrawal</div>
<hr>
<h4>Withdraw to Bank</h4>
<input id="wAccount" placeholder="Account Number">
<input id="wBank" placeholder="Bank Name e.g. Opay, GTB">
<input id="wAmount" type="number" placeholder="Amount to withdraw ₦">
<button class="btn" onclick="requestWithdrawal()">Request Withdrawal</button>
<div id="withdrawHistory" class="small" style="margin-top:12px"></div>
</div>
</div>

<!-- PROFILE TAB -->
<div id="view-profile" class="view"><div class="card"><h3>👤 My Profile</h3><input id="profName" placeholder="Full Name"><input id="profEmail" disabled><button class="btn" onclick="saveProfile()">Save</button></div></div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let curUser=null; let allOrders=[]; let allProducts=[];

// ROLE LOCK - ONLY VENDORS CAN ACCESS
const saved = localStorage.getItem('lgm_user');
curUser = saved? JSON.parse(saved) : null;
if(!curUser || String(curUser.role).toLowerCase().trim()!== 'vendor'){
  alert('Access Denied. Please login as Vendor');
  location.href='/';
}

const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

function setTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active-view'));
  document.getElementById('view-'+name).classList.add('active-view');
  if(name==='orders') loadOrders();
  if(name==='products') loadProducts();
  if(name==='wallet') loadWallet();
}
function logout(){ localStorage.removeItem('lgm_user'); window.location.href='/'; }

function formatVendorCountdown(startTime){
  if(!startTime) return '';
  const end = new Date(startTime).getTime() + TWO_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return `<div style="font-size:12px;margin-top:6px;font-weight:700;color:#dc2626">❌ TIME UP - FAILED</div>`;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const pickedUpTime = new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
  return `<div style="font-size:12px;margin-top:6px;font-weight:700;color:#d97706">⏰ Auto-Fail in: ${h}h ${m}m ${s}s<br><span style="font-size:11px;color:#6b7280">Picked up at: ${pickedUpTime}</span></div>`;
}

async function init(){
  document.getElementById('vName').innerText="Welcome, "+ (curUser.full_name || curUser.name || curUser.email.split('@')[0]);
  document.getElementById('vEmail').innerText=curUser.email;
  document.getElementById('vBadge').innerText=curUser.is_approved? "✅ Approved Vendor • You keep 90%" : "⏳ Pending Approval";
  document.getElementById('profName').value=curUser.full_name || curUser.name;
  document.getElementById('profEmail').value=curUser.email;
  loadProducts(); loadOrders(); loadWallet();
}
init();

async function loadProducts(){
  const {data} = await supabaseClient.from('products').select('*').eq('vendor_email', curUser.email);
  allProducts = data||[];
  document.getElementById('pCount').innerText=allProducts.length;
  let h=''; allProducts.forEach(p=>{
    h+=`<div class="product-item">
      <img src="${p.image_url || 'https://placehold.co/60x60/e5e7eb/6b7280?text=No+Img'}" alt="">
      <div style="flex:1">
        <b>${p.name}</b>
        <div class="small">₦${Number(p.price).toLocaleString()} • Stock: ${p.stock} • ${p.category}</div>
        <div style="margin-top:6px">
          <button class="btn-sm" style="background:#2563eb;color:#fff" onclick="editProduct(${p.id})">Edit</button>
          <button class="btn-sm" style="background:#dc2626;color:#fff" onclick="deleteProduct(${p.id}, '${p.name}')">Delete</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('productList').innerHTML = h || '<p class="small">No products yet</p>';
}

async function addProduct(){
  const file = document.getElementById('pImage').files[0];
  let image_url = '';
  if(file){
    const {data} = await supabaseClient.storage.from('products').upload(`${curUser.email}/${Date.now()}_${file.name}`, file);
    image_url = SUPABASE_URL + '/storage/v1/object/public/products/' + data.path;
  }
  const name=document.getElementById('pName').value;
  const price=document.getElementById('pPrice').value;
  if(!name ||!price) return alert('Fill name and price');
  await supabaseClient.from('products').insert({
    name, price, stock:document.getElementById('pStock').value,
    category:document.getElementById('pCategory').value,
    vendor_email:curUser.email, image_url
  });
  alert('Product Added!');
  ['pName','pPrice','pStock','pImage'].forEach(id=>document.getElementById(id).value='');
  loadProducts();
}

async function editProduct(id){
  const newPrice = prompt('Enter new price ₦:');
  const newStock = prompt('Enter new stock:');
  if(newPrice) await supabaseClient.from('products').update({price:newPrice, stock:newStock}).eq('id',id);
  loadProducts();
}

async function deleteProduct(id, name){
  if(!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  await supabaseClient.from('products').delete().eq('id',id);
  alert('Product Deleted'); loadProducts();
}

// FIXED: LOAD ORDERS BY FILTERING JSONB ITEMS
async function loadOrders(){
  const {data: allOrdersData, error} = await supabaseClient
   .from('orders')
   .select('*')
   .eq('status', 'paid')
   .order('created_at',{ascending:false});

  if(error){ console.log(error); return; }

  // FILTER: Only orders that have at least 1 item with this vendor_email
  allOrders = (allOrdersData||[]).filter(o =>
    o.items && o.items.some(i => i.vendor_email === curUser.email)
  ).map(o => {
    // ONLY SHOW THIS VENDOR'S ITEMS
    return {...o, items: o.items.filter(i => i.vendor_email === curUser.email)}
  });

  let h="";
  if(allOrders.length === 0) h = '<p>📭 No orders yet.</p>';
  else allOrders.forEach(o=>{
    let status = o.status||'paid';
    let myTotal = o.items.reduce((s,i)=>s + i.price*i.qty, 0);
    let myCut = Math.round(myTotal * 0.9);
    let vendorBtn = ''; let countdown = '';

    if(status === 'paid'){
      vendorBtn = `<button onclick="startDelivery(${o.id}, '${o.customer_phone}')" style="background:#2563eb;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;width:100%;margin-top:8px">🚚 Start Delivery - 2hr Timer</button>`;
    }
    if(status === 'on the way' && o.delivery_started_at){
      countdown = formatVendorCountdown(o.delivery_started_at);
    }
    if(status === 'failed_delivery'){
      vendorBtn = `<button disabled style="background:#d1d5db;color:#6b7280;border:0;padding:10px;border-radius:10px;font-weight:800;width:100%;margin-top:8px">❌ Delivery Failed</button>`;
    }

    h+=`<div class='card'>
      <div style="display:flex;justify-content:space-between"><b>Order #${o.id}</b><span class="status status-${status}">${status.replace('_',' ')}</span></div>
      <div class="small">Customer: ${o.customer_name} • ${o.customer_phone}</div>
      <div class="small">Address: ${o.customer_address}</div>
      <div style="margin-top:8px"><b>Your Items:</b> ${o.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</div>
      <div style="margin-top:4px"><b>Your Cut 90%:</b> <span style="color:#16a34a;font-weight:700">₦${myCut.toLocaleString()}</span></div>
      ${countdown}${vendorBtn}
    </div>`;
  });

  document.getElementById('ordersList').innerHTML=h;
  document.getElementById('oCount').innerText=allOrders.length;

  let totalEarnings=0; allOrders.forEach(o=> totalEarnings += o.items.reduce((s,i)=>s + i.price*i.qty, 0)*0.9);
  document.getElementById('wallet').innerText='₦'+Math.round(totalEarnings).toLocaleString();
  document.getElementById('walletBig').innerText='₦'+Math.round(totalEarnings).toLocaleString();

  const now=new Date(); const startDay=new Date(now); startDay.setHours(0,0,0,0);
  const startWeek=new Date(now); startWeek.setDate(now.getDate()-7);
  const startMonth=new Date(now); startMonth.setDate(1); startMonth.setHours(0,0,0,0);
  let t=0,w=0,m=0;
  allOrders.forEach(o=>{
    const d=new Date(o.created_at); const earn= o.items.reduce((s,i)=>s + i.price*i.qty, 0)*0.9;
    if(d>=startDay) t+=earn;
    if(d>=startWeek) w+=earn;
    if(d>=startMonth) m+=earn;
  });
  document.getElementById('salesToday').innerText='₦'+Math.round(t).toLocaleString();
  document.getElementById('salesWeek').innerText='₦'+Math.round(w).toLocaleString();
  document.getElementById('salesMonth').innerText='₦'+Math.round(m).toLocaleString();
}

async function startDelivery(id, customerPhone){
  await supabaseClient.from('orders').update({ status: 'on the way', delivery_started_at: new Date().toISOString() }).eq('id',id);
  sendWhatsApp(customerPhone, id); loadOrders();
}

function sendWhatsApp(phone, orderId){
  if(!phone) return;
  let msg = `Hi! Your LGM Order #${orderId} is On The Way 🚚 Delivery within 2 hours from ${curUser.full_name || curUser.name}.`;
  let formattedPhone = phone.startsWith('0')? '234' + phone.slice(1) : phone;
  window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function loadWallet(){
  const {data} = await supabaseClient.from('withdrawals').select('*').eq('vendor_email', curUser.email).order('created_at',{ascending:false});
  let h='<b>Withdrawal History:</b><br>';
  data?.forEach(w=> h+=`₦${Number(w.amount).toLocaleString()} - ${w.status} - ${new Date(w.created_at).toLocaleDateString()}<br>`);
  document.getElementById('withdrawHistory').innerHTML = h || 'No withdrawals yet';
}

async function requestWithdrawal(){
  const amount = document.getElementById('wAmount').value;
  const account = document.getElementById('wAccount').value;
  const bank = document.getElementById('wBank').value;
  if(!amount ||!account ||!bank) return alert('Fill all fields');
  await supabaseClient.from('withdrawals').insert({vendor_email:curUser.email, amount, account_number:account, bank_name:bank, status:'pending'});
  alert('Withdrawal request sent! Admin will approve in 24hrs');
  document.getElementById('wAmount').value=''; loadWallet();
}

async function saveProfile(){
  await supabaseClient.from('users').update({full_name: document.getElementById('profName').value}).eq('email', curUser.email);
  curUser.full_name = document.getElementById('profName').value;
  localStorage.setItem('lgm_user', JSON.stringify(curUser));
  alert('Profile Updated!'); init();
}
setInterval(loadOrders, 5000);
</script>
</body>
</html>
