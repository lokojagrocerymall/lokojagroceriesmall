<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard - Lokoja Grocery Mall</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background:#f5f5f5; }
  .container { max-width:900px; margin:20px auto; padding:20px; }
  .welcome { background:#16a34a; color:#fff; padding:20px; border-radius:12px; margin-bottom:20px; }
  .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05); margin-bottom:20px; }
  .btn { background:#16a34a; color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:700; cursor:pointer; width:100%; }
  .btn-secondary { background:#6b7280; }
  input, select { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin-top:8px; margin-bottom:15px; }
  .popup { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; }
  .popup-content { background:#fff; padding:30px; border-radius:12px; width:90%; max-width:400px; }
  .hidden { display:none; }
</style>
</head>
<body>

<!-- HEADER -->
<header style="background:#fff; padding:10px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); height:65px;">
  <div style="background:#16a34a; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;">
    <img src="./logo.png" alt="LGM" style="width:36px; height:36px; object-fit:contain;">
  </div>
  <span style="color:#111; font-size:18px; font-weight:900;">Vendor Dashboard</span>
</header>

<div class="container">
  <div class="welcome">
    <h2>Welcome, <span id="vendorName">Vendor</span>!</h2>
    <p>Manage your store and products</p>
  </div>

  <div class="card">
    <h3>My Products</h3>
    <button class="btn" onclick="showAddProduct()">+ Add New Product</button>
    <div id="productList" style="margin-top:15px;">No products yet</div>
  </div>

  <div class="card">
    <h3>Orders</h3>
    <p style="color:#6b7280;">0 orders</p>
  </div>
</div>

<!-- BANK DETAILS POPUP - SHOWS FIRST IF NOT COMPLETED -->
<div id="bankPopup" class="popup hidden">
  <div class="popup-content">
    <h3>Complete Bank Details</h3>
    <p style="color:#6b7280; font-size:13px; margin-bottom:15px;">Required to receive payments via Flutterwave</p>
    <form id="bankForm">
      <label>Account Name</label>
      <input type="text" id="accountName" required>
      
      <label>Account Number</label>
      <input type="number" id="accountNumber" required>
      
      <label>Bank</label>
      <select id="bankCode" required>
        <option value="">Select Bank</option>
        <option value="044">Access Bank</option>
        <option value="011">First Bank</option>
        <option value="057">Zenith Bank</option>
        <option value="058">GTBank</option>
      </select>
      
      <button type="submit" class="btn">Save & Activate Store</button>
    </form>
  </div>
</div>

<script>
let currentVendor = JSON.parse(localStorage.getItem('currentUser'));
let allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];

if(!currentVendor || currentVendor.role !== 'Vendor') {
  alert('Please login as vendor');
  window.location.href = 'login.html';
}

document.getElementById('vendorName').innerText = currentVendor.name;

// CHECK IF BANK DETAILS COMPLETED
if(currentVendor.status === 'approved' && !currentVendor.account_number) {
  document.getElementById('bankPopup').classList.remove('hidden');
}

document.getElementById('bankForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  // Save bank details to vendor
  currentVendor.account_name = document.getElementById('accountName').value;
  currentVendor.account_number = document.getElementById('accountNumber').value;
  currentVendor.bank_code = document.getElementById('bankCode').value;
  
  // Update in allUsers
  allUsers = allUsers.map(u => u.id == currentVendor.id ? currentVendor : u);
  localStorage.setItem('allUsers', JSON.stringify(allUsers));
  localStorage.setItem('currentUser', JSON.stringify(currentVendor));
  
  alert('Bank details saved! Your store is now active.');
  document.getElementById('bankPopup').classList.add('hidden');
});

function showAddProduct() {
  if(!currentVendor.account_number) {
    alert('Please complete bank details first');
    document.getElementById('bankPopup').classList.remove('hidden');
    return;
  }
  alert('Add Product form coming next');
}
</script>

</body>
</html>
