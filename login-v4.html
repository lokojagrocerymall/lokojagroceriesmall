<!DOCTYPE html>
<html><head><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-full max-w-sm">
<h1 class="text-2xl font-bold text-center text-green-700 mb-4">LGM Login V4 Debug</h1>
<input id="email" value="agbemjames@gmail.com" class="w-full border p-3 rounded-lg mb-3">
<input id="password" value="test123" class="w-full border p-3 rounded-lg mb-4">
<button id="loginBtn" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Login</button>
<pre id="status" class="text-xs mt-3 bg-gray-100 p-2 rounded"></pre>
</div>
<script>
const { createClient } = supabase;
const supabaseClient = createClient("https://yhfxmrpqaccbllszoxyf.supabase.co","sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9");
document.getElementById('loginBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.innerText = "Logging in...";
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email.value, password: password.value });
  if(error) { status.innerText = "AUTH ERROR: " + JSON.stringify(error, null, 2); return; }
  status.innerText += "\nAuth OK. UserID: " + data.user.id;
  const { data: profile, error: dbError } = await supabaseClient.from('users').select('*').eq('auth_user_id', data.user.id).single();
  if(dbError) { status.innerText += "\nDB ERROR: " + JSON.stringify(dbError, null, 2); return; }
  status.innerText += "\nSUCCESS: " + JSON.stringify(profile);
});
</script></body></html>
