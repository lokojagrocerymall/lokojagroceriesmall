<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGM Login V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-full max-w-sm">
  <h1 class="text-2xl font-bold text-center text-green-700 mb-4">LGM Login V2</h1>
  <input id="email" type="email" placeholder="Email" value="agbemjames@gmail.com" class="w-full border p-3 rounded-lg mb-3">
  <input id="password" type="password" placeholder="Password" value="Ganaja" class="w-full border p-3 rounded-lg mb-4">
  <button id="loginBtn" class="w-full bg-green-600 text-white py-3 rounded-full font-bold">Login</button>
  <p id="status" class="text-sm mt-3 text-center"></p>
</div>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://yhfxmrpqaccbllszoxyf.supabase.co",
  "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9"
);

document.getElementById('loginBtn').addEventListener('click', async () => {
  const btn = document.getElementById('loginBtn');
  const status = document.getElementById('status');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  btn.disabled = true;
  btn.innerText = "Logging in...";
  status.className = "text-blue-500 text-sm mt-3 text-center";
  status.innerText = "1. Checking password...";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    
    status.innerText = "2. Loading profile...";
    const { data: profile, error: pError } = await supabaseClient
      .from('users')
      .select('*')
      .eq('auth_user_id', data.user.id)
      .single();
    if (pError) throw pError;

    status.className = "text-green-500 text-sm mt-3 text-center";
    status.innerText = "3. Success! Redirecting to " + profile.role;
    localStorage.setItem('lgm_user', JSON.stringify(profile));

    setTimeout(() => {
      if(profile.role === 'admin') window.location.href = 'admin-dashboard.html';
      else if(profile.role === 'vendor') window.location.href = 'vendor-dashboard.html';
      else if(profile.role === 'delivery' || profile.role === 'agent') window.location.href = 'delivery-dashboard.html';
      else window.location.href = 'customer-dashboard.html';
    }, 1000);

  } catch (err) {
    status.className = "text-red-500 text-sm mt-3 text-center";
    status.innerText = "ERROR: " + err.message;
    btn.disabled = false;
    btn.innerText = "Login";
  }
});
</script>
</body></html>
