<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Login</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
  <h1 class="text-2xl font-bold text-center text-green-700 mb-6">🚚 Delivery Login</h1>
  <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded-lg mb-3">
  <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4">
  <button onclick="login()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Login</button>
  <p id="error" class="text-red-500 text-sm mt-3 text-center"></p>
</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const { data:user, error } = await supabaseClient.from('delivery_users').select('*').eq('email',email).single();
  if(error || !user || user.password !== password){ document.getElementById('error').innerText='Invalid login'; return; }
  localStorage.setItem('delivery_user', JSON.stringify(user));
  alert('Login Successful! Role: delivery');
  location.href='delivery-dashboard.html';
}
</script></body></html>
