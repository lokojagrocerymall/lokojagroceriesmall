<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Dashboard</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100">
<header class="bg-white p-4 shadow flex justify-between items-center sticky top-0 z-10">
  <b class="text-green-700">🚚 Delivery Dashboard</b>
  <button onclick="localStorage.removeItem('lgm_user'); location.href='index.html';" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>
<div class="p-4 max-w-2xl mx-auto">
  <div class="bg-white p-3 rounded-xl mb-4">
    <p class="text-sm">Welcome, <b id="name"></b></p>
    <p class="text-xs text-gray-400">Email: <span id="email"></span></p>
  </div>

  <div id="riderStats"></div>

  <h2 class="font-bold mb-3">Available Orders + My Active Deliveries</h2>
  <div id="orders" class="mb-6">Loading...</div>

  <h2 class="font-bold mb-3 text-gray-600">Completed Deliveries - Last 7 Days</h2>
  <div id="completed">Loading...</div>
</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let curUser = JSON.parse(localStorage.getItem('lgm_user')||'null');
if(!curUser ||!curUser.email || String(curUser.role).toLowerCase().trim()!=='delivery_agent'){
  alert('Access Denied. Please login as Delivery Agent');
  location.href='index.html';
}
document.getElementById('name').innerText = curUser.name || curUser.email;
document.getElementById('email').innerText = curUser.email;

const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
let isCalling = false;
let ordersCache = [];

function formatCountdown(startTime){
  if(!startTime) return '';
  const end = new Date(startTime).getTime() + TWO_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return '<span class="text-red-600 font-bold">TIME UP! CALL ADMIN</span>';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return `<span class="text-red-600 font-bold">${h}h ${m}m ${s}s</span>`;
}

function formatPickedUpTime(startTime){
  if(!startTime) return '';
  return new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
}

async function loadRiderStats(){
  try{
    const {data} = await supabaseClient.from('orders')
   .select('customer_rating')
   .eq('delivery_agent_email', curUser.email)
   .eq('status', 'delivered')
   .not('customer_rating', 'is', null);
    const ratings = data?.map(d=>d.customer_rating) || [];
    const avg = ratings.length > 0? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '0';
    document.getElementById('riderStats').innerHTML = `
      <div class="bg-yellow-50 p-3 rounded-xl shadow mb-4 text-center border-yellow-200">
        <p class="text-xs text-gray-600">Your Performance</p>
        <p class="text-3xl font-bold text-yellow-600">${avg}⭐</p>
        <p class="text-xs text-gray-500">${ratings.length} Customer Reviews</p>
      </div>
    `;
  }catch(e){ console.log(e) }
}

async function fetchOrders(){
  try{
    // RULE 1: AVAILABLE ORDERS = MUST BE PAID AND payment_status=true AND no agent picked yet
    const { data:availableOrders } = await supabaseClient.from('orders')
   .select('*')
   .eq('status','paid')
   .eq('payment_status', true) // CRITICAL FIX: ONLY PAID ORDERS
   .is('delivery_agent_email', null)
   .order('created_at',{ascending:false});

    // RULE 2: MY ACTIVE ORDERS = status=on the way AND assigned to ME
    const { data:myActive } = await supabaseClient.from('orders')
   .select('*')
   .eq('status','on the way')
   .eq('delivery_agent_email', curUser.email)
   .order('created_at',{ascending:false});

    const orderMap = new Map();
    [...(availableOrders||[]),...(myActive||[])].forEach(o => orderMap.set(o.id, o));
    ordersCache = Array.from(orderMap.values());
  }catch(e){ console.log(e) }
}

function renderOrders(){
  if(!ordersCache || ordersCache.length===0){
    document.getElementById('orders').innerHTML='<p class="text-center text-gray-400 py-8">No active orders</p>';
    return;
  }

  document.getElementById('orders').innerHTML = ordersCache.map(o=>{
    const addr = o.customer_address || o.address || 'N/A';
    // CASE 1: AVAILABLE ORDER - ANY AGENT CAN PICK
    if(o.status === 'paid' &&!o.delivery_agent_email){
      return `<div class="bg-white p-4 rounded-xl shadow mb-3 border-2 border-green-400">
        <div class="flex justify-between items-center"><h3 class="font-bold">Order #${o.id}</h3><b class="text-green-700">₦${Number(o.total).toLocaleString()}</b></div>
        <div class="mt-2 p-2 bg-gray-50 rounded-lg">
          <p class="text-sm font-bold">👤 ${o.customer_name}</p>
          <p class="text-xs">📞 ${o.customer_phone}</p>
          <p class="text-xs">🏠 ${addr}</p>
        </div>
        <button onclick="pickup('${o.id}')" class="mt-2 w-full bg-green-600 text-white py-2 rounded-lg font-bold">🚚 Pick Up Order - Start 2HR Timer</button>
      </div>`;
    }

    // CASE 2: MY ACTIVE ORDER - ONLY ME CAN SEE
    else {
      return `<div class="bg-white p-4 rounded-xl shadow mb-3 border-2 border-orange-400" id="order-${o.id}">
        <div class="flex justify-between items-center"><h3 class="font-bold">Order #${o.id}</h3><b class="text-green-700">₦${Number(o.total).toLocaleString()}</b></div>
        <div class="mt-2 p-2 bg-gray-50 rounded-lg">
          <p class="text-sm font-bold">👤 ${o.customer_name}</p>
          <p class="text-xs">📞 ${o.customer_phone}</p>
          <p class="text-xs">🏠 ${addr}</p>
        </div>

        <div class="bg-orange-50 p-2 rounded-lg mt-2 text-center">
          <p class="text-xs text-gray-600 font-bold">YOU ARE DELIVERING THIS</p>
          <p class="text-xs text-gray-500">Picked up at: ${formatPickedUpTime(o.delivery_started_at)}</p>
          <b>⏰ Time Left:</b> <span class="countdown" data-start="${o.delivery_started_at}">${formatCountdown(o.delivery_started_at)}</span>
        </div>
        <a href="tel:${o.customer_phone}" onmousedown="isCalling=true" onmouseup="isCalling=false" class="mt-2 block w-full text-center bg-blue-600 text-white py-2 rounded-lg font-bold">📞 Call Customer</a>
        <div class="mt-2 p-2 bg-blue-50 rounded-lg text-center border-blue-200">
          <p class="text-xs text-blue-700 font-bold">Waiting for Customer to Confirm Delivery</p>
        </div>
      </div>`;
    }
  }).join('');
}

async function loadCompleted(){
  try{
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const { data:completed } = await supabaseClient.from('orders')
   .select('*')
   .eq('status','delivered')
   .eq('delivery_agent_email', curUser.email)
   .gte('delivered_at', sevenDaysAgo.toISOString())
   .order('delivered_at',{ascending:false});
    if(!completed || completed.length===0){ document.getElementById('completed').innerHTML='<p class="text-center text-gray-400 py-4">No completed deliveries yet</p>'; }
    else {
      document.getElementById('completed').innerHTML = completed.map(o=>{
        const deliveredDate = new Date(o.delivered_at).toLocaleString();
        const stars = o.customer_rating? '⭐'.repeat(o.customer_rating) : 'No rating yet';
        return `<div class="bg-white p-3 rounded-xl shadow mb-2 border-gray-200 opacity-90">
          <div class="flex justify-between"><h3 class="font-bold text-sm">Order #${o.id}</h3><b class="text-green-700 text-sm">₦${Number(o.total).toLocaleString()}</b></div>
          <p class="text-xs"><b>Customer:</b> ${o.customer_name}</p>
          <p class="text-xs text-gray-500"><b>Delivered:</b> ${deliveredDate}</p>
          <p class="text-xs text-yellow-600 font-bold mt-1">${stars}</p>
        </div>`;
      }).join('');
    }
  }catch(e){ console.log(e) }
}

async function loadOrders(){
  await loadRiderStats();
  await fetchOrders();
  renderOrders();
  await loadCompleted();
}

async function pickup(id){
  // ATOMIC UPDATE: Only pick if it's still available
  const { data, error } = await supabaseClient.from('orders').update({
    status:'on the way',
    delivery_started_at:new Date().toISOString(),
    delivery_agent_email: curUser.email,
    delivery_agent_name: curUser.name || curUser.email.split('@')[0]
  }).eq('id',id).eq('status','paid').is('delivery_agent_email', null).select();

  if(error ||!data || data.length === 0) alert('ERROR: This order was just picked by another agent');
  else {
    alert('Order picked up! 2 Hour countdown started.');
    loadOrders();
  }
}

function logout(){ localStorage.removeItem('lgm_user'); location.href='index.html'; }

loadOrders();

setInterval(()=>{
  document.querySelectorAll('.countdown').forEach(el => {
    el.innerHTML = formatCountdown(el.dataset.start);
  });
}, 1000);

setInterval(()=>{
  if(!isCalling) fetchOrders().then(renderOrders).then(loadCompleted);
}, 10000);
</script></body></html>
