<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Dashboard</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @keyframes pulse-red {0%,100%{background:#fee2e2;border-color:#ef4444}50%{background:#fecaca;border-color:#dc2626}}
  @keyframes timer-pulse {0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.alert-card{animation:pulse-red 1s infinite;border:2px solid #ef4444!important}
.badge{background:#ef4444;color:white;font-size:10px;padding:2px 6px;border-radius:9999px;margin-left:4px;font-weight:900}
</style>
</head>
<body class="bg-gray-100">
<header class="bg-white p-4 shadow flex justify-between items-center sticky top-0 z-10">
  <b class="text-green-700">🚚 Delivery Dashboard</b>
  <button onclick="localStorage.removeItem('lgm_user'); location.href='index.html';" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</header>
<div class="p-4 max-w-2xl mx-auto">
  <div class="bg-white p-3 rounded-xl mb-4">
    <p class="text-sm">Welcome, <b id="name">Loading...</b></p>
    <p class="text-xs text-gray-600 font-bold">WhatsApp: <span id="phone">Loading...</span></p>
    <p class="text-[10px] text-gray-400">Email: <span id="email"></span></p>
  </div>

  <div id="riderStats"></div>

  <h2 class="font-bold mb-3">Available Orders + My Active Deliveries <span id="orderBadge"></span></h2>
  <div id="orders" class="mb-6">Loading...</div>

  <h2 class="font-bold mb-3 text-gray-600">Completed Deliveries - Last 7 Days</h2>
  <div id="completed">Loading...</div>
</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let curUser = JSON.parse(localStorage.getItem('lgm_user')||'null');
if(!curUser ||!curUser.email || String(curUser.role).toLowerCase().trim()!=='delivery_agent'){
  alert('Access Denied. Please login as Delivery Agent');
  location.href='index.html';
}

const TWO_HOURS_MS = 3 * 60 * 60 * 1000;
let isCalling = false;
let ordersCache = [];
let lastAvailableCount = 0;
let agentProfile = null;

// === FIX: SEPARATE FULL NAME AS FILLED IN SIGNUP ===
function formatSeparatedName(raw){
  if(!raw) return '';
  let s = String(raw).trim().replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2');
  s = s.split(/\s+/).filter(Boolean).map(w=> w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  return s;
}

async function loadAgentProfile(){
  try{
    const {data} = await supabaseClient.from('users')
    .select('*')
    .eq('email', curUser.email)
    .single();

    if(data){
      agentProfile = data;
      let rawName = data.full_name || [data.first_name, data.middle_name, data.last_name].filter(Boolean).join(' ') || curUser.name || curUser.email.split('@')[0];
      const fullName = formatSeparatedName(rawName);
      const waNumber = data.phone || data.whatsapp || curUser.phone || 'No number';

      document.getElementById('name').innerText = fullName;
      document.getElementById('phone').innerText = waNumber;
      document.getElementById('email').innerText = data.email;

      // Save for pickup
      curUser.name = fullName;
      curUser.phone = waNumber;
      localStorage.setItem('lgm_user', JSON.stringify(curUser));
    } else {
      document.getElementById('name').innerText = formatSeparatedName(curUser.name || curUser.email);
      document.getElementById('phone').innerText = curUser.phone || 'No number';
      document.getElementById('email').innerText = curUser.email;
    }
  }catch(e){
    console.log(e);
    document.getElementById('name').innerText = formatSeparatedName(curUser.name || curUser.email);
    document.getElementById('email').innerText = curUser.email;
  }
}

// === BOLD VISIBLE TIMER FOR DELIVERY ===
function formatCountdown(startTime){
  if(!startTime) return '<span style="font-size:22px;font-weight:900;color:#ea580c">⏰ Timer starting...</span>';
  const end = new Date(startTime).getTime() + TWO_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return '<span style="font-size:22px;font-weight:900;color:#dc2626;background:#fee2e2;padding:4px 10px;border-radius:8px">❌ TIME UP! CALL ADMIN</span>';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return `<span style="font-size:32px;font-weight:900;color:#dc2626;letter-spacing:1px;animation:timer-pulse 1s infinite">${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</span>`;
}

function formatPickedUpTime(startTime){
  if(!startTime) return '';
  return new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
}

function triggerAlert(msg){
  new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

async function loadRiderStats(){
  try{
    const {data} = await supabaseClient.from('orders')
.select('customer_rating')
.eq('delivery_agent_email', curUser.email)
.eq('status', 'delivered')
.not('customer_rating', 'is', null);
    const ratings = data?.map(d=>d.customer_rating) || [];
    const avg = ratings.length > 0? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '0';
    document.getElementById('riderStats').innerHTML = `
      <div class="bg-yellow-50 p-3 rounded-xl shadow mb-4 text-center border-yellow-200">
        <p class="text-xs text-gray-600">Your Performance</p>
        <p class="text-3xl font-bold text-yellow-600">${avg}⭐</p>
        <p class="text-xs text-gray-500">${ratings.length} Customer Reviews</p>
      </div>
    `;
  }catch(e){ console.log(e) }
}

async function fetchOrders(){
  try{
    const { data:availableOrders } = await supabaseClient.from('orders')
.select('*')
.eq('status','paid')
.eq('payment_status', true)
.is('delivery_agent_email', null)
.order('created_at',{ascending:false});

    if(availableOrders.length > lastAvailableCount && lastAvailableCount!== 0){
      triggerAlert(`🚨 New Order #${availableOrders[0].id} is Available!`);
    }
    lastAvailableCount = availableOrders.length;
    document.getElementById('orderBadge').innerHTML = availableOrders.length > 0? `<span class="badge">${availableOrders.length}</span>` : '';

    const { data:myActive } = await supabaseClient.from('orders')
.select('*')
.eq('status','on the way')
.eq('delivery_agent_email', curUser.email)
.order('created_at',{ascending:false});

    const orderMap = new Map();
    [...(availableOrders||[]),...(myActive||[])].forEach(o => orderMap.set(o.id, o));
    ordersCache = Array.from(orderMap.values());
  }catch(e){ console.log(e) }
}

function renderOrders(){
  if(!ordersCache || ordersCache.length===0){
    document.getElementById('orders').innerHTML='<p class="text-center text-gray-400 py-8">No active orders</p>';
    return;
  }

  document.getElementById('orders').innerHTML = ordersCache.map(o=>{
    const addr = o.customer_address || o.address || 'N/A';
    if(o.status === 'paid' &&!o.delivery_agent_email){
      return `<div class="bg-white p-4 rounded-xl shadow mb-3 border-2 border-green-400 alert-card">
        <div class="flex justify-between items-center"><h3 class="font-bold">Order #${o.id}</h3><b class="text-green-700">₦${Number(o.total).toLocaleString()}</b></div>
        <div class="mt-2 p-2 bg-gray-50 rounded-lg">
          <p class="text-sm font-bold">👤 ${o.customer_name}</p>
          <p class="text-xs">📞 ${o.customer_phone}</p>
          <p class="text-xs">🏠 ${addr}</p>
        </div>
        <button onclick="pickup('${o.id}')" class="mt-2 w-full bg-green-600 text-white py-2 rounded-lg font-bold">🚚 Pick Up Order - Start 2HR Timer</button>
      </div>`;
    }
    else {
      return `<div class="bg-white p-4 rounded-xl shadow mb-3 border-2 border-orange-400" id="order-${o.id}">
        <div class="flex justify-between items-center"><h3 class="font-bold">Order #${o.id}</h3><b class="text-green-700">₦${Number(o.total).toLocaleString()}</b></div>
        <div class="mt-2 p-2 bg-gray-50 rounded-lg">
          <p class="text-sm font-bold">👤 ${o.customer_name}</p>
          <p class="text-xs">📞 ${o.customer_phone}</p>
          <p class="text-xs">🏠 ${addr}</p>
        </div>

        <div style="background:linear-gradient(135deg,#ffffff,#fef3c7);border:3px solid #f59e0b;padding:16px;border-radius:16px;margin-top:12px;text-align:center;box-shadow:0 6px 20px rgba(245,158,11,0.35)">
          <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:#92400e;background:#fde68a;display:inline-block;padding:3px 12px;border-radius:20px">⏰ YOU ARE DELIVERING - TIME LEFT</div>
          <div style="margin-top:8px"><span class="countdown" data-start="${o.delivery_started_at}">${formatCountdown(o.delivery_started_at)}</span></div>
          <div style="font-size:12px;font-weight:800;color:#78350f;margin-top:6px">Picked at: ${formatPickedUpTime(o.delivery_started_at)} • Deliver before fail!</div>
        </div>

        <a href="tel:${o.customer_phone}" onmousedown="isCalling=true" onmouseup="isCalling=false" class="mt-3 block w-full text-center bg-blue-600 text-white py-2 rounded-lg font-bold">📞 Call Customer</a>
        <div class="mt-2 p-2 bg-blue-50 rounded-lg text-center border-blue-200">
          <p class="text-xs text-blue-700 font-bold">Waiting for Customer to Confirm Delivery</p>
        </div>
      </div>`;
    }
  }).join('');
}

async function loadCompleted(){
  try{
    const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000);
    const { data:completed } = await supabaseClient.from('orders')
     .select('*')
     .eq('status','delivered')
     .eq('delivery_agent_email', curUser.email)
     .order('updated_at',{ascending:false})
     .limit(100);
    let filtered = (completed||[]).filter(o=>{
      const d = o.delivered_at || o.updated_at || o.created_at;
      return new Date(d) >= sevenDaysAgo;
    });
    if(!filtered || filtered.length===0){
      document.getElementById('completed').innerHTML='<p class="text-center text-gray-400 py-4">No completed deliveries yet</p>';
    } else {
      document.getElementById('completed').innerHTML = filtered.map(o=>{
        const deliveredDate = new Date(o.delivered_at || o.updated_at || o.created_at).toLocaleString();
        const stars = o.customer_rating? '⭐'.repeat(o.customer_rating) : 'No rating yet';
        return `<div class="bg-white p-3 rounded-xl shadow mb-2"><div class="flex justify-between"><h3 class="font-bold text-sm">Order #${o.id}</h3><b class="text-green-700 text-sm">₦${Number(o.total).toLocaleString()}</b></div><p class="text-xs"><b>Customer:</b> ${o.customer_name}</p><p class="text-xs text-gray-500"><b>Delivered:</b> ${deliveredDate}</p><p class="text-xs text-yellow-600 font-bold mt-1">${stars}</p></div>`;
      }).join('');
    }
  }catch(e){ console.log(e) }
}

async function loadOrders(){
  await loadRiderStats();
  await fetchOrders();
  renderOrders();
  await loadCompleted();
}

async function pickup(id){
  let rawName = agentProfile?.full_name || [agentProfile?.first_name, agentProfile?.middle_name, agentProfile?.last_name].filter(Boolean).join(' ') || curUser.name || curUser.email.split('@')[0];
  const realName = formatSeparatedName(rawName);
  const realPhone = agentProfile?.phone || agentProfile?.whatsapp || curUser.phone || '';

  const { data, error } = await supabaseClient.from('orders').update({
    status:'on the way',
    delivery_started_at:new Date().toISOString(),
    picked_at:new Date().toISOString(),
    delivery_agent_email: curUser.email,
    delivery_agent_name: realName,
    delivery_agent_phone: realPhone
  }).eq('id',id).eq('status','paid').is('delivery_agent_email', null).select();

  if(error ||!data || data.length === 0) alert('ERROR: This order was just picked by another agent');
  else {
    alert('Order picked up! 3 Hour countdown started.');
    loadOrders();
  }
}

function logout(){ localStorage.removeItem('lgm_user'); location.href='index.html'; }

loadAgentProfile().then(()=> loadOrders());

setInterval(()=>{
  document.querySelectorAll('.countdown').forEach(el => {
    el.innerHTML = formatCountdown(el.dataset.start);
  });
}, 1000);

setInterval(()=>{
  if(!isCalling) fetchOrders().then(renderOrders).then(loadCompleted);
}, 10000);
</script></body></html>
