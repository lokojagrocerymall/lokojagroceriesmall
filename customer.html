<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Lokoja Grocery Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#f8fafc;font-family:system-ui}</style>
</head>
<body>
<header class="bg-green-600 text-white p-4 flex justify-between items-center sticky top-0">
  <b onclick="location.href='index.html'" class="cursor-pointer">🛒 Lokoja Grocery Mall</b>
  <button onclick="logout()" class="bg-white text-green-600 px-3 py-1 rounded-full text-sm font-bold">Logout</button>
</header>

<div class="max-w-lg mx-auto p-4">
  <div class="bg-white rounded-2xl p-5 shadow mb-4">
    <h2 class="font-black text-lg">Welcome, <span id="cName">Customer</span> 👋</h2>
    <p id="cEmail" class="text-sm text-gray-500"></p>
    <p id="cPhone" class="text-sm text-gray-500"></p>
    <div class="grid grid-cols-3 gap-3 mt-4 text-center">
      <div class="bg-green-50 p-3 rounded-xl"><div class="font-black text-green-600 text-xl" id="totalOrders">0</div><div class="text-xs">Orders</div></div>
      <div class="bg-blue-50 p-3 rounded-xl"><div class="font-black text-blue-600 text-xl" id="totalSpent">₦0</div><div class="text-xs">Spent</div></div>
      <div class="bg-orange-50 p-3 rounded-xl"><div class="font-black text-orange-600 text-xl">Lokoja</div><div class="text-xs">Delivery</div></div>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-black">My Orders</h3>
      <button onclick="location.href='browse.html'" class="text-green-600 text-sm font-bold">+ Shop Again</button>
    </div>
    <div id="ordersList" class="space-y-3">Loading orders...</div>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow mt-4">
    <h3 class="font-black mb-2">Quick Actions</h3>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="location.href='browse.html'" class="bg-green-600 text-white p-3 rounded-xl font-bold">🛒 Browse Market</button>
      <button onclick="location.href='cart.html'" class="bg-gray-900 text-white p-3 rounded-xl font-bold">🛍️ View Cart</button>
    </div>
  </div>
</div>

<script>
// NEW LGM-PRODUCTION KEYS
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let curUser = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!curUser.email){ location.href='login.html'; }
if(curUser.role && curUser.role!=='customer'){ 
  // redirect non-customers
  if(curUser.role==='vendor') location.href='vendor.html';
  if(curUser.role==='admin') location.href='admin.html';
}

document.getElementById('cName').innerText = curUser.name || curUser.full_name || 'Customer';
document.getElementById('cEmail').innerText = curUser.email;
document.getElementById('cPhone').innerText = curUser.phone || '';

async function loadOrders(){
  const { data, error } = await supabaseClient.from('orders').select('*').eq('customer_email', curUser.email).order('created_at',{ascending:false});
  if(error){ document.getElementById('ordersList').innerText='No orders yet - '+error.message; return; }
  if(!data || data.length===0){ document.getElementById('ordersList').innerHTML='<p class="text-center text-sm text-gray-400 py-6">No orders yet.<br><a href="browse.html" class="text-green-600 font-bold">Start shopping now!</a></p>'; return; }
  
  let total=0;
  data.forEach(o=> total+= Number(o.total_amount||0));
  document.getElementById('totalOrders').innerText = data.length;
  document.getElementById('totalSpent').innerText = '₦'+total.toLocaleString();

  let html='';
  data.forEach(o=>{
    let statusColor = o.status==='delivered'?'bg-green-100 text-green-700': o.status==='out_for_delivery'?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700';
    html+=`<div class="border rounded-xl p-3">
      <div class="flex justify-between"><b class="text-sm">Order #${o.id}</b><span class="text-xs px-2 py-1 rounded-full ${statusColor}">${o.status||'pending'}</span></div>
      <div class="text-xs text-gray-500 mt-1">${new Date(o.created_at).toLocaleString()} • ₦${Number(o.total_amount||0).toLocaleString()}</div>
      <div class="text-xs mt-2">${o.items? JSON.stringify(o.items).substring(0,120)+'...' : ''}</div>
    </div>`;
  });
  document.getElementById('ordersList').innerHTML=html;
}

function logout(){ localStorage.removeItem('lgm_user'); location.href='login.html'; }

loadOrders();
</script>
</body>
</html>
