<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Dashboard - Lokoja Grocery Mall</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
h1{color:#16a34a;margin:0}
h2{color:#16a34a;font-size:18px;margin:0 0 12px 0}
.btn{background:#ef4444;color:#fff;padding:10px 16px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
.btn-shop{background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;width:100%;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1>Lokoja Grocery Mall</h1>
  <button class="btn" onclick="logout()">Logout</button>
</div>

<div class="card">
  <h2 id="welcome">Welcome!</h2>
  <p id="userInfo"></p>
</div>

<div class="card">
  <h2>Quick Actions</h2>
  <button class="btn-shop" onclick="location.href='/browse.html'">🛒 Start Shopping</button>
  <button class="btn-shop" style="background:#f59e0b;margin-top:10px" onclick="location.href='/cart.html'">🛍️ View Cart</button>
  <button class="btn-shop" style="background:#3b82f6;margin-top:10px" onclick="location.href='/orders.html'">📦 My Orders</button>
</div>

<script>
// Check if user is logged in
const user = JSON.parse(localStorage.getItem('lgm_user'));
if(!user){ 
  location.href = '/login.html'; 
}

// Show user info
document.getElementById('welcome').innerText = 'Hello, ' + user.name + '!';
document.getElementById('userInfo').innerHTML = 
  '<b>Email:</b> ' + user.email + '<br>' +
  '<b>Role:</b> ' + user.role + '<br>' +
  '<b>Location:</b> ' + user.location;

function logout(){
  localStorage.removeItem('lgm_user');
  location.href = '/login.html';
}
</script>
</body>
</html>
