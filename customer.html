<body class="bg-gray-100">

    <button onclick="localStorage.removeItem('lgm_user'); location.href='index.html';" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>

  <div class="flex gap-4 mb-3 bg-white p-3 rounded-2xl shadow text-sm font-bold overflow-x-auto">

    <button onclick="showTab('cart')" id="tabCart" class="text-gray-400">🛍️ Cart (<span id="cartCount">0</span>)</button>
    <button onclick="showTab('orders')" id="tabOrders" class="text-gray-400">📦 My Orders</button>
  </div>

  <div id="view-shop" class="view">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">Loading products...</div>
  </div>

  <div id="view-cart" class="view hidden">
    <form onsubmit="payWithPaystack(event)" class="bg-white p-4 rounded-2xl shadow">
      <h3 class="font-bold mb-3">Your Cart</h3>
      <div id="cartList">Cart is empty</div>
      <div id="minOrderAlertCust" class="hidden mt-3 p-3 rounded-xl text-[13px] font-black text-center"></div>

      <div id="deliveryForm" class="border-t pt-3 mt-3 space-y-3 hidden">

          <input id="checkoutAddress" type="text" placeholder="House No, Street, Area" required class="w-full p-3 border rounded-lg mt-1">

        <div>

          <select id="checkoutLocation" onchange="toggleCustomLocation()" required class="w-full p-3 border rounded-lg mt-1 bg-white">

        </div>
        <div>
          <label class="text-sm font-semibold text-gray-700">WhatsApp Number</label>
          <input id="checkoutWhatsApp" type="tel" placeholder="080..." required class="w-full p-3 border rounded-lg mt-1">

        <div>
          <label class="text-sm font-semibold text-gray-700">Phone Number <span class="text-gray-400 text-xs">(If different from WhatsApp)</span></label>

function cleanPrice(p){ return Number(String(p).replace(/[^0-9]/g,'')) || 0; }

window.onload = async () => {
  const select = document.getElementById('checkoutLocation');
  LOKOJA_AREAS.forEach(area => {
    select.innerHTML += `<option value="${area}">${area}</option>`;
  });
  await syncCartFromSupabase();
  showTab('shop');
}

async function syncCartFromSupabase(){
  try{
    const userData = JSON.parse(localStorage.getItem('lgm_user')||'{}');
    if(!userData.id) return;
    const { data: dbCart } = await supabaseClient.from('carts').select('*').eq('customer_id', userData.id);
    if(dbCart && dbCart.length > 0){
      cart = dbCart.map(c => ({
        id: c.product_id,
        name: c.product_name,
        price: Number(c.product_price),
        image_url: c.product_image,
        image: c.product_image,
        vendor_email: c.vendor_email,
        vendor_id: c.vendor_id,
        qty: c.qty
      }));
      localStorage.setItem('lgm_cart', JSON.stringify(cart));
    } else if(cart.length > 0){
      for(let item of cart){
        await supabaseClient.from('carts').upsert({
          customer_id: userData.id,
          product_id: item.id,
          product_name: item.name,
          product_price: cleanPrice(item.price),
          product_image: item.image_url || item.image || '',
          vendor_id: item.vendor_id || null,
          vendor_email: item.vendor_email || null,
          qty: item.qty
        }, {onConflict: 'customer_id,product_id'});
      }
    }
    saveCart(false);
  }catch(e){ console.log("sync cart error:", e.message); saveCart(false); }
}

function toggleCustomLocation(){
  const val = document.getElementById('checkoutLocation').value;
  const customInput = document.getElementById('customLocation');
  if(val === 'Other'){
    customInput.classList.remove('hidden');
    customInput.required = true;
  } else {
    customInput.classList.add('hidden');
    customInput.required = false;
    customInput.value = '';
  }
}

function showTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.querySelectorAll('[id^=tab]').forEach(b=>{b.classList.remove('text-green-600','border-b-2','border-green-600'); b.classList.add('text-gray-400')});
  document.getElementById('view-'+t).classList.remove('hidden');
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('text-green-600','border-b-2','border-green-600');
  if(t==='orders'){
    document.getElementById('tabOrders').classList.remove('alert-tab');
    loadOrders();
  }
  if(t==='shop') loadProducts();
  if(t==='cart') { syncCartFromSupabase().then(()=>renderCart()); }
}

function formatCustomerCountdown(orderId, startTime){
  if(!startTime) return `<div class="customer-timer" data-order="${orderId}" data-start="${startTime}" style="background:#fff7ed;border:2px dashed #f97316;padding:12px;border-radius:14px;margin-top:12px;text-align:center;font-weight:900;color:#c2410c">⏰ Rider on the way - Timer starting...</div>`;
  const end = new Date(startTime).getTime() + TWO_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) {
    autoMarkFailed(orderId);
    return `<div class="customer-timer" data-order="${orderId}" data-start="${startTime}" style="background:#fee2e2;border:3px solid #dc2626;color:#dc2626;padding:16px;border-radius:14px;margin-top:12px;text-align:center;font-weight:900;font-size:15px">❌ DELIVERY TIME EXPIRED - FAILED</div>`;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const pickedUpTime = new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
  return `<div class="customer-timer" data-order="${orderId}" data-start="${startTime}" style="background:linear-gradient(135deg,#ffffff,#fef3c7);border:3px solid #f59e0b;padding:16px;border-radius:16px;margin-top:12px;text-align:center;box-shadow:0 6px 20px rgba(245,158,11,0.35)">
    <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:#92400e;background:#fde68a;display:inline-block;padding:3px 12px;border-radius:20px">⏰ DELIVERY COUNTDOWN</div>
    <div class="countdown-time" style="font-size:34px;font-weight:900;color:#dc2626;margin:8px 0;letter-spacing:1px;line-height:1">${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</div>
    <div style="font-size:12px;font-weight:800;color:#78350f">Picked at: ${pickedUpTime} • Auto-fail in 2hrs</div>
  </div>`;
}

function triggerAlert(msg){
  new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  if(Notification.permission === "granted"){
    new Notification("LGM Update", { body: msg });
  } else if(Notification.permission!== "denied"){
    Notification.requestPermission();
  }
}

async function autoMarkFailed(orderId){
  if(window.failedCalled?.[orderId]) return;
  window.failedCalled = window.failedCalled || {};
  window.failedCalled[orderId] = true;
  await supabaseClient.from('orders').update({ status: 'failed' }).eq('id', orderId);
  loadOrders();
}

  if(o.status!== 'delivered') return '';
  if(o.customer_rating){
    return `<div class="mt-2 p-2 bg-green-50 rounded-lg text-center">
      <p class="text-xs font-bold text-green-700">Thank you! You rated: ${'⭐'.repeat(o.customer_rating)}</p>
      ${o.customer_review? `<p class="text-xs text-gray-600 mt-1 italic">"${o.customer_review}"</p>` : ''}
    </div>`;
  } else {
    const savedRating = tempRating[o.id] || 0;
    return `<div class="mt-2 p-3 bg-yellow-50 rounded-lg border-yellow-200" onmouseleave="isUserInteracting=false">
      <p class="text-xs font-bold mb-2 text-center">Rate your delivery experience</p>
      <div class="flex justify-center gap-1 text-3xl" id="stars-${o.id}" onmouseenter="isUserInteracting=true">
        ${[1,2,3,4,5].map(i=>`<span data-rate="${i}" class="cursor-pointer ${i<=savedRating?'text-yellow-500':'text-gray-300'}">${i<=savedRating?'★':'☆'}</span>`).join('')}
      </div>
      <textarea id="review-${o.id}" onfocus="isUserInteracting=true" onblur="isUserInteracting=false" placeholder="Tell us about the rider..." class="w-full text-xs mt-2 p-2 border rounded"></textarea>
      <button onclick="submitRating(${o.id})" class="bg-green-600 text-white w-full mt-2 py-1.5 rounded-full text-xs font-bold">Submit Rating</button>
    </div>`;
  }
}

async function loadProducts(){
  const {data} = await supabaseClient.from('products').select('*').eq('is_approved', true);
  allProducts = data||[];
  try{
    const emails = [...new Set(allProducts.map(p=>p.vendor_email).filter(Boolean))];
    if(emails.length){
      const {data: vendors} = await supabaseClient.from('users').select('email,business_name,store_name,full_name').in('email', emails);
      (vendors||[]).forEach(v=>{
        vendorMap[v.email.toLowerCase()] = v.business_name || v.store_name || v.full_name || v.email;
      });
    }
  }catch(e){ console.log("vendor map error", e.message); }
  let html = '';
  allProducts.forEach(p=>{
    const businessName = vendorMap[(p.vendor_email||'').toLowerCase()] || p.business_name || p.store_name || 'LGM Vendor';
    const stockNum = Number(p.stock?? 50);
    let stockLabel = '';
    let btnHTML = '';
    let cardExtra = '';
    let badgeHTML = '';
    if(stockNum <= 0){
      stockLabel = `<span class="stock-out">❌ Out of Stock</span>`;
      btnHTML = `<button disabled class="w-full bg-gray-300 text-gray-500 py-1.5 rounded-full text-xs mt-2 font-bold cursor-not-allowed">Out of Stock</button>`;
      cardExtra = ' out-card';
      badgeHTML = `<div class="out-badge">OUT</div>`;
    } else if(stockNum <= 10){
      stockLabel = `<span class="stock-low">⚠️ Only ${stockNum} left!</span>`;
      btnHTML = `<button onclick="addToCart(${p.id})" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-1.5 rounded-full text-xs mt-2 font-bold">Add to Cart - ${stockNum} left</button>`;
    } else {
      stockLabel = `<span class="stock-ok">✅ ${stockNum} in stock</span>`;
      btnHTML = `<button onclick="addToCart(${p.id})" class="w-full bg-orange-500 text-white py-1.5 rounded-full text-xs mt-2">Add to Cart</button>`;
    }
    html += `<div class="bg-white p-3 rounded-2xl shadow relative${cardExtra}">
      <div class="relative">
        <img src="${p.image_url || p.image || 'https://placehold.co/200x200/e5e7eb/6b7280?text=No+Img'}" class="w-full h-32 object-cover rounded-lg mb-2">
        ${badgeHTML}
      </div>
      <b class="text-sm block truncate">${p.name}</b>
      <div class="text-xs text-green-700 font-bold">🏪 ${businessName}</div>
      <div class="mt-1">${stockLabel}</div>
      <div class="font-bold text-green-600 mt-1">₦${Number(p.price).toLocaleString()}</div>
      ${btnHTML}
    </div>`;
  });
  document.getElementById('productGrid').innerHTML = html || 'No products yet';
}

async function addToCart(id){
  const product = allProducts.find(p=>p.id===id);
  if(!product) return;
  const stockNum = Number(product.stock?? 50);
  if(stockNum <= 0){ alert('❌ Out of Stock - ' + product.name); return; }
  const existing = cart.find(i=>i.id===id);
  const currentQty = existing? Number(existing.qty)||0 : 0;
  if(currentQty + 1 > stockNum){
    alert(`⚠️ Only ${stockNum} left for ${product.name}! You already have ${currentQty} in cart.`);
    return;
  }
  if(existing) existing.qty++;
  else cart.push({...product, qty:1, stock: stockNum});
  saveCart(true);
  try{
    const u = JSON.parse(localStorage.getItem('lgm_user')||'{}');
    if(u.id){
      await supabaseClient.from('carts').upsert({
        customer_id: u.id,
        product_id: product.id,
        product_name: product.name,
        product_price: cleanPrice(product.price),
        product_image: product.image_url || product.image || '',
        vendor_id: product.vendor_id || null,
        vendor_email: product.vendor_email || null,
        qty: existing? existing.qty : 1
      }, {onConflict: 'customer_id,product_id'});
    }
  }catch(e){ console.log("cart db save error", e.message); }
  alert(product.name + ' added! ' + (stockNum - currentQty -1) + ' left');
}

function saveCart(syncCount = true){
  localStorage.setItem('lgm_cart', JSON.stringify(cart));
  document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+(Number(i.qty)||0),0);
}

async function updateQty(id, change){
  const item = cart.find(i=>i.id===id);
  if(!item) return;
  const product = allProducts.find(p=>p.id===id);
  const stockNum = Number(product?.stock?? item.stock?? 50);
  const newQty = (Number(item.qty)||1) + change;
  if(change > 0 && newQty > stockNum){
    alert(`⚠️ Only ${stockNum} in stock for ${item.name}`);
    return;
  }
  item.qty = newQty;
  if(item.qty <= 0) cart = cart.filter(i=>i.id!==id);
  saveCart();
  renderCart();
  try{
    const u = JSON.parse(localStorage.getItem('lgm_user')||'{}');
    if(u.id){
      if(item.qty <= 0){
        await supabaseClient.from('carts').delete().eq('customer_id', u.id).eq('product_id', id);
      } else {
        await supabaseClient.from('carts').update({qty: item.qty}).eq('customer_id', u.id).eq('product_id', id);
      }
    }
  }catch(e){}
}

async function removeItem(id){
  cart = cart.filter(i=>i.id!==id);
  saveCart();
  renderCart();
  try{
    const u = JSON.parse(localStorage.getItem('lgm_user')||'{}');
    if(u.id) await supabaseClient.from('carts').delete().eq('customer_id', u.id).eq('product_id', id);
  }catch(e){}
}

function renderCart(){
  saveCart();
  const alertBox = document.getElementById('minOrderAlertCust');
  const payBtn = document.getElementById('placeOrderBtn');
  if(cart.length===0){
    document.getElementById('cartList').innerHTML='Cart is empty';
    document.getElementById('subTotal').innerText='₦0';
    document.getElementById('deliveryFee').innerText='₦0';
    document.getElementById('cartTotal').innerText='₦0';
    const pa = document.getElementById('payAmount'); if(pa) pa.innerText='₦0';
    document.getElementById('deliveryForm').classList.add('hidden');
    document.getElementById('placeOrderBtn').classList.add('hidden');
    if(alertBox) alertBox.classList.add('hidden');
    return;
  }
  let html=''; let subtotal=0;
  let hasOutOfStock = false;
  cart.forEach(i=>{
    const unit = cleanPrice(i.price);
    const qty = Number(i.qty) || 1;
    subtotal += unit * qty;
    const prod = allProducts.find(p=>p.id===i.id);
    const stockNum = Number(prod?.stock?? 50);
    let stockWarn = '';
    if(stockNum <=0 || qty > stockNum){ hasOutOfStock = true; stockWarn = `<div class="text-[10px] text-red-600 font-black">❌ Only ${stockNum} left! Reduce qty</div>`; }
    else if(stockNum <=10){ stockWarn = `<div class="text-[10px] text-orange-600 font-bold">⚠️ Only ${stockNum} left in stock</div>`; }
    html += `<div class="flex items-center justify-between py-3 border-b">
      <div class="flex-1">
        <div class="font-semibold text-sm">${i.name}</div>
        <div class="text-green-600 font-bold">₦${unit.toLocaleString()} x ${qty}</div>
        ${stockWarn}
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="updateQty(${i.id}, -1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button>
        <span class="font-bold w-6 text-center">${qty}</span>
        <button type="button" onclick="updateQty(${i.id}, 1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">+</button>
      </div>
      <button type="button" onclick="removeItem(${i.id})" class="text-red-500 font-bold ml-2">✕</button>
      <div class="font-bold ml-2">₦${(unit*qty).toLocaleString()}</div>
    </div>`;
  });

  const delivery = Math.round(subtotal * 0.05);
  const total = subtotal + delivery;

  document.getElementById('cartList').innerHTML=html;
  document.getElementById('subTotal').innerText='₦'+subtotal.toLocaleString();
  document.getElementById('deliveryFee').innerText='₦'+delivery.toLocaleString();
  document.getElementById('cartTotal').innerText='₦'+total.toLocaleString();
  const payAmountEl = document.getElementById('payAmount');
  if(payAmountEl) payAmountEl.innerText='₦'+total.toLocaleString();
  document.getElementById('deliveryForm').classList.remove('hidden');
  document.getElementById('placeOrderBtn').classList.remove('hidden');

  if(hasOutOfStock){
    if(alertBox){
      alertBox.classList.remove('hidden');
      alertBox.className = "mt-3 p-3 rounded-xl text-[13px] font-black text-center bg-red-100 text-red-700 border border-red-200";
      alertBox.innerHTML = `❌ Some items exceed stock! Please reduce quantity`;
    }
    if(payBtn){ payBtn.disabled = true; payBtn.style.opacity='0.5'; payBtn.innerHTML = `❌ Fix stock qty first`; }
    return;
  }

  if(subtotal < MIN_ORDER){
    const need = MIN_ORDER - subtotal;
    if(alertBox){
      alertBox.classList.remove('hidden');
      alertBox.className = "mt-3 p-3 rounded-xl text-[13px] font-black text-center bg-red-100 text-red-700 border border-red-200";
      alertBox.innerHTML = `❌ Minimum ₦20,000 required<br>Your cart ₦${subtotal.toLocaleString()} • Add ₦${need.toLocaleString()} more`;
    }
    if(payBtn){
      payBtn.disabled = true;
      payBtn.style.opacity = '0.5';
      payBtn.innerHTML = `🔒 Add ₦${need.toLocaleString()} More to Pay`;
    }
  } else {
    if(alertBox){
      alertBox.classList.remove('hidden');
      alertBox.className = "mt-3 p-3 rounded-xl text-[13px] font-black text-center bg-green-100 text-green-700 border border-green-200";
      alertBox.innerHTML = `✅ Eligible! Cart ₦${subtotal.toLocaleString()} • You can checkout`;
    }
    if(payBtn){
      payBtn.disabled = false;
      payBtn.style.opacity = '1';
      payBtn.innerHTML = `💳 Pay Now With Paystack - <span id="payAmount">₦${total.toLocaleString()}</span>`;
    }
  }
}

async function payWithPaystack(e){
  e.preventDefault();
  if(isSubmitting) return;
  if(cart.length===0) return alert('Cart is empty');
  const subtotalCheck = cart.reduce((s,i)=> s + cleanPrice(i.price)*(Number(i.qty)||1),0);
  if(subtotalCheck < MIN_ORDER){
    const need = MIN_ORDER - subtotalCheck;
    alert(`❌ Minimum ₦${MIN_ORDER.toLocaleString()} - Add ₦${need.toLocaleString()} more`);
    renderCart(); return;
  }
  for(let it of cart){
    const prod = allProducts.find(p=>p.id===it.id);
    if(prod && Number(it.qty) > Number(prod.stock?? 50)){
      alert(`❌ ${it.name} only ${prod.stock} left! You have ${it.qty} in cart. Reduce qty.`);
      return;
    }
  }
  const locationSelect = document.getElementById('checkoutLocation').value;
  const customLocation = document.getElementById('customLocation').value;
  const finalLocation = locationSelect === 'Other'? customLocation : locationSelect;
  const checkoutAddress = document.getElementById('checkoutAddress').value.trim();
  const checkoutLandmark = document.getElementById('checkoutLandmark').value.trim();
  const checkoutWhatsApp = document.getElementById('checkoutWhatsApp').value.trim();
  const checkoutPhone = document.getElementById('checkoutPhone').value.trim();
  if(!finalLocation ||!checkoutAddress ||!checkoutLandmark ||!checkoutWhatsApp ||!checkoutPhone) return alert('Fill all delivery details');

  if(PAYSTACK_PUBLIC_KEY.startsWith('pk_test')){
    if(confirm('🧪 TEST MODE: Skip Paystack and simulate success?\n\nOK = Simulate Payment (2 sec)\nCancel = Open Real Paystack Popup')){
      const subtotal = cart.reduce((s,i)=> s + cleanPrice(i.price)*(Number(i.qty)||1),0);
      const delivery = Math.round(subtotal * 0.05);
      const total = subtotal + delivery;
      saveOrderAfterPayment("TEST_"+Date.now(), finalLocation, checkoutAddress, checkoutLandmark, checkoutWhatsApp, checkoutPhone, subtotal, delivery, total);
      return;
    }
  }

  const subtotal = cart.reduce((s,i)=> s + cleanPrice(i.price)*(Number(i.qty)||1),0);
  const delivery = Math.round(subtotal * 0.05);
  const total = subtotal + delivery;
  if(typeof PaystackPop === 'undefined'){
    alert('Paystack not loaded. Check internet and reload');
    return;
  }
  isSubmitting = true;
  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true;
  btn.innerText = 'Opening Paystack...';
  document.getElementById('orderMsg').innerHTML='';
  try{
    let handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: user.email,
      amount: total * 100,
      currency: 'NGN',
      ref: "LGM_"+Date.now()+"_"+Math.floor(Math.random()*90000),
      metadata: {
        custom_fields: [
          { display_name: "Location", variable_name: "delivery_location", value: finalLocation },
          { display_name: "Customer", variable_name: "customer_name", value: displayName }
        ]
      },
      callback: function(response){
        saveOrderAfterPayment(response.reference, finalLocation, checkoutAddress, checkoutLandmark, checkoutWhatsApp, checkoutPhone, subtotal, delivery, total);
      },
      onClose: function(){
        isSubmitting=false;
        btn.disabled=false;
        btn.innerHTML = `💳 Pay Now With Paystack - <span id="payAmount">₦${total.toLocaleString()}</span>`;
      }
    });
    handler.openIframe();
    setTimeout(()=>{ if(isSubmitting){ alert("⚠️ Bank slow? If it says 'Waiting for issuer' >2mins, tap Cancel > Change Payment Method > Use 4084 0840 8408 4081 test card"); } }, 90000);
  }catch(err){
    alert('Paystack error: '+err.message);
    isSubmitting=false;
    btn.disabled=false;
    btn.innerHTML = `💳 Pay Now With Paystack - <span id="payAmount">₦${total.toLocaleString()}</span>`;
  }
}

async function saveOrderAfterPayment(tx_ref, finalLocation, checkoutAddress, checkoutLandmark, checkoutWhatsApp, checkoutPhone, subtotal, delivery, total){
  const itemsWithVendor = cart.map(i => ({
    id: i.id, name: i.name, price: cleanPrice(i.price), qty: Number(i.qty)||1,
    vendor_email: i.vendor_email, vendor_id: i.vendor_id,
    vendor_business_name: vendorMap[(i.vendor_email||'').toLowerCase()] || i.vendor_email
  }));
  try{
    const { data: order, error } = await supabaseClient.from('orders').insert({
      tx_ref: tx_ref,
      customer_id: user.id,
      customer_name: displayName,
      customer_email: user.email,
      customer_phone: checkoutPhone,
      customer_address: `${finalLocation} | ${checkoutAddress} | Landmark: ${checkoutLandmark} | WA:${checkoutWhatsApp}`,
      items: itemsWithVendor,
      subtotal: subtotal,
      delivery_fee: delivery,
      total: total,
      payment_status: true,
      status: 'paid'
    }).select().single();
    if(error) throw error;

    try{
      const vendorEmails=[...new Set(cart.map(i=>i.vendor_email).filter(Boolean))];
      const {data: vendors} = await supabaseClient.from('users').select('email,full_name,account_number,bank_name,bank_code').in('email', vendorEmails);
      const map={}; (vendors||[]).forEach(v=>map[v.email.toLowerCase()]=v);
      const enriched=cart.map(i=>{
        const v=map[(i.vendor_email||'').toLowerCase()]||{};
        return {...i, vendor_name: v.full_name||i.vendor_email, account_number: v.account_number, bank_name: v.bank_name, bank_code: v.bank_code };
      });
      supabaseClient.functions.invoke('process-payouts', { body: { order_id: order.id, items: enriched } });
    }catch(pe){}

    localStorage.removeItem('lgm_cart');
    cart = [];
    try{ await supabaseClient.from('carts').delete().eq('customer_id', user.id); }catch(e){}
    saveCart();
    document.getElementById('orderMsg').innerHTML = `<div style="background:#dcfce7;border:2px solid #16a34a;color:#166534;padding:12px;border-radius:12px;font-weight:900;text-align:center">✅ Payment Successful! Order #${order.id} placed</div>`;
    setTimeout(()=>{ showTab('orders'); isSubmitting=false; },1500);
  }catch(err){
    alert("❌ SAVE FAILED:\n" + err.message);
    isSubmitting=false;
    const btn = document.getElementById('placeOrderBtn');
    btn.disabled=false;
    btn.innerHTML = `💳 Pay Now With Paystack - <span id="payAmount">₦${total.toLocaleString()}</span>`;
  }
}

async function loadOrders(){
  const {data} = await supabaseClient.from('orders').select('*').eq('customer_email', user.email).in('status',['paid','picked','on the way','delivered','failed']).order('id',{ascending:false}).limit(100);
  customerOrdersCache = data || [];
  customerOrdersCache.forEach(o=>{
    if(lastOrderStatus[o.id] && lastOrderStatus[o.id]!== o.status){
      if(o.status === 'picked' || o.status === 'on the way') triggerAlert(`🚚 Order #${o.id} is On The Way!`);
      if(o.status === 'delivered') triggerAlert(`✅ Order #${o.id} Delivered!`);
    }
    lastOrderStatus[o.id] = o.status;
  });
  let hasActive = customerOrdersCache.some(o=> o.status==='picked' || o.status==='on the way' || o.status==='paid');
  const ordersTab = document.getElementById('tabOrders');
  if(hasActive){ ordersTab.classList.add('alert-tab'); }
  else { ordersTab.classList.remove('alert-tab'); }
  renderOrdersList();
}

function renderOrdersList(){
  let html='';
  customerOrdersCache.forEach(o=>{
    let statusText = '';
    let statusColor = 'text-blue-600';
    if(o.status === 'paid'){ statusText = 'Watch out, an agent will attend to you in the next 5 minutes'; statusColor = 'text-blue-600'; }
    if(o.status === 'picked' || o.status === 'on the way'){ statusText = 'Order On The Way, Please Be Available'; statusColor = 'text-orange-500'; }
    if(o.status === 'delivered'){ statusText = 'Delivered'; statusColor = 'text-green-600'; }
    if(o.status === 'failed'){ statusText = 'Delivery Failed. Admin will contact you'; statusColor = 'text-red-600'; }
    let agentInfo = '';
    if((o.status === 'picked' || o.status === 'on the way') && o.delivery_agent_name){
      agentInfo = `<div class="bg-blue-50 p-2 rounded-lg mt-2">
        <b class="text-blue-700 text-sm">On The Way for Delivery</b>
        <div class="text-xs">🚚 Rider: ${o.delivery_agent_name}</div>
        <div class="text-xs">📞 ${o.delivery_agent_phone || ''}</div>
      </div>`;
    }
    const isOnTheWay = o.status === 'picked' || o.status === 'on the way';
    const startTime = o.picked_at || o.delivery_started_at || o.updated_at;
    let itemsBreakdown = '';
    if(o.items && Array.isArray(o.items) && o.items.length>0){
      itemsBreakdown = `<div class="mt-2 bg-white border rounded-lg p-2"><b class="text-[11px] text-green-700">📦 Ordered Items & Vendors:</b><div class="mt-1 space-y-1">` +
        o.items.map(it=>{
          const vName = it.vendor_business_name || vendorMap[(it.vendor_email||'').toLowerCase()] || 'LGM Vendor';
          const itemTotal = (Number(it.price)||0) * (Number(it.qty||it.quantity)||1);
          return `<div class="flex justify-between text-[11px] border-b border-dashed py-1">
            <span class="flex-1"><b>${it.name||it.product_name||'Item'}</b> x${it.qty||it.quantity||1} <span class="text-gray-500">@ ₦${Number(it.price||0).toLocaleString()}</span><br><span class="text-[10px] text-green-700 font-bold">🏪 ${vName}</span></span>
            <span class="font-bold">₦${itemTotal.toLocaleString()}</span>
          </div>`;
        }).join('') +
        `<div class="text-[11px] mt-2 pt-2 border-t flex justify-between"><span>Subtotal: <b>₦${Number(o.subtotal||0).toLocaleString()}</b></span><span>Delivery 5%: <b>₦${Number(o.delivery_fee||0).toLocaleString()}</b></span></div>` +
        `</div></div>`;
    }

    const isOpen = openOrderDetails.has(o.id);
    const timerHtml = isOnTheWay? formatCustomerCountdown(o.id, startTime) : '';
    const markDeliveredBtn = isOnTheWay? `<button onclick="markDelivered(${o.id})" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white py-3 rounded-full font-bold text-sm shadow-lg">✓ Mark Delivered - I Received My Order</button>` : '';

    const qrData = encodeURIComponent(`https://www.lokojagrocerymall.com.ng/verify?order=${o.id}&ref=${o.tx_ref||''}`);
    const receiptFooter = `
      <div class="receipt-footer">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <img src="logo.png" onerror="this.src='https://placehold.co/70x70/16a34a/ffffff?text=LGM'" style="width:60px;height:60px;object-fit:contain;border-radius:10px;background:white;padding:2px;border:2px solid #16a34a" />
          <div style="font-weight:900;color:#166534;font-size:14px">LOKOJA GROCERY MALL</div>
          <div style="font-size:11px;color:#374151;font-weight:700">3rd Floor Mary Plaza Ganaja Roundabout.</div>
          <div style="font-size:11px;color:#065f46">www.lokojagrocerymall.com.ng</div>
          <div style="font-size:11px;color:#065f46">lokojagrocerymall@gmail.com</div>
          <div style="margin:8px 0;background:white;padding:6px;border-radius:10px;border:1px solid #a7f3d0">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${qrData}" style="width:100px;height:100px" crossorigin="anonymous" />
            <div style="font-size:8px;font-weight:900;color:#065f46;margin-top:2px">SCAN TO VERIFY ORDER #${o.id}</div>
          </div>
          <div style="font-size:10px;color:#6b7280">Thank you for shopping with us! 🙏</div>
          <div style="font-size:8px;color:#9ca3af">Order #${o.id} • ${new Date(o.created_at).toLocaleString()} • Ref: ${o.tx_ref||'N/A'}</div>
        </div>
      </div>
    `;

    html += `<div class="bg-white p-3 rounded-2xl shadow">
      <div id="receipt-${o.id}" style="background:white;padding:8px;border-radius:12px">
        <div class="flex justify-between"><b>Order #${o.id}</b><span class="${statusColor} font-bold capitalize">${o.status}</span></div>
        <div class="font-bold">Total: ₦${Number(o.total).toLocaleString()}</div>
        <div class="text-xs text-gray-500 mt-1">📍 ${o.customer_address}</div>
        <div class="text-xs text-gray-500">📱 ${o.customer_phone}</div>
        <div class="bg-gray-50 p-2 rounded-lg mt-2 text-center font-bold text-sm">${statusText}</div>
        ${agentInfo}
        ${timerHtml}
        ${markDeliveredBtn}
        <button onclick="toggleCustDetails(${o.id})" id="btn-${o.id}" class="mt-2 w-full bg-gray-100 hover:bg-gray-200 text-[11px] font-black py-2 rounded-lg">${isOpen? '▲ Hide Details' : '▼ Show Items & Vendors'}</button>
        <div id="cust-details-${o.id}" class="${isOpen? '' : 'hidden'}">
          ${itemsBreakdown}
          ${buildRatingUI(o)}
        </div>
        ${receiptFooter}
      </div>
      <div class="flex gap-2 mt-2">
        <button onclick="toggleCustDetails(${o.id})" id="btn2-${o.id}" class="flex-1 bg-gray-100 text-[11px] font-black py-2 rounded-lg">Toggle</button>
        <button onclick="saveReceipt(${o.id})" class="flex-1 bg-green-600 text-white text-[11px] font-black py-2 rounded-lg">📥 Save Receipt + QR as Image</button>
      </div>
      <div class="text-xs text-gray-400 mt-2">${new Date(o.created_at).toLocaleString()}</div>
    </div>`;
  });
  document.getElementById('ordersList').innerHTML = html || 'No orders yet';
  attachStarEvents();
}

function toggleCustDetails(id){
  const el = document.getElementById('cust-details-'+id);
  const btn = document.getElementById('btn-'+id);
  const btn2 = document.getElementById('btn2-'+id);
  const isHidden = el.classList.contains('hidden');
  if(isHidden){
    el.classList.remove('hidden');
    openOrderDetails.add(id);
    if(btn) btn.innerText = '▲ Hide Details';
    if(btn2) btn2.innerText = '▲ Hide Details';
  } else {
    el.classList.add('hidden');
    openOrderDetails.delete(id);
    if(btn) btn.innerText = '▼ Show Items & Vendors';
    if(btn2) btn2.innerText = '▼ Show Items & Vendors';
  }
  isUserInteracting = true;
  setTimeout(()=>{ isUserInteracting = false; }, 2000);
}
async function markDelivered(orderId) {
  if(!confirm('Confirm you received this order?')) return;
  const { error } = await supabaseClient.from('orders').update({ status: 'delivered', delivered_at: new Date().toISOString() }).eq('id', orderId);
  if(error) { alert('Error: ' + error.message); }
  else { alert('Thank you! Order marked delivered. Please rate us below 👇'); loadOrders(); }
}
function attachStarEvents(){
  document.querySelectorAll('[id^=stars-]').forEach(starBox=>{
    starBox.onclick = (e)=>{
      e.stopPropagation();
      if(e.target.tagName!== 'SPAN') return;
      const id = starBox.id.split('-')[1];
      const rating = parseInt(e.target.dataset.rate);
      tempRating[id] = rating;
      [...starBox.children].forEach((star, i)=>{
        star.innerText = i < rating? '★' : '☆';
        star.className = i < rating? 'cursor-pointer text-yellow-500' : 'cursor-pointer text-gray-300';
      });
    }
  });
}
async function submitRating(id){
  const rating = tempRating[id];
  const review = document.getElementById(`review-${id}`).value;
  if(!rating){ alert('Please tap stars to rate'); return; }
  const { error } = await supabaseClient.from('orders').update({ customer_rating: rating, customer_review: review }).eq('id', id);
  if(error) alert(error.message);
  else { delete tempRating[id]; alert('Thank you for your feedback! 🙏'); loadOrders(); }
}
async function saveReceipt(orderId){
  const el = document.getElementById(`receipt-${orderId}`);
  if(!el){ alert('Receipt not found'); return; }
  const details = document.getElementById(`cust-details-${orderId}`);
  const wasHidden = details.classList.contains('hidden');
  if(wasHidden) details.classList.remove('hidden');
  try{
    const canvas = await html2canvas(el, {scale:2, useCORS:true, allowTaint:true, backgroundColor:'#ffffff'});
    const link = document.createElement('a');
    link.download = `LGM-Receipt-${orderId}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){ alert('Failed to save receipt: '+e.message); }
  if(wasHidden) details.classList.add('hidden');
}
setInterval(()=>{
  document.querySelectorAll('.customer-timer').forEach(el=>{
    const orderId = el.getAttribute('data-order');
    const start = el.getAttribute('data-start');
    if(!start || start==='null' || start==='undefined' || start==='') return;
    const end = new Date(start).getTime() + TWO_HOURS_MS;
    const diff = end - new Date().getTime();
    const timeEl = el.querySelector('.countdown-time');
    if(!timeEl) return;
    if(diff <= 0){
      timeEl.innerText = "EXPIRED";
      autoMarkFailed(orderId);
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    timeEl.innerText = `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  });
},1000);
setInterval(()=>{
  if(document.getElementById('view-orders') &&!document.getElementById('view-orders').classList.contains('hidden') &&!isUserInteracting){
    loadOrders();
  }
}, 30000);
</script></body></html>
