<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100">
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0">
  <b class="text-green-700">My Account</b>
  <div class="flex gap-2">
    <button onclick="location.href='/'" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm font-bold">Store</button>
    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1.5 rounded-full text-sm">Logout</button>
  </div>
</header>
<div class="p-4 max-w-md mx-auto">
  <div class="bg-white p-4 rounded-2xl shadow mb-3">
    <h2 class="text-lg font-bold text-green-600">Hello, <span id="name">Your Name</span>!</h2>
    <p class="text-sm">Email: <span id="email"></span></p>
    <p class="text-sm">Role: <span id="role" class="font-bold"></span></p>
  </div>
  <div class="bg-white p-4 rounded-2xl shadow">
    <h3 class="font-bold text-green-600 mb-2">Quick Actions</h3>
    <button onclick="location.href='/'" class="w-full bg-green-600 text-white py-2 rounded-full mb-2">🛒 Start Shopping</button>
    <button onclick="alert('Cart page coming soon')" class="w-full bg-orange-500 text-white py-2 rounded-full mb-2">🛍️ View Cart</button>
    <button onclick="alert('Orders page coming soon')" class="w-full bg-blue-500 text-white py-2 rounded-full">📦 My Orders</button>
  </div>
</div>
<script>
const user = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!user.email || user.role!=='customer'){ location.href='login.html'; } // ROLE LOCK
document.getElementById('name').innerText = user.name || user.full_name;
document.getElementById('email').innerText = user.email;
document.getElementById('role').innerText = user.role;
function logout(){ localStorage.removeItem('lgm_user'); location.href='login.html'; }
</script></body></html>
