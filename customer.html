<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100">
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0 z-10">
  <b class="text-green-700">My Account</b>
  <div class="flex gap-2">
    <button onclick="location.href='/'" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm font-bold">Store</button>
    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1.5 rounded-full text-sm">Logout</button>
  </div>
</header>

<div class="p-4 max-w-4xl mx-auto">
  <div class="bg-white p-4 rounded-2xl shadow mb-3">
    <h2 class="text-lg font-bold text-green-600">Hello, <span id="name">Customer</span>!</h2>
    <p class="text-sm">Email: <span id="email"></span></p>
    <p class="text-sm">Role: <span id="role" class="font-bold"></span></p>
  </div>

  <div class="flex gap-4 mb-3 bg-white p-3 rounded-2xl shadow text-sm font-bold overflow-x-auto">
    <button onclick="showTab('shop')" id="tabShop" class="text-green-600 border-b-2 border-green-600 pb-1">🛒 Shop</button>
    <button onclick="showTab('cart')" id="tabCart" class="text-gray-400">🛍️ Cart (<span id="cartCount">0</span>)</button>
    <button onclick="showTab('orders')" id="tabOrders" class="text-gray-400">📦 My Orders</button>
  </div>

  <div id="view-shop" class="view">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">Loading products...</div>
  </div>

  <div id="view-cart" class="view hidden">
    <div class="bg-white p-4 rounded-2xl shadow">
      <h3 class="font-bold mb-3">Your Cart</h3>
      <div id="cartList">Cart is empty</div>
      <div class="border-t pt-3 mt-3 space-y-2">
        <div class="flex justify-between text-sm"><span>Subtotal</span><span id="subTotal">₦0</span></div>
        <div class="flex justify-between text-sm text-gray-600"><span>Delivery Fee 5%</span><span id="deliveryFee">₦0</span></div>
        <div class="flex justify-between font-bold text-lg border-t pt-2"><span>Total</span><span id="cartTotal">₦0</span></div>
        <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-full font-bold mt-3">Place Order</button>
      </div>
    </div>
  </div>

  <div id="view-orders" class="view hidden">
    <div id="ordersList" class="space-y-3">Loading orders...</div>
  </div>
</div>

<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const user = JSON.parse(localStorage.getItem('lgm_user')||'{}');
if(!user.email || user.role!=='customer'){ location.href='login.html'; }

let displayName = user.name || user.full_name || user.email.split('@')[0];
displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);

document.getElementById('name').innerText = displayName;
document.getElementById('email').innerText = user.email;
document.getElementById('role').innerText = user.role;

let cart = JSON.parse(localStorage.getItem('lgm_cart')||'[]');
let allProducts = [];
let tempRating = {}; // for stars

const THREE_HOURS_MS = 3 * 60 * 60 * 1000; // 3 HOURS LOCKED - FIXED NAME

function showTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.querySelectorAll('[id^=tab]').forEach(b=>{b.classList.remove('text-green-600','border-b-2','border-green-600'); b.classList.add('text-gray-400')});
  document.getElementById('view-'+t).classList.remove('hidden');
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('text-green-600','border-b-2','border-green-600');
  if(t==='shop') loadProducts();
  if(t==='cart') renderCart();
  if(t==='orders') loadOrders();
}

// 3HR COUNTDOWN TIMER FOR CUSTOMER
function formatCustomerCountdown(startTime){
  if(!startTime) return '';
  const end = new Date(startTime).getTime() + THREE_HOURS_MS;
  const diff = end - new Date().getTime();
  if(diff <= 0) return `<div class="bg-red-50 p-2 rounded-lg mt-2 text-center"><b class="text-red-600">⏰ Delivery window expired. Rider will call you</b></div>`;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const pickedUpTime = new Date(startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});

  return `<div class="bg-orange-50 p-2 rounded-lg mt-2 text-center">
            <p class="text-xs text-gray-600 font-bold">3 HOUR DELIVERY WINDOW</p>
            <p class="text-xs text-gray-500">Picked up at: ${pickedUpTime}</p>
            <b class="text-red-600">⏰ Arriving in: ${h}h ${m}m ${s}s</b>
          </div>`;
}

// RATING BUILDER
function buildRatingUI(o){
  if(o.status!== 'delivered') return '';

  if(o.customer_rating){
    return `<div class="mt-2 p-2 bg-green-50 rounded-lg text-center">
      <p class="text-xs font-bold text-green-700">Thank you! You rated: ${'⭐'.repeat(o.customer_rating)}</p>
      ${o.customer_review? `<p class="text-xs text-gray-600 mt-1 italic">"${o.customer_review}"</p>` : ''}
    </div>`;
  } else {
    return `<div class="mt-2 p-3 bg-yellow-50 rounded-lg border-yellow-200">
      <p class="text-xs font-bold mb-2 text-center">Rate your delivery experience</p>
      <div class="flex justify-center gap-1 text-3xl" id="stars-${o.id}">
        <span data-rate="1" class="cursor-pointer text-gray-300 hover:text-yellow-400">☆</span>
        <span data-rate="2" class="cursor-pointer text-gray-300 hover:text-yellow-400">☆</span>
        <span data-rate="3" class="cursor-pointer text-gray-300 hover:text-yellow-400">☆</span>
        <span data-rate="4" class="cursor-pointer text-gray-300 hover:text-yellow-400">☆</span>
        <span data-rate="5" class="cursor-pointer text-gray-300 hover:text-yellow-400">☆</span>
      </div>
      <textarea id="review-${o.id}" placeholder="Tell us about the rider..." class="w-full text-xs mt-2 p-2 border rounded"></textarea>
      <button onclick="submitRating(${o.id})" class="bg-green-600 text-white w-full mt-2 py-1.5 rounded-full text-xs font-bold">Submit Rating</button>
    </div>`;
  }
}

async function loadProducts(){
  const {data} = await supabaseClient.from('products').select('*');
  allProducts = data||[];
  let html = '';
  allProducts.forEach(p=>{
    html += `<div class="bg-white p-3 rounded-2xl shadow">
      <img src="${p.image_url || 'https://placehold.co/200x200/e5e7eb/6b7280?text=No+Img'}" class="w-full h-32 object-cover rounded-lg mb-2">
      <b class="text-sm">${p.name}</b>
      <div class="text-xs text-gray-500">${p.vendor_email}</div>
      <div class="font-bold text-green-600">₦${Number(p.price).toLocaleString()}</div>
      <button onclick="addToCart(${p.id})" class="w-full bg-orange-500 text-white py-1.5 rounded-full text-xs mt-2">Add to Cart</button>
    </div>`;
  });
  document.getElementById('productGrid').innerHTML = html || 'No products yet';
}

function addToCart(id){
  const product = allProducts.find(p=>p.id===id);
  const existing = cart.find(i=>i.id===id);
  if(existing) existing.qty++;
  else cart.push({...product, qty:1});
  saveCart();
  alert(product.name + ' added to cart');
}

function saveCart(){
  localStorage.setItem('lgm_cart', JSON.stringify(cart));
  document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.qty,0);
}

function updateQty(id, change){
  const item = cart.find(i=>i.id===id);
  if(!item) return;
  item.qty += change;
  if(item.qty <= 0) cart = cart.filter(i=>i.id!==id);
  saveCart();
  renderCart();
}

function removeItem(id){
  cart = cart.filter(i=>i.id!==id);
  saveCart();
  renderCart();
}

function renderCart(){
  saveCart();
  if(cart.length===0){
    document.getElementById('cartList').innerHTML='Cart is empty';
    document.getElementById('subTotal').innerText='₦0';
    document.getElementById('deliveryFee').innerText='₦0';
    document.getElementById('cartTotal').innerText='₦0';
    return;
  }
  let html=''; let subtotal=0;
  cart.forEach(i=>{
    subtotal += i.price * i.qty;
    html += `<div class="flex items-center justify-between py-3 border-b">
      <div class="flex-1">
        <div class="font-semibold text-sm">${i.name}</div>
        <div class="text-green-600 font-bold">₦${Number(i.price).toLocaleString()}</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="updateQty(${i.id}, -1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button>
        <span class="font-bold w-6 text-center">${i.qty}</span>
        <button onclick="updateQty(${i.id}, 1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">+</button>
      </div>
      <button onclick="removeItem(${i.id})" class="text-red-500 font-bold ml-2">✕</button>
      <div class="font-bold ml-2">₦${(i.price*i.qty).toLocaleString()}</div>
    </div>`;
  });

  const delivery = Math.round(subtotal * 0.05);
  const total = subtotal + delivery;

  document.getElementById('cartList').innerHTML=html;
  document.getElementById('subTotal').innerText='₦'+subtotal.toLocaleString();
  document.getElementById('deliveryFee').innerText='₦'+delivery.toLocaleString();
  document.getElementById('cartTotal').innerText='₦'+total.toLocaleString();
}

async function checkout(){
  if(cart.length===0) return alert('Cart is empty');
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const delivery = Math.round(subtotal * 0.05);
  const total = subtotal + delivery;
  const vendor = allProducts[0]?.vendor_email || 'test@vendor.com';

  const { error } = await supabaseClient.from('orders').insert({
    customer_name: displayName,
    customer_email: user.email,
    customer_phone: user.phone || '08000000',
    customer_address: 'Lokoja, Kogi State',
    vendor_email: vendor,
    total: total,
    status: 'paid'
  });
  if(error) alert(error.message);
  else {
    alert(`Order Placed! Total: ₦${total.toLocaleString()}`);
    cart=[]; localStorage.removeItem('lgm_cart'); showTab('orders');
  }
}

async function loadOrders(){
  const {data} = await supabaseClient.from('orders').select('*').eq('customer_email', user.email).order('created_at',{ascending:false});
  let html='';
  data?.forEach(o=>{
    let color = o.status==='delivered'? 'text-green-600' : o.status==='on the way'? 'text-orange-500' : o.status==='failed_delivery'? 'text-red-600' : 'text-blue-600';

    html += `<div class="bg-white p-3 rounded-2xl shadow">
      <div class="flex justify-between"><b>Order #${o.id}</b><span class="${color} font-bold capitalize">${o.status.replace('_',' ')}</span></div>
      <div class="font-bold">Total: ₦${Number(o.total).toLocaleString()}</div>

      ${o.status==='on the way'? `
        ${formatCustomerCountdown(o.delivery_started_at)}
        <div class="text-xs text-orange-500 mt-1">🚚 Your order is on the way. Please be available</div>
        <button onclick="markDelivered(${o.id})" class="w-full mt-2 bg-green-600 text-white py-2 rounded-full font-bold">
          ✓ Mark Delivered
        </button>
      ` : ''}

      ${buildRatingUI(o)} // <-- RATING SHOWS HERE

      <div class="text-xs text-gray-400 mt-2">${new Date(o.created_at).toLocaleString()}</div>
    </div>`;
  });
  document.getElementById('ordersList').innerHTML = html || 'No orders yet';
  attachStarEvents();
}

async function markDelivered(orderId) {
  if(!confirm('Confirm you received this order?')) return;
  const { error } = await supabaseClient.from('orders').update({
      status: 'delivered',
      delivered_at: new Date().toISOString()
    }).eq('id', orderId);
  if(error) { alert('Error: ' + error.message); }
  else { alert('Thank you! Order marked delivered. Please rate us below 👇'); loadOrders(); }
}

// STAR RATING LOGIC
function attachStarEvents(){
  document.querySelectorAll('[id^=stars-]').forEach(starBox=>{
    starBox.onclick = (e)=>{
      if(e.target.tagName!== 'SPAN') return;
      const id = starBox.id.split('-')[1];
      const rating = parseInt(e.target.dataset.rate);
      tempRating[id] = rating;
      [...starBox.children].forEach((star, i)=>{
        star.innerText = i < rating? '★' : '☆';
        star.className = i < rating? 'cursor-pointer text-yellow-500' : 'cursor-pointer text-gray-300';
      });
    }
  });
}

async function submitRating(id){
  const rating = tempRating[id];
  const review = document.getElementById(`review-${id}`).value;
  if(!rating){ alert('Please tap stars to rate'); return; }

  const { error } = await supabaseClient.from('orders').update({
    customer_rating: rating,
    customer_review: review
  }).eq('id', id);

  if(error) alert(error.message);
  else { alert('Thank you for your feedback! 🙏'); loadOrders(); }
}

function logout(){ localStorage.removeItem('lgm_user'); localStorage.removeItem('lgm_cart'); location.href='login.html'; }
showTab('shop');

// Auto-refresh timer every second
setInterval(() => {
  const ordersTab = document.getElementById('view-orders');
  if(!ordersTab.classList.contains('hidden')) loadOrders();
}, 1000);

</script></body></html>
