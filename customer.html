<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script>

<style>@keyframes pulse-red{0%,100%{background:#fee2e2;border-color:#ef4444}50%{background:#fecaca;border-color:#dc2626}}.alert-tab{animation:pulse-red 1s infinite;border:2px solid #ef4444!important;border-radius:8px}.receipt-footer{border-top:2px dashed #16a34a;margin-top:12px;padding-top:12px;text-align:center;background:#f0fdf4;border-radius:0 0 12px 12px}.stock-ok{color:#16a34a;font-weight:800;font-size:10px;background:#f0fdf4;padding:2px 6px;border-radius:999px;border:1px solid #bbf7d0}.stock-low{color:#d97706;font-weight:900;font-size:10px;background:#fffbeb;padding:2px 6px;border-radius:999px;border:1px solid #fde68a}</style>
</head><body class="bg-gray-100">
<header class="bg-white p-4 flex justify-between items-center shadow sticky top-0 z-10"><b class="text-green-700">My Account</b><div class="flex gap-2"><button onclick="location.href='/'" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm font-bold">Store</button><button onclick="localStorage.removeItem('lgm_user');location.href='index.html'" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button></div></header>
<div class="p-4 max-w-4xl mx-auto"><div class="bg-white p-4 rounded-2xl shadow mb-3"><h2 class="text-lg font-bold text-green-600">Hello, <span id="name">Customer</span>!</h2><p class="text-sm">Email: <span id="email"></span></p><p class="text-sm">Role: <span id="role" class="font-bold"></span></p></div>
<div class="flex gap-4 mb-3 bg-white p-3 rounded-2xl shadow text-sm font-bold overflow-x-auto"><button onclick="showTab('shop')" id="tabShop" class="text-green-600 border-b-2 border-green-600 pb-1">🛒 Shop</button><button onclick="showTab('cart')" id="tabCart" class="text-gray-400">🛍️ Cart (<span id="cartCount">0</span>)</button><button onclick="showTab('orders')" id="tabOrders" class="text-gray-400">📦 My Orders</button></div>
<div id="view-shop" class="view"><div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">Loading...</div></div>
<div id="view-cart" class="view hidden"><form onsubmit="payWithPaystack(event)" class="bg-white p-4 rounded-2xl shadow"><h3 class="font-bold mb-3">Your Cart</h3><div id="cartList">Cart is empty</div><div id="minOrderAlertCust" class="hidden mt-3 p-3 rounded-xl text-[13px] font-black text-center"></div>
<div id="deliveryForm" class="border-t pt-3 mt-3 space-y-3 hidden"><h4 class="font-bold text-green-600">🚚 Delivery Details</h4>
<div><label class="text-sm font-semibold">Delivery Address</label><input id="checkoutAddress" type="text" required class="w-full p-3 border rounded-lg mt-1"></div>
<div><label class="text-sm font-semibold">Nearest Bus Stop</label><input id="checkoutLandmark" type="text" required class="w-full p-3 border rounded-lg mt-1"></div>
<div><label class="text-sm font-semibold">Location in Lokoja</label><select id="checkoutLocation" onchange="toggleCustomLocation()" required class="w-full p-3 border rounded-lg mt-1 bg-white"><option value="">Select Location</option></select><input id="customLocation" type="text" class="w-full p-3 border rounded-lg mt-2 hidden"></div>
<div><label class="text-sm font-semibold">WhatsApp Number</label><input id="checkoutWhatsApp" type="tel" required class="w-full p-3 border rounded-lg mt-1"></div>
<div><label class="text-sm font-semibold">Phone Number</label><input id="checkoutPhone" type="tel" required class="w-full p-3 border rounded-lg mt-1"></div></div>
<div class="border-t pt-3 mt-3 space-y-2"><div class="flex justify-between text-sm"><span>Subtotal</span><span id="subTotal">₦0</span></div><div class="flex justify-between text-sm text-gray-600"><span>Delivery Fee 5%</span><span id="deliveryFee">₦0</span></div><div class="flex justify-between font-bold text-lg border-t pt-2"><span>Total</span><span id="cartTotal">₦0</span></div><button type="submit" id="placeOrderBtn" class="w-full bg-[#00C566] text-white py-3 rounded-full font-bold mt-3 hidden">💳 Pay Now - <span id="payAmount">₦0</span></button></div><div id="orderMsg" class="text-sm text-center mt-2"></div></form></div>
<div id="view-orders" class="view hidden"><div id="ordersList" class="space-y-3">Loading orders...</div></div></div>
<div id="detailModal" class="hidden fixed inset-0 bg-black/70 z-[80] flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target==this) closeDetail()"><div class="bg-white w-full md:max-w-md rounded-t-[28px] md:rounded-[24px] p-5 max-h-[92vh] overflow-y-auto"><img id="dImage" class="w-full h-56 object-cover rounded-2xl bg-gray-100 mb-3"><div class="flex justify-between items-start gap-2"><p id="dName" class="font-black text-[18px] flex-1"></p><span id="dStockBadge" class="text-[10px] font-black px-2 py-1 rounded-full"></span></div><p id="dCategory" class="text-xs text-gray-400 mt-1"></p><p id="dVendor" class="text-[12px] text-green-700 font-bold mt-1"></p><div id="dStock" class="mt-2"></div><p id="dPrice" class="font-black text-green-700 text-[24px] mt-3"></p><div class="bg-gray-50 p-3 rounded-xl mt-3"><div class="text-[10px] font-black text-gray-400">FULL DESCRIPTION</div><p id="dDesc" class="text-[13px] text-gray-700 mt-1 whitespace-pre-wrap"></p></div><button id="dAddBtn" class="w-full bg-orange-500 text-white py-4 rounded-xl font-black mt-4">Add to Cart 🛒</button><button onclick="closeDetail()" class="w-full bg-gray-100 py-3 rounded-xl font-bold text-sm mt-2">Close</button></div></div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZnhtcnBxYWNjYmxsc3pveHlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDE5NDgsImV4cCI6MjEwNDY3Nzk0OH0.H46FH9BkDWAl2w7j699Z9x_XoZiRS1wFOTn7LeKUF4A";const PAYSTACK_PUBLIC_KEY="pk_test_41f9bb4c711e87d17abf93862041dea2328007a6";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const user=JSON.parse(localStorage.getItem('lgm_user')||'{}');if(!user.email||user.role!=='customer'){location.href='login.html';}
let displayName=user.name||user.full_name||user.email.split('@')[0];displayName=displayName.charAt(0).toUpperCase()+displayName.slice(1);
document.getElementById('name').innerText=displayName;document.getElementById('email').innerText=user.email;document.getElementById('role').innerText=user.role;
let cart=JSON.parse(localStorage.getItem('lgm_cart')||'[]');let allProducts=[];let tempRating={};let isUserInteracting=false;let isSubmitting=false;let lastOrderStatus={};let customerOrdersCache=[];let openOrderDetails=new Set();let vendorMap={};let vendorMapById={};
const TWO_HOURS_MS=2*60*60*1000;const MIN_ORDER=20000;
const LOKOJA_AREAS=["200 Units","500 Unit","Adankolo","Adankolo Junction","Adankolo Newlayout","Anebo Qtrs","Barracks","C - Division","CBN","Commissioners Qtrs","Como","Crusher","Dunamis","FMC","FUL Adankolo","FUL Felele","Fentolu","Felele","Gadumo","Ganaja","Ganaja Junction","Government Day","Government House","GRA","Hydro Junction","Jimgbe","Kabawa","Kabba Junction","Karaworo","Kporoka","Kpata Market","MAIGERI","NATACO","NUJ","NTA","New Market","New Stadium","Old Market","Old Poly Qtrs","Otokiti","Phase 1","Phase 2","Police Clinic","Poly","Post Office","Shetima","Zenith Bank","Zango","Zone 8","Other"];
function cleanPrice(p){return Number(String(p).replace(/[^0-9]/g,''))||0;}
function cleanShopName(raw){if(!raw) return null;let n=String(raw).trim();if(!n) return null;if(n.includes('@')){let pre=n.split('@')[0].replace(/[0-9._-]/g,'').trim();if(pre.length<3) return null;return pre.toUpperCase()+' STORE';}if(n.toLowerCase()==='lgm vendor') return null;return n.toUpperCase();}
function getShopName(p){let a=cleanShopName(p.business_name||p.store_name||p.vendor_business_name||p.vendor_name||p.shop_name);if(a) return a;let b=cleanShopName(vendorMap[(p.vendor_email||'').toLowerCase()]);if(b) return b;let c=cleanShopName(vendorMapById[p.vendor_id]);if(c) return c;let d=cleanShopName(p.vendor_email);if(d) return d;return 'SOKOATO STORE';}
window.onload=async()=>{const sel=document.getElementById('checkoutLocation');LOKOJA_AREAS.forEach(a=>{sel.innerHTML+=`<option value="${a}">${a}</option>`;});await syncCartFromSupabase();showTab('shop');loadOrders();}
async function syncCartFromSupabase(){try{const u=JSON.parse(localStorage.getItem('lgm_user')||'{}');if(!u.id) return;const {data:db}=await supabaseClient.from('carts').select('*').eq('customer_id',u.id);if(db&&db.length>0){cart=db.map(c=>({id:c.product_id,name:c.product_name,price:Number(c.product_price),image_url:c.product_image,image:c.product_image,vendor_email:c.vendor_email,vendor_id:c.vendor_id,qty:c.qty}));localStorage.setItem('lgm_cart',JSON.stringify(cart));}else if(cart.length>0){for(let it of cart){await supabaseClient.from('carts').upsert({customer_id:u.id,product_id:it.product_id,product_name:it.name,product_price:cleanPrice(it.price),product_image:it.image_url||it.image||'',vendor_id:it.vendor_id||null,vendor_email:it.vendor_email||null,qty:it.qty},{onConflict:'customer_id,product_id'});}}saveCart(false);}catch(e){saveCart(false);}}
function toggleCustomLocation(){const v=document.getElementById('checkoutLocation').value;const c=document.getElementById('customLocation');if(v==='Other'){c.classList.remove('hidden');c.required=true;}else{c.classList.add('hidden');c.required=false;c.value='';}}
function openDetail(id){const p=allProducts.find(x=>x.id===id);if(!p) return;document.getElementById('dImage').src=p.image_url||p.image||'';document.getElementById('dName').innerText=p.name;document.getElementById('dCategory').innerText=(p.category||'Foodstuff')+' • '+(p.location||'Lokoja');document.getElementById('dVendor').innerText='🏪 '+getShopName(p);document.getElementById('dDesc').innerText=p.description||p.name;document.getElementById('dPrice').innerText='₦'+Number(p.price).toLocaleString();const s=Number(p.stock||0);const b=document.getElementById('dStockBadge');if(s<=10){b.innerText='⚠️ Only '+s+' left';b.style.background='#fffbeb';b.style.color='#d97706';}else{b.innerText='✅ '+s+' in stock';b.style.background='#dcfce7';b.style.color='#16a34a';}document.getElementById('dStock').innerHTML=s<=10?`<span class="stock-low">⚠️ Only ${s} left!</span>`:`<span class="stock-ok">✅ ${s} in stock</span>`;document.getElementById('dAddBtn').onclick=()=>{closeDetail();addToCart(id);};document.getElementById('detailModal').classList.remove('hidden');}
function closeDetail(){document.getElementById('detailModal').classList.add('hidden');}
function showTab(t){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.querySelectorAll('[id^=tab]').forEach(b=>{b.classList.remove('text-green-600','border-b-2','border-green-600');b.classList.add('text-gray-400')});document.getElementById('view-'+t).classList.remove('hidden');document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('text-green-600','border-b-2','border-green-600');if(t==='orders'){document.getElementById('tabOrders').classList.remove('alert-tab');loadOrders();}if(t==='shop') loadProducts();if(t==='cart'){syncCartFromSupabase().then(()=>renderCart());}}
function formatCustomerCountdown(orderId,startTime){if(!startTime) return `<div class="customer-timer" data-order="${orderId}" data-start="${startTime}" style="background:#fff7ed;border:2px dashed #f97316;padding:12px;border-radius:14px;margin-top:12px;text-align:center;font-weight:900;color:#c2410c">⏰ Rider on the way</div>`;const end=new Date(startTime).getTime()+TWO_HOURS_MS;const diff=end-new Date().getTime();if(diff<=0){autoMarkFailed(orderId);return `<div style="background:#fee2e2;border:3px solid #dc2626;color:#dc2626;padding:16px;border-radius:14px;margin-top:12px;text-align:center;font-weight:900">❌ EXPIRED</div>`;}const h=Math.floor(diff/3600000);const m=Math.floor((diff%3600000)/60000);const s=Math.floor((diff%60000)/1000);return `<div class="customer-timer" data-order="${orderId}" data-start="${startTime}" style="background:linear-gradient(135deg,#ffffff,#fef3c7);border:3px solid #f59e0b;padding:16px;border-radius:16px;margin-top:12px;text-align:center"><div style="font-size:11px;font-weight:900;background:#fde68a;display:inline-block;padding:3px 12px;border-radius:20px">⏰ DELIVERY COUNTDOWN</div><div class="countdown-time" style="font-size:34px;font-weight:900;color:#dc2626;margin:8px 0">${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</div></div>`;}
function triggerAlert(msg){new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});if(navigator.vibrate) navigator.vibrate([200,100,200]);if(Notification.permission==="granted"){new Notification("LGM Update",{body:msg});}else if(Notification.permission!=="denied"){Notification.requestPermission();}}
async function autoMarkFailed(orderId){if(window.failedCalled?.[orderId]) return;window.failedCalled=window.failedCalled||{};window.failedCalled[orderId]=true;await supabaseClient.from('orders').update({status:'failed'}).eq('id',orderId);loadOrders();}
function buildRatingUI(o){if(o.status!=='delivered') return '';if(o.customer_rating){return `<div class="mt-2 p-2 bg-green-50 rounded-lg text-center"><p class="text-xs font-bold text-green-700">Thank you! You rated: ${'⭐'.repeat(o.customer_rating)}</p></div>`;}else{const sr=tempRating[o.id]||0;return `<div class="mt-2 p-3 bg-yellow-50 rounded-xl border-2 border-yellow-400 animate-pulse"><p class="text-[13px] font-black mb-2 text-center">⭐ Rate your delivery - Required</p><div class="flex justify-center gap-1 text-3xl" id="stars-${o.id}">${[1,2,3,4,5].map(i=>`<span data-rate="${i}" class="cursor-pointer ${i<=sr?'text-yellow-500':'text-gray-300'}">${i<=sr?'★':'☆'}</span>`).join('')}</div><textarea id="review-${o.id}" placeholder="Tell us about rider..." class="w-full text-xs mt-2 p-2 border rounded"></textarea><button onclick="submitRating(${o.id})" class="bg-green-600 text-white w-full mt-2 py-2 rounded-full text-xs font-black">Submit Rating</button></div>`;}}
async function loadProducts(){const {data}=await supabaseClient.from('products').select('*').eq('is_approved',true).gt('stock',0);allProducts=(data||[]).filter(p=>Number(p.stock||0)>0);try{const emails=[...new Set(allProducts.map(p=>(p.vendor_email||'').toLowerCase()).filter(Boolean))];const ids=[...new Set(allProducts.map(p=>p.vendor_id).filter(Boolean))];if(emails.length){const {data:vendors}=await supabaseClient.from('users').select('email,business_name,store_name,full_name').in('email',emails);(vendors||[]).forEach(v=>{vendorMap[v.email.toLowerCase()]=v.business_name||v.store_name||v.full_name||v.email;});}if(ids.length){const {data:v2}=await supabaseClient.from('users').select('id,business_name,store_name,full_name,email').in('id',ids);(v2||[]).forEach(v=>{vendorMapById[v.id]=v.business_name||v.store_name||v.full_name||v.email;if(v.email) vendorMap[v.email.toLowerCase()]=v.business_name||v.store_name||v.full_name||v.email;});}}catch(e){}let html='';allProducts.forEach(p=>{const shop=getShopName(p);const stockNum=Number(p.stock||0);let stockLabel=stockNum<=10?`<span class="stock-low">⚠️ Only ${stockNum} left!</span>`:`<span class="stock-ok">✅ ${stockNum} in stock</span>`;let btn=`<button onclick="event.stopPropagation();addToCart(${p.id})" class="w-full bg-orange-500 text-white py-1.5 rounded-full text-xs mt-2">Add to Cart</button>`;html+=`<div class="bg-white p-3 rounded-2xl shadow cursor-pointer" onclick="openDetail(${p.id})"><img src="${p.image_url||p.image||''}" class="w-full h-32 object-cover rounded-lg mb-2"><b class="text-sm block truncate">${p.name}</b><div class="text-xs text-green-700 font-bold">🏪 ${shop}</div><div class="mt-1">${stockLabel}</div><div class="font-bold text-green-600 mt-1">₦${Number(p.price).toLocaleString()}</div>${btn}</div>`;});document.getElementById('productGrid').innerHTML=html||'No products';}
async function addToCart(id){const product=allProducts.find(p=>p.id===id);if(!product) return;const stockNum=Number(product.stock||0);if(stockNum<=0){alert('❌ Out of Stock');return;}const ex=cart.find(i=>i.id===id);const cur=ex?Number(ex.qty)||0:0;if(cur+1>stockNum){alert(`⚠️ Only ${stockNum} left!`);return;}if(ex) ex.qty++;else cart.push({...product,qty:1,stock:stockNum});saveCart(true);try{const u=JSON.parse(localStorage.getItem('lgm_user')||'{}');if(u.id){await supabaseClient.from('carts').upsert({customer_id:u.id,product_id:product.id,product_name:product.name,product_price:cleanPrice(product.price),product_image:product.image_url||product.image||'',vendor_id:product.vendor_id||null,vendor_email:product.vendor_email||null,qty:ex?ex.qty:1},{onConflict:'customer_id,product_id'});}}catch(e){}alert(product.name+' added!');}
function saveCart(){localStorage.setItem('lgm_cart',JSON.stringify(cart));document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+(Number(i.qty)||0),0);}
async function updateQty(id,change){const it=cart.find(i=>i.id===id);if(!it) return;const prod=allProducts.find(p=>p.id===id);const stockNum=Number(prod?.stock??it.stock??50);const nq=(Number(it.qty)||1)+change;if(change>0&&nq>stockNum){alert(`⚠️ Only ${stockNum} left`);return;}it.qty=nq;if(it.qty<=0) cart=cart.filter(i=>i.id!==id);saveCart();renderCart();try{const u=JSON.parse(localStorage.getItem('lgm_user')||'{}');if(u.id){if(it.qty<=0){await supabaseClient.from('carts').delete().eq('customer_id',u.id).eq('product_id',id);}else{await supabaseClient.from('carts').update({qty:it.qty}).eq('customer_id',u.id).eq('product_id',id);}}}catch(e){}}
async function removeItem(id){cart=cart.filter(i=>i.id!==id);saveCart();renderCart();try{const u=JSON.parse(localStorage.getItem('lgm_user')||'{}');if(u.id) await supabaseClient.from('carts').delete().eq('customer_id',u.id).eq('product_id',id);}catch(e){}}
function renderCart(){saveCart();const alertBox=document.getElementById('minOrderAlertCust');const payBtn=document.getElementById('placeOrderBtn');if(cart.length===0){document.getElementById('cartList').innerHTML='Cart is empty';document.getElementById('subTotal').innerText='₦0';document.getElementById('deliveryFee').innerText='₦0';document.getElementById('cartTotal').innerText='₦0';document.getElementById('deliveryForm').classList.add('hidden');document.getElementById('placeOrderBtn').classList.add('hidden');return;}let html='';let subtotal=0;cart.forEach(i=>{const unit=cleanPrice(i.price);const qty=Number(i.qty)||1;subtotal+=unit*qty;const prod=allProducts.find(p=>p.id===i.id);const shop=getShopName(prod||i);html+=`<div class="flex items-center justify-between py-3 border-b"><div class="flex-1"><div class="font-semibold text-sm">${i.name}</div><div class="text-[11px] text-green-700 font-black">🏪 ${shop}</div><div class="text-green-600 font-bold text-xs">₦${unit.toLocaleString()} x ${qty}</div></div><div class="flex items-center gap-2"><button type="button" onclick="updateQty(${i.id},-1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button><span class="font-bold w-6 text-center">${qty}</span><button type="button" onclick="updateQty(${i.id},1)" class="bg-gray-200 w-8 h-8 rounded-full font-bold">+</button></div><button type="button" onclick="removeItem(${i.id})" class="text-red-500 font-bold ml-2">✕</button><div class="font-bold ml-2 text-xs">₦${(unit*qty).toLocaleString()}</div></div>`;});const delivery=Math.round(subtotal*0.05);const total=subtotal+delivery;document.getElementById('cartList').innerHTML=html;document.getElementById('subTotal').innerText='₦'+subtotal.toLocaleString();document.getElementById('deliveryFee').innerText='₦'+delivery.toLocaleString();document.getElementById('cartTotal').innerText='₦'+total.toLocaleString();document.getElementById('payAmount').innerText='₦'+total.toLocaleString();document.getElementById('deliveryForm').classList.remove('hidden');document.getElementById('placeOrderBtn').classList.remove('hidden');if(subtotal<MIN_ORDER){const need=MIN_ORDER-subtotal;alertBox.classList.remove('hidden');alertBox.className="mt-3 p-3 rounded-xl text-[13px] font-black text-center bg-red-100 text-red-700 border";alertBox.innerHTML=`❌ Minimum ₦20k - Add ₦${need.toLocaleString()}`;payBtn.disabled=true;payBtn.style.opacity='0.5';}else{alertBox.classList.remove('hidden');alertBox.className="mt-3 p-3 rounded-xl text-[13px] font-black text-center bg-green-100 text-green-700 border";alertBox.innerHTML=`✅ Eligible ₦${subtotal.toLocaleString()}`;payBtn.disabled=false;payBtn.style.opacity='1';}}
async function payWithPaystack(e){e.preventDefault();if(isSubmitting) return;if(cart.length===0) return alert('Cart empty');const subCheck=cart.reduce((s,i)=>s+cleanPrice(i.price)*(Number(i.qty)||1),0);if(subCheck<MIN_ORDER){alert(`❌ Add ₦${(MIN_ORDER-subCheck).toLocaleString()} more`);return;}const finalLoc=document.getElementById('checkoutLocation').value==='Other'?document.getElementById('customLocation').value:document.getElementById('checkoutLocation').value;const addr=document.getElementById('checkoutAddress').value.trim();const land=document.getElementById('checkoutLandmark').value.trim();const wa=document.getElementById('checkoutWhatsApp').value.trim();const ph=document.getElementById('checkoutPhone').value.trim();if(!finalLoc||!addr||!land||!wa||!ph) return alert('Fill all details');if(PAYSTACK_PUBLIC_KEY.startsWith('pk_test')){if(confirm('TEST MODE: Simulate payment?')){const sub=cart.reduce((s,i)=>s+cleanPrice(i.price)*(Number(i.qty)||1),0);const del=Math.round(sub*0.05);saveOrderAfterPayment("TEST_"+Date.now(),finalLoc,addr,land,wa,ph,sub,del,sub+del);return;}}const sub=cart.reduce((s,i)=>s+cleanPrice(i.price)*(Number(i.qty)||1),0);const del=Math.round(sub*0.05);const tot=sub+del;isSubmitting=true;const btn=document.getElementById('placeOrderBtn');btn.disabled=true;btn.innerText='Opening Paystack...';try{let h=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:user.email,amount:tot*100,currency:'NGN',ref:"LGM_"+Date.now(),callback:function(r){saveOrderAfterPayment(r.reference,finalLoc,addr,land,wa,ph,sub,del,tot);},onClose:function(){isSubmitting=false;btn.disabled=false;btn.innerHTML=`💳 Pay Now - ₦${tot.toLocaleString()}`;}});h.openIframe();}catch(err){alert(err.message);isSubmitting=false;btn.disabled=false;}}
async function saveOrderAfterPayment(tx_ref,finalLocation,checkoutAddress,checkoutLandmark,checkoutWhatsApp,checkoutPhone,subtotal,delivery,total){const items=cart.map(i=>{const p=allProducts.find(ap=>ap.id===i.id);const shop=p?getShopName(p):cleanShopName(vendorMap[(i.vendor_email||'').toLowerCase()]||'SOKOATO STORE');return{id:i.id,name:i.name,price:cleanPrice(i.price),qty:Number(i.qty)||1,vendor_email:i.vendor_email,vendor_id:i.vendor_id,vendor_business_name:shop};});try{const {data:order,error}=await supabaseClient.from('orders').insert({tx_ref:tx_ref,customer_id:user.id,customer_name:displayName,customer_email:user.email,customer_phone:checkoutPhone,customer_address:`${finalLocation} | ${checkoutAddress} | ${checkoutLandmark} | WA:${checkoutWhatsApp}`,items:items,subtotal:subtotal,delivery_fee:delivery,total:total,payment_status:true,status:'paid'}).select().single();if(error) throw error;localStorage.removeItem('lgm_cart');cart=[];try{await supabaseClient.from('carts').delete().eq('customer_id',user.id);}catch(e){}saveCart();document.getElementById('orderMsg').innerHTML=`<div style="background:#dcfce7;border:2px solid #16a34a;padding:12px;border-radius:12px;font-weight:900;text-align:center">✅ Order #${order.id} placed</div>`;setTimeout(()=>{showTab('orders');isSubmitting=false;},1500);}catch(err){alert("SAVE FAILED: "+err.message);isSubmitting=false;}}
async function loadOrders(){const {data}=await supabaseClient.from('orders').select('*').eq('customer_email',user.email).in('status',['paid','picked','on the way','delivered','failed']).order('id',{ascending:false}).limit(100);customerOrdersCache=data||[];try{const emails=[...new Set(customerOrdersCache.flatMap(o=>(o.items||[]).map(i=>i.vendor_email).filter(Boolean)).map(e=>e.toLowerCase()))];if(emails.length){const {data:vendors}=await supabaseClient.from('users').select('email,business_name,store_name,full_name').in('email',emails);(vendors||[]).forEach(v=>{vendorMap[v.email.toLowerCase()]=v.business_name||v.store_name||v.full_name||v.email;});}}catch(e){}renderOrdersList();}
function renderOrdersList(){let html='';customerOrdersCache.forEach(o=>{let statusText='';let statusBox='bg-gray-50 p-2 rounded-lg mt-2 text-center font-bold text-sm';let color='text-blue-600';if(o.status==='paid'){statusText='Watch out, an agent will attend in 5 mins';statusBox='bg-blue-50 border text-blue-700 p-2 rounded-lg mt-2 text-center font-black text-sm';}if(o.status==='picked'||o.status==='on the way'){statusText='Order On The Way, Please Be Available';color='text-red-600';statusBox='bg-red-100 border-2 border-red-600 text-red-700 p-3 rounded-xl mt-2 text-center font-black text-[14px]';}if(o.status==='delivered'){statusText='Delivered';color='text-green-600';statusBox='bg-green-50 border text-green-700 p-2 rounded-lg mt-2 text-center font-black';}if(o.status==='failed'){statusText='Delivery Failed. Admin will contact you';color='text-red-600';statusBox='bg-red-100 border-2 border-red-700 text-red-800 p-3 rounded-xl mt-2 text-center font-black';}let agentInfo='';if((o.status==='picked'||o.status==='on the way')&&o.delivery_agent_name){agentInfo=`<div class="bg-blue-50 p-2 rounded-lg mt-2"><b class="text-blue-700 text-sm">On The Way</b><div class="text-xs">🚚 ${o.delivery_agent_name}</div><div class="text-xs">📞 ${o.delivery_agent_phone||''}</div></div>`;}const isOn=o.status==='picked'||o.status==='on the way';const start=o.picked_at||o.delivery_started_at||o.updated_at;let itemsHtml='';if(o.items&&o.items.length>0){itemsHtml=`<div class="mt-2 bg-white border rounded-lg p-2"><b class="text-[11px] text-green-700">📦 Items & Vendors:</b><div class="mt-1">`+o.items.map(it=>{const vName=cleanShopName(it.vendor_business_name||vendorMap[(it.vendor_email||'').toLowerCase()]||'SOKOATO STORE')||'SOKOATO STORE';return `<div class="flex justify-between text-[11px] border-b border-dashed py-1"><span><b>${it.name||'Item'}</b> x${it.qty||1}<br><span class="text-[10px] text-green-700 font-black">🏪 ${vName}</span></span><span class="font-bold">₦${(Number(it.price)*Number(it.qty||1)).toLocaleString()}</span></div>`;}).join('')+`</div></div>`;}const qrData=encodeURIComponent(`https://www.lokojagrocerymall.com.ng/verify?order=${o.id}&ref=${o.tx_ref||''}`);const receiptFooter=`<div class="receipt-footer"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="logo.png" onerror="this.src='https://placehold.co/70x70/16a34a/ffffff?text=LGM'" style="width:60px;height:60px;object-fit:contain;border-radius:10px;background:white;padding:2px;border:2px solid #16a34a"/><div style="font-weight:900;color:#166534;font-size:14px">LOKOJA GROCERY MALL</div><div style="font-size:11px;color:#374151;font-weight:700">3rd Floor Mary Plaza Ganaja Roundabout.</div><div style="font-size:11px;color:#065f46">www.lokojagrocerymall.com.ng</div><div style="font-size:11px;color:#065f46">lokojagrocerymall@gmail.com</div><div style="margin:8px 0;background:white;padding:6px;border-radius:10px;border:1px solid #a7f3d0"><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${qrData}" style="width:100px;height:100px"/><div style="font-size:8px;font-weight:900;color:#065f46;margin-top:2px">SCAN TO VERIFY ORDER #${o.id}</div></div><div style="font-size:10px;color:#6b7280">Thank you for shopping with us! 🙏</div><div style="font-size:8px;color:#9ca3af">Order #${o.id} • ${new Date(o.created_at).toLocaleString()} • Ref: ${o.tx_ref||'N/A'}</div></div></div>`;
const shouldAutoOpen = (o.status==='delivered' &&!o.customer_rating) || window.justDeliveredId===o.id;
const isOpen = openOrderDetails.has(o.id) || shouldAutoOpen;
const timer=isOn?formatCustomerCountdown(o.id,start):'';const markBtn=isOn?`<button onclick="markDelivered(${o.id})" class="w-full mt-3 bg-green-600 text-white py-3 rounded-full font-bold text-sm">✓ Mark Delivered</button>`:'';
const canSaveReceipt = o.status==='delivered' || o.status==='failed';
const receiptBtn = canSaveReceipt? `<div class="flex gap-2 mt-2"><button onclick="saveReceipt(${o.id})" class="flex-1 bg-green-600 text-white text-[11px] font-black py-2 rounded-lg">📥 Save Receipt + QR as Image</button></div>` : `<div class="flex gap-2 mt-2"><button disabled class="flex-1 bg-gray-200 text-gray-400 text-[11px] font-black py-2 rounded-lg cursor-not-allowed border border-dashed">🔒 Receipt locked - Available after delivery</button></div>`;
html+=`<div class="bg-white p-3 rounded-2xl shadow"><div id="receipt-${o.id}" style="background:white;padding:8px;border-radius:12px"><div class="flex justify-between"><b>Order #${o.id}</b><span class="${color} font-bold capitalize">${o.status}</span></div><div class="font-bold">Total: ₦${Number(o.total).toLocaleString()}</div><div class="text-xs text-gray-500 mt-1">📍 ${o.customer_address}</div><div class="${statusBox}">${statusText}</div>${agentInfo}${timer}${markBtn}<button onclick="toggleCustDetails(${o.id})" class="mt-2 w-full bg-gray-100 text-[11px] font-black py-2 rounded-lg">${isOpen?'▲ Hide':'▼ Show Items'}</button><div id="cust-details-${o.id}" class="${isOpen?'':'hidden'}">${itemsHtml}${buildRatingUI(o)}${receiptFooter}</div></div>${receiptBtn}</div>`;});document.getElementById('ordersList').innerHTML=html||'No orders';
const hasActive = customerOrdersCache.some(o=> o.status==='paid' || o.status==='picked' || o.status==='on the way');
const tabOrders = document.getElementById('tabOrders');
if(hasActive){ tabOrders.classList.add('alert-tab'); } else { tabOrders.classList.remove('alert-tab'); }
attachStarEvents();
if(window.justDeliveredId){ setTimeout(()=>{ const el=document.getElementById('cust-details-'+window.justDeliveredId); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); } window.justDeliveredId=null; },600); }
}
function toggleCustDetails(id){const el=document.getElementById('cust-details-'+id);const h=el.classList.contains('hidden');if(h){el.classList.remove('hidden');openOrderDetails.add(id);}else{el.classList.add('hidden');openOrderDetails.delete(id);}}

// FIXED: NOW SAVES delivered_at FOR DELIVERY AGENT DASHBOARD
async function markDelivered(id){
  if(!confirm('Confirm received?')) return;
  window.justDeliveredId=id;
  openOrderDetails.add(id);
  await supabaseClient.from('orders').update({
    status:'delivered',
    delivered_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  }).eq('id',id);
  loadOrders();
}

function attachStarEvents(){document.querySelectorAll('[id^=stars-]').forEach(box=>{box.onclick=(e)=>{if(e.target.tagName!=='SPAN') return;const id=box.id.split('-')[1];const r=parseInt(e.target.dataset.rate);tempRating[id]=r;[...box.children].forEach((s,i)=>{s.innerText=i<r?'★':'☆';s.className=i<r?'cursor-pointer text-yellow-500':'cursor-pointer text-gray-300';});}});}
async function submitRating(id){const r=tempRating[id];const rev=document.getElementById(`review-${id}`).value;if(!r){alert('Tap stars');return;}await supabaseClient.from('orders').update({customer_rating:r,customer_review:rev}).eq('id',id);delete tempRating[id];alert('Thanks for rating! ⭐');loadOrders();}
async function saveReceipt(orderId){const order=customerOrdersCache.find(o=>o.id===orderId);if(!order || (order.status!=='delivered' && order.status!=='failed')){alert('🔒 Receipt available only after Delivered or Failed');return;}const el=document.getElementById(`receipt-${orderId}`);if(!el) return;const d=document.getElementById(`cust-details-${orderId}`);const was=d.classList.contains('hidden');if(was) d.classList.remove('hidden');try{const c=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff'});const a=document.createElement('a');a.download=`LGM-${orderId}.png`;a.href=c.toDataURL('image/png');a.click();}catch(e){alert(e.message);}if(was) d.classList.add('hidden');}
setInterval(()=>{document.querySelectorAll('.customer-timer').forEach(el=>{const s=el.getAttribute('data-start');if(!s) return;const end=new Date(s).getTime()+TWO_HOURS_MS;const diff=end-new Date().getTime();const te=el.querySelector('.countdown-time');if(!te) return;if(diff<=0){te.innerText="EXPIRED";return;}const h=Math.floor(diff/3600000);const m=Math.floor((diff%3600000)/60000);const ss=Math.floor((diff%60000)/1000);te.innerText=`${h}h ${String(m).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;});},1000);
</script></body></html>
