<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Dashboard</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100">
<header class="bg-white p-4 shadow flex justify-between items-center sticky top-0">
  <b class="text-green-700">🚚 Delivery Dashboard</b>
  <button onclick="logout()" class="text-red-500 font-bold">Logout</button>
</header>
<div class="p-4 max-w-2xl mx-auto">
  <div class="bg-white p-3 rounded-xl mb-4">
    <p class="text-sm">Welcome, <b id="name"></b></p>
  </div>
  <h2 class="font-bold mb-3">My Active Deliveries</h2>
  <div id="orders">Loading...</div>
</div>
<script>
const SUPABASE_URL="https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY="sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let curUser = JSON.parse(localStorage.getItem('delivery_user')||'{}');
if(!curUser.email){ location.href='delivery-login.html'; }
document.getElementById('name').innerText = curUser.full_name || curUser.email;

function formatCountdown(startTime){
  if(!startTime) return 'Start timer';
  const start = new Date(startTime).getTime();
  const end = start + (2 * 60 * 60 * 1000);
  const diff = end - new Date().getTime();
  if(diff <= 0) return '<span class="text-red-600 font-bold">TIME UP!</span>';
  const h = Math.floor(diff / (1000 * 60 * 60));
  const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const s = Math.floor((diff % (1000 * 60)) / 1000);
  return `<span class="text-red-600 font-bold">${h}h ${m}m ${s}s</span>`;
}

async function loadOrders(){
  try {
    const { data:orders, error } = await supabaseClient.from('orders')
      .select('*')
      .eq('status','paid')
      .order('created_at',{ascending:false});
    
    if(error) throw error;
    if(!orders || orders.length===0){ document.getElementById('orders').innerHTML='<p class="text-center text-gray-400 py-8">No paid orders yet</p>'; return; }
    
    document.getElementById('orders').innerHTML = orders.map(o=>`
      <div class="bg-white p-4 rounded-xl shadow mb-3 border border-green-200">
        <div class="flex justify-between"><h3 class="font-bold">Order #${o.id}</h3><b class="text-green-700">₦${Number(o.total).toLocaleString()}</b></div>
        <p class="text-sm"><b>Customer:</b> ${o.customer_name}</p>
        <p class="text-sm"><b>Phone:</b> ${o.customer_phone || 'N/A'}</p>
        <p class="text-sm"><b>Address:</b> ${o.address || o.customer_address || 'N/A'}</p>
        <button onclick="pickup('${o.id}')" class="mt-2 w-full bg-green-600 text-white py-2 rounded-lg font-bold">Pick Up & Start Delivery</button>
      </div>
    `).join('');
  } catch(err) {
    document.getElementById('orders').innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
    console.error(err);
  }
}

async function pickup(id){
  const {error} = await supabaseClient.from('orders').update({
    status:'on the way', 
    delivery_started_at:new Date().toISOString(),
    delivery_agent_id: curUser.id
  }).eq('id',id);
  if(error){ alert('Error: '+error.message); return; }
  alert('Order picked up! 2hr countdown started');
  loadOrders();
}

function logout(){ localStorage.removeItem('delivery_user'); location.href='delivery-login.html'; }
loadOrders(); setInterval(loadOrders, 5000);
</script></body></html>
