<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.flutterwave.com/v3.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
h2{margin:0 0 12px 0}
input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer;font-size:16px}
.small{font-size:12px;color:#6b7280}
.order-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:8px}
.vendor-tag{font-size:11px;background:#dcfce7;color:#166534;padding:2px 6px;border-radius:6px;margin-left:6px}
</style>
</head>
<body>

<div class="card">
<h2>📦 Checkout</h2>
<div id="cartSummary"></div>
</div>

<div class="card">
<h3>Delivery Details</h3>
<input id="cName" placeholder="Full Name">
<input id="cPhone" placeholder="Phone Number 080...">
<input id="cAddress" placeholder="Delivery Address in Lokoja">
<button class="btn" onclick="payWithFlutterwave()">Pay Now ₦<span id="grandTotal">0</span></button>
<p class="small">Secure payment. Vendor gets 90%, Platform takes 10% + ₦5,000 delivery</p>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const FLW_PUBLIC_KEY = "FLWPUBK_TEST-cfe61c65283af734853546574ed4c60f-X";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let cart = JSON.parse(localStorage.getItem('lgm_cart')) || [];
let curUser = JSON.parse(localStorage.getItem('lgm_user'));
let delivery = 5000;
let total = 0;

function showCart(){
  if(cart.length === 0){ document.getElementById('cartSummary').innerHTML = "<p>Cart is empty</p>"; return; }
  let h = ''; total = 0;
  cart.forEach(item=>{
    let subtotal = item.price * item.qty;
    total += subtotal;
    let vendorName = item.vendor_email? item.vendor_email.split('@')[0] : 'Unknown';
    h += `<div class="order-item"><div>${item.name} x${item.qty} <span class="vendor-tag">${vendorName}</span></div><div>₦${subtotal.toLocaleString()}</div></div>`;
  });
  let grand = total + delivery;
  h += `<div class="order-item"><div>Delivery Fee</div><div>₦${delivery.toLocaleString()}</div></div>`;
  h += `<div class="total-row"><div>Total</div><div>₦${grand.toLocaleString()}</div></div>`;
  document.getElementById('cartSummary').innerHTML = h;
  document.getElementById('grandTotal').innerText = grand.toLocaleString();
}
showCart();

async function payWithFlutterwave(){
  if(!curUser){ alert('Please login first'); window.location.href='index.html#login'; return; }
  const name = document.getElementById('cName').value;
  const phone = document.getElementById('cPhone').value;
  const address = document.getElementById('cAddress').value;
  if(!name ||!phone ||!address) return alert('Fill all fields');

  const vendorSubaccounts = {
    "emiguni.test@gmail.com": "RS_B21E99467BC252AB12248D9144B47E1F",
    "deborah.test@gmail.com": "RS_2E5BAAE79F5E3758D3D477C350701B00"
  }

  const vendorTotals = {};
  cart.forEach(item => {
    if(!item.vendor_email) return;
    if(!vendorTotals[item.vendor_email]){ vendorTotals[item.vendor_email] = 0; }
    vendorTotals[item.vendor_email] += item.price * item.qty;
  });

  const subaccounts = Object.keys(vendorTotals).map(email => ({
    id: vendorSubaccounts[email],
    transaction_charge_type: "percentage",
    transaction_charge: 90
  })).filter(s => s.id); // remove if subaccount missing

  if(subaccounts.length === 0) return alert('No vendor subaccount found');

  const grandTotal = total + delivery;

  FlutterwaveCheckout({
    public_key: FLW_PUBLIC_KEY,
    tx_ref: "lgm_" + Date.now(),
    amount: grandTotal,
    currency: "NGN",
    customer: { email: curUser.email, name: name, phone_number: phone },
    customizations: { title: "Lokoja Grocery Mall", description: "Multi-Vendor Order", logo: "https://y-mall.vercel.app/logo.png" },
    subaccounts: subaccounts,
    callback: function(response) {
      if(response.status === "successful"){
        saveOrder(response.tx_ref, name, phone, address, grandTotal);
      } else { alert('Payment failed or cancelled'); }
    },
    onclose: function() {}
  });
}

async function saveOrder(tx_ref, name, phone, address, grandTotal){
  const {data, error} = await supabaseClient.from('orders').insert({
    tx_ref: tx_ref, customer_id: curUser.id, customer_name: name, customer_email: curUser.email,
    customer_phone: phone, customer_address: address, items: cart, subtotal: total,
    delivery_fee: delivery, total: grandTotal, payment_status: true, status: 'paid', created_at: new Date().toISOString()
  }).select().single();
  if(error){ alert('Order failed: '+error.message); return; }

  // Split to vendors
  const vendors = [...new Set(cart.map(i=>i.vendor_id).filter(Boolean))];
  for(let vid of vendors){
    let vendorItems = cart.filter(i=>i.vendor_id===vid);
    await supabaseClient.from('vendor_orders').insert({
      order_id: data.id, vendor_id: vid, vendor_email: vendorItems[0].vendor_email,
      items: vendorItems, subtotal: vendorItems.reduce((s,i)=>s+i.price*i.qty,0), status: 'new'
    });
  }

  localStorage.removeItem('lgm_cart');
  alert('Payment Successful! Order #'+data.id);
  window.location.href = 'customer.html';
}
</script>
</body>
</html>
