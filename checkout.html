<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Lokoja Grocery Mall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#f8fafc;margin:0;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}
h2{margin:0 0 12px 0}
input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer;font-size:16px}
.small{font-size:12px;color:#6b7280}
.order-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:8px}
</style>
</head>
<body>

<div class="card">
<h2>📦 Checkout</h2>
<div id="cartSummary"></div>
</div>

<div class="card">
<h3>Delivery Details</h3>
<input id="cName" placeholder="Full Name">
<input id="cPhone" placeholder="Phone Number 080...">
<input id="cAddress" placeholder="Delivery Address in Lokoja">
<button class="btn" onclick="placeOrder()">Place Order</button>
<p class="small">You will pay on delivery. Vendor gets 90%, Platform takes 10%</p>
</div>

<script>
const SUPABASE_URL = "https://yhfxmrpqaccbllszoxyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3uO2j_zawoVShgZrdrkeYA_P2jSIes9";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let cart = JSON.parse(localStorage.getItem('lgm_cart')) || [];
let curUser = JSON.parse(localStorage.getItem('lgm_user'));

function showCart(){
  if(cart.length === 0){ document.getElementById('cartSummary').innerHTML = "<p>Cart is empty</p>"; return; }
  let h = ''; let total = 0;
  cart.forEach(item=>{
    let subtotal = item.price * item.qty;
    total += subtotal;
    h += `<div class="order-item"><div>${item.name} x${item.qty}</div><div>₦${subtotal.toLocaleString()}</div></div>`;
  });
  let delivery = 5000; // flat delivery fee
  h += `<div class="order-item"><div>Delivery Fee</div><div>₦${delivery.toLocaleString()}</div></div>`;
  h += `<div class="total-row"><div>Total</div><div>₦${(total + delivery).toLocaleString()}</div></div>`;
  document.getElementById('cartSummary').innerHTML = h;
}
showCart();

async function placeOrder(){
  if(!curUser){ alert('Please login first'); window.location.href='login.html'; return; }
  const name = document.getElementById('cName').value;
  const phone = document.getElementById('cPhone').value;
  const address = document.getElementById('cAddress').value;
  if(!name || !phone || !address) return alert('Fill all fields');

  let total = cart.reduce((sum,i)=> sum + (i.price * i.qty), 0) + 5000;
  let vendor_email = cart[0].vendor_email; // assumes 1 vendor per cart for now

  const {data, error} = await supabaseClient.from('orders').insert({
    customer_name: name,
    customer_email: curUser.email, // THIS IS KEY FOR CUSTOMER DASHBOARD
    customer_phone: phone,
    customer_address: address,
    items: cart,
    total: total,
    vendor_email: vendor_email,
    status: 'paid',
    created_at: new Date().toISOString()
  }).select();

  if(error){ alert('Order failed: '+error.message); return; }
  
  // Send WhatsApp to vendor
  let msg = `New Order #${data[0].id} ₦${total.toLocaleString()}\nCustomer: ${name}\nPhone: ${phone}\nAddress: ${address}`;
  window.open(`https://wa.me/234?text=${encodeURIComponent(msg)}`, '_blank');

  localStorage.removeItem('lgm_cart');
  alert('Order Placed Successfully!');
  window.location.href = 'customer.html'; // Send customer to their dashboard
}
</script>
</body>
</html>
