<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart - Lokoja Grocery Mall</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 min-h-screen">
<header class="bg-white shadow p-3 flex justify-between items-center sticky top-0">
<a href="index.html" class="font-black text-green-700">← Back to Shopping</a>
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">Cart</span>
</header>

<div class="p-4 max-w-xl mx-auto">
<div id="emptyDiv" class="text-center py-20">
<div class="text-6xl mb-3">🛒</div>
<p class="font-bold">Your cart is empty</p>
<a href="index.html" class="inline-block mt-4 bg-green-600 text-white px-6 py-3 rounded-xl font-bold">Start Shopping</a>
</div>

<div id="cartDiv" class="hidden">
<div id="items"></div>

<div class="bg-white rounded-2xl shadow p-4 mt-4">
<div class="flex justify-between text-sm mb-2"><span>Subtotal (<span id="count">0</span> items)</span><b id="sub">₦0</b></div>
<div class="flex justify-between text-sm mb-2"><span>Delivery (Lokoja)</span><b>₦1,000</b></div>
<hr class="my-2">
<div class="flex justify-between font-black text-lg"><span>Total</span><span id="total" class="text-green-700">₦0</span></div>
</div>

<div class="bg-white rounded-2xl shadow p-4 mt-4">
<p class="font-black text-sm mb-2">Delivery Details</p>
<input id="name" placeholder="Full Name" class="w-full border-2 p-3 rounded-xl mb-2 text-sm">
<input id="phone" placeholder="Phone 080..." class="w-full border-2 p-3 rounded-xl mb-2 text-sm">
<input id="addr" placeholder="Address e.g Ganaja" class="w-full border-2 p-3 rounded-xl mb-2 text-sm">
</div>

<button onclick="checkout()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black mt-4">Checkout • Pay on Delivery</button>
<p id="msg" class="text-center text-sm font-bold mt-3"></p>
</div>
</div>

<script>
function getCart(){return JSON.parse(localStorage.getItem('lgm_cart')||'[]');}
function saveCart(c){localStorage.setItem('lgm_cart',JSON.stringify(c));}
function load(){
let cart=getCart();
let emptyDiv=document.getElementById('emptyDiv');
let cartDiv=document.getElementById('cartDiv');
if(cart.length===0){emptyDiv.classList.remove('hidden');cartDiv.classList.add('hidden');return;}
emptyDiv.classList.add('hidden');cartDiv.classList.remove('hidden');
let itemsDiv=document.getElementById('items');itemsDiv.innerHTML='';
let sub=0;let totalQty=0;
cart.forEach((it,i)=>{
sub+=it.price*it.qty;totalQty+=it.qty;
let d=document.createElement('div');
d.className='bg-white rounded-2xl shadow p-3 flex gap-3 mb-3';
d.innerHTML=`<img src="${it.image||'https://via.placeholder.com/80'}" class="w-16 h-16 object-cover rounded-xl"><div class="flex-1"><p class="font-bold text-xs">${it.name}</p><p class="text-green-700 font-black text-xs">₦${Number(it.price).toLocaleString()}</p><div class="flex items-center gap-2 mt-2"><button onclick="chg(${i},-1)" class="w-7 h-7 bg-gray-100 rounded-full font-bold">-</button><span class="font-bold text-sm w-6 text-center">${it.qty}</span><button onclick="chg(${i},1)" class="w-7 h-7 bg-green-600 text-white rounded-full font-bold">+</button><span class="ml-auto font-bold text-xs">₦${(it.price*it.qty).toLocaleString()}</span></div></div><button onclick="del(${i})" class="text-red-400">✕</button>`;
itemsDiv.appendChild(d);
});
document.getElementById('count').innerText=totalQty;
document.getElementById('sub').innerText='₦'+sub.toLocaleString();
document.getElementById('total').innerText='₦'+(sub+1000).toLocaleString();
}
function chg(i,d){let c=getCart();c[i].qty=Math.max(1,c[i].qty+d);saveCart(c);load();}
function del(i){let c=getCart();if(!confirm('Remove?'))return;c.splice(i,1);saveCart(c);load();}
function checkout(){
let n=document.getElementById('name').value;
let p=document.getElementById('phone').value;
let a=document.getElementById('addr').value;
if(!n||!p||!a){alert('Fill name phone address');return;}
document.getElementById('msg').innerText='✅ Order placed! We will call '+p+' soon! Order: '+getCart().map(x=>x.name+' x'+x.qty).join(', ');
document.getElementById('msg').className='text-center text-sm font-bold mt-3 text-green-600';
localStorage.removeItem('lgm_cart');
setTimeout(()=>{location.href='index.html';},3000);
}
load();
</script>
</body>
</html>
